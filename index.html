<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Studio Smart</title>
<meta name="theme-color" content="#172033">
<meta name="description" content="Il tuo tutor per studiare: compiti guidati, agenda, voti e ripasso.">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --soft:#F0F2F5; --line:#E3E6EC; --line2:#EEF0F4;
  --ink:#172033; --ink2:#5B6577; --pri:#3451D1; --pri-ink:#26399B; --pri-soft:#E3E8FB;
  --dark:#172033; --dark2:#26314A; --on-dark2:#C2C9D8;
  --warm:#9A4316; --warm-soft:#FCEFE6; --warm-line:#F1C8AE;
  --ok:#0F766E; --ok-soft:#E3F4F1; --bad:#B42318; --bad-soft:#FDECEA;
  --shadow:0 1px 2px rgba(23,32,51,.04);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:16px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1522; --card:#182033; --soft:#1F2940; --line:#2A3550; --line2:#232D45;
  --ink:#E8ECF4; --ink2:#A3AEC4; --pri:#7E98F2; --pri-ink:#B4C4FA; --pri-soft:#243156;
  --dark:#232E4A; --dark2:#2E3A5C; --on-dark2:#C2C9D8;
  --warm:#F2A877; --warm-soft:#3A2618; --warm-line:#5A3A24;
  --ok:#4CC9AE; --ok-soft:#163A35; --bad:#F59A8E; --bad-soft:#3E1F1C; color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --card:#182033; --soft:#1F2940; --line:#2A3550; --line2:#232D45;
  --ink:#E8ECF4; --ink2:#A3AEC4; --pri:#7E98F2; --pri-ink:#B4C4FA; --pri-soft:#243156;
  --dark:#232E4A; --dark2:#2E3A5C; --on-dark2:#C2C9D8;
  --warm:#F2A877; --warm-soft:#3A2618; --warm-line:#5A3A24;
  --ok:#4CC9AE; --ok-soft:#163A35; --bad:#F59A8E; --bad-soft:#3E1F1C; color-scheme:dark;
}}
:root[data-size="big"]{--fs:18px}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:8px}
sup{font-size:.7em;line-height:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1{font-size:1.65em;line-height:1.15;margin:0;letter-spacing:-.025em;font-weight:800}
h2{font-size:1.08em;margin:0;font-weight:800;letter-spacing:-.01em}
h3{font-size:1em;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:.84em} .xs{font-size:.76em}
.b{font-weight:700} .xb{font-weight:800}

/* struttura */
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0;max-width:760px;margin:0 auto;width:100%;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 110px;display:flex;flex-direction:column;gap:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7em;font-weight:600;color:var(--ink2);padding:4px 0}
.nav button svg{width:23px;height:23px}
.nav button.act{color:var(--pri);font-weight:800}
.nav.g{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (min-width:900px){
  .nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;width:210px;border-top:0;border-right:1px solid var(--line);padding:22px 12px}
  .nav button{flex-direction:row;gap:12px;font-size:.92em;padding:11px 14px;border-radius:12px;justify-content:flex-start}
  .nav button.act{background:var(--pri-soft)}
  .nav .brandside{display:flex}
  main{padding-top:28px;padding-bottom:40px}
}
.brandside{display:none;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800}

/* elementi */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.06em;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--pri);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri-ink);font-weight:800;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flush{padding:0}
.card.warn{border-color:var(--warm-line)}
.dark{background:var(--dark);color:#fff;border-radius:20px;padding:18px}
.dark .muted{color:var(--on-dark2)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec a,.link{color:var(--pri);font-weight:700;font-size:.84em;text-decoration:none;background:none;border:0;padding:4px 0}
.label{font-size:.78em;font-weight:800;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:0 18px;min-height:46px;font-weight:700;font-size:.92em;background:var(--pri);color:#fff}
:root[data-theme="dark"] .btn:not(.ghost):not(.soft):not(.danger){color:#0F1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.soft):not(.danger){color:#0F1522}}
.btn.soft{background:var(--pri-soft);color:var(--pri-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:.82em;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:46px;height:46px;border-radius:14px;border:0;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn.pri{background:var(--pri);color:#fff}
.icon-btn svg{width:22px;height:22px}
.icon-btn.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);border:0;white-space:nowrap}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.pri{background:var(--pri-soft);color:var(--pri-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{min-height:34px;padding:0 13px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.big{height:10px}
.list>*{padding:13px 16px;border-bottom:1px solid var(--line2)}
.list>*:last-child{border-bottom:0}
.tag{width:5px;align-self:stretch;border-radius:3px;flex:none}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:.84em;font-weight:700;color:var(--ink2)}
.seg button.act{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);min-height:46px}
textarea.field{min-height:90px;resize:vertical}
.field:focus{outline:2px solid var(--pri);border-color:transparent}
.flabel{display:block;font-size:.8em;font-weight:700;color:var(--ink2);margin:0 0 5px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}
.empty{text-align:center;padding:22px 12px;color:var(--ink2);font-size:.9em}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.day{text-align:center;padding:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);position:relative}
.day.act{background:var(--dark);border-color:var(--dark);color:#fff}
.day.act .muted{color:var(--on-dark2)}
.day b{display:block;font-size:1.02em}
.day .dots{display:flex;gap:3px;justify-content:center;height:6px;margin-top:2px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.lesson{display:flex;gap:12px}
.lesson .hour{width:48px;flex:none;padding-top:11px}
.lesson .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;overflow:hidden;min-width:0}
.lesson .box>div:last-child{flex:1;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gradeRow{display:flex;align-items:center;gap:12px}
.gradeRow .bar{width:90px}
.gradeRow .v{width:44px;text-align:right;font-weight:800}

/* chat */
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.chathead{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 6px) 0 10px;display:flex;flex-direction:column;gap:10px}
.tutor-av{width:40px;height:40px;border-radius:12px;background:var(--dark);display:grid;place-items:center;flex:none;color:#fff}
.tutor-av svg{width:22px;height:22px}
.ai-note{font-size:.76em;color:var(--ink2);background:var(--soft);border-radius:10px;padding:7px 10px}
.msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding:6px 0 12px}
.msg{max-width:86%;padding:11px 14px;font-size:.96em;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-radius:18px 18px 6px 18px}
:root[data-theme="dark"] .msg.u{color:#0F1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.u{color:#0F1522}}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.msg .tts{background:none;border:0;color:var(--ink2);font-size:.78em;font-weight:700;padding:6px 0 0;display:inline-flex;gap:5px;align-items:center}
.listen{background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin:4px 0;display:flex;flex-direction:column;gap:8px;white-space:normal}
.typing{align-self:flex-start;color:var(--ink2);font-size:.88em;padding:6px 4px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink2);margin-right:4px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.chatbar{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.chatbar .row{align-items:flex-end}
.chatin{flex:1;min-width:0;border:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px;max-height:140px;resize:none;line-height:1.4}
.chatin:focus{outline:2px solid var(--pri);border-color:transparent}
.thumbs{display:flex;gap:8px}
.thumbs div{position:relative}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--card);font-size:13px;line-height:1}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qbar{flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);min-height:54px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{margin-bottom:4px}
.fb.ok h3{color:var(--ok)} .fb.ko h3{color:var(--bad)}
.flash{min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;font-size:1.1em}

/* lezioni fisica */
.lessonbody ul{padding-left:1.2em;margin:.4em 0}
.lessonbody p{margin:.45em 0}
.ex{background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.hl{background:linear-gradient(transparent 58%,rgba(52,81,209,.22) 58%);padding:0 2px}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:.9em;min-width:280px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{background:var(--soft)}
.ladder{display:flex;flex-direction:column;gap:3px;margin:10px 0}
.ladder span{display:inline-block;padding:5px 10px;border-radius:8px;background:var(--soft);font-weight:700;min-width:58px;text-align:center}
.ladder .base{background:var(--pri);color:#fff}
.hand{font-weight:800;color:var(--pri);font-size:1.08em;margin:6px 0}
.tri{position:relative;width:230px;height:200px;margin:10px auto 4px}
.tri .shape{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--pri);opacity:.14}
.tri .bar1{position:absolute;left:22%;right:22%;top:54%;height:3px;background:var(--ink)}
.tri .mid{position:absolute;left:50%;top:64%;width:3px;height:30%;background:var(--ink);transform:translateX(-50%)}
.tri button{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:1.35em;font-weight:800;font-style:italic}
.tri button.cov{background:var(--ink);color:var(--card)}
.tri .t{left:50%;top:18%;transform:translateX(-50%)} .tri .l{left:12%;bottom:4%} .tri .r{right:12%;bottom:4%}

/* fogli */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;z-index:60;font-size:.9em;max-width:90vw;text-align:center}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.pin{display:flex;gap:10px}
.pin input{width:52px;height:58px;text-align:center;font-size:1.5em;font-weight:800;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.prova-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warm-soft);color:var(--warm);border-bottom:1px solid var(--warm-line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;font-size:.84em;font-weight:700}
.prova-bar .grow{min-width:160px}
.prova-bar button{border:1px solid var(--warm-line);background:var(--card);color:var(--warm);border-radius:10px;padding:7px 12px;font-weight:800}
.gbtns{display:flex;gap:8px;flex-wrap:wrap}

</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// ===== CONTENUTI: 9 argomenti di fisica per la 1ª superiore =====
const TOPICS = [
{ id:1, color:"#2457D6", title:"Grandezze fisiche e Sistema Internazionale", short:"Grandezze fisiche",
  sub:"Cosa si misura, fondamentali e derivate, unità SI",
  lessons:[
   {t:"Che cos’è una grandezza fisica", h:`
    <p>Una <span class="hl">grandezza fisica</span> è una caratteristica che si può <b>misurare</b> con uno strumento e che dà lo stesso risultato per tutti.</p>
    <div class="ex"><b>Sì:</b> la lunghezza del banco, la massa dello zaino, il tempo di una corsa, la temperatura della stanza.</div>
    <div class="ex"><b>No:</b> la bellezza di un quadro, la simpatia di un amico, il coraggio. Non esiste uno strumento che li misuri per tutti allo stesso modo.</div>`},
   {t:"Misurare = confrontare", h:`
    <p><b>Misurare</b> vuol dire confrontare una grandezza con un’altra della stessa specie scelta come <span class="hl">unità di misura</span>, e contare quante volte ci sta.</p>
    <div class="ex"><b>Esempio:</b> il banco è lungo 1,2 m: il metro “ci sta” 1,2 volte.</div>
    <p>Una misura ha sempre <b>due parti</b>: il numero e l’unità. Scrivere solo “1,2” non vuol dire niente!</p>
    <div class="ex"><b>Come in ragioneria:</b> “costa 15” non basta, serve dire 15 € o 15 $.</div>`},
   {t:"Il Sistema Internazionale (SI)", h:`
    <p>Per capirsi in tutto il mondo si usa il <b>Sistema Internazionale</b>, che fissa <span class="hl">7 grandezze fondamentali</span>, ognuna con la sua unità:</p>
    <div class="tbl"><table><tr><th>Grandezza</th><th>Unità</th><th>Simbolo</th></tr>
    <tr><td>lunghezza</td><td>metro</td><td>m</td></tr><tr><td>massa</td><td>kilogrammo</td><td>kg</td></tr>
    <tr><td>tempo</td><td>secondo</td><td>s</td></tr><tr><td>temperatura</td><td>kelvin</td><td>K</td></tr>
    <tr><td>intensità di corrente</td><td>ampere</td><td>A</td></tr><tr><td>quantità di sostanza</td><td>mole</td><td>mol</td></tr>
    <tr><td>intensità luminosa</td><td>candela</td><td>cd</td></tr></table></div>
    <p class="small muted">Le più usate quest’anno: lunghezza, massa e tempo.</p>`},
   {t:"Grandezze derivate", h:`
    <p>Le <span class="hl">grandezze derivate</span> si ottengono combinando quelle fondamentali con moltiplicazioni e divisioni.</p>
    <div class="tbl"><table><tr><th>Grandezza</th><th>Come si ottiene</th><th>Unità SI</th></tr>
    <tr><td>area</td><td>lunghezza × lunghezza</td><td>m²</td></tr>
    <tr><td>volume</td><td>lunghezza × lunghezza × lunghezza</td><td>m³</td></tr>
    <tr><td>velocità</td><td>lunghezza ÷ tempo</td><td>m/s</td></tr>
    <tr><td>densità</td><td>massa ÷ volume</td><td>kg/m³</td></tr></table></div>`},
   {t:"Come si scrivono le unità", h:`
    <ul><li>Il simbolo va <b>dopo</b> il numero, con uno spazio: <b>5 kg</b>.</li>
    <li>Niente punto dopo il simbolo: <b>20 s</b>, non “20 sec.”</li>
    <li>Maiuscole e minuscole contano: <b>km</b> (non Km), <b>m</b> (non M o mt), <b>kg</b> (non Kg).</li>
    <li>Il simbolo non ha plurale: <b>3 kg</b>, non “3 kgs”.</li></ul>
    <div class="ex"><b>Attenzione:</b> M maiuscola vuol dire “mega” (un milione), m minuscola “metro” o “milli”. Cambia tutto!</div>`}
  ],
  tricks:[
   {t:"Le 7 fondamentali in una frase", hand:"Luca Mangia Tre Torte, Carla Quattro Insalate", h:`<p>Le iniziali: <b>L</b>unghezza, <b>M</b>assa, <b>T</b>empo, <b>T</b>emperatura, <b>C</b>orrente, <b>Q</b>uantità di sostanza, <b>I</b>ntensità luminosa.</p>`},
   {t:"Fondamentale o derivata?", hand:"Ha una formula? Allora è derivata!", h:`<p>Se per calcolarla devi fare un’operazione con altre grandezze (÷ o ×), è derivata. La velocità è spazio ÷ tempo → derivata.</p>`},
   {t:"Misura o opinione?", hand:"Se due persone possono litigare sul risultato, non è una grandezza fisica", h:`<p>La lunghezza del banco è uguale per tutti. Quanto è bello il banco… dipende da chi lo guarda!</p>`},
   {t:"I simboli sono “nomi propri”", hand:"kg, m, s: sempre minuscoli, senza punto, senza plurale", h:`<p>Scrivili sempre uguali, come la sigla di una provincia: TV non diventa “Tv.”</p>`}
  ],
  formulas:[["Misura","numero + unità (es. 5 kg)"],["Area","m²"],["Volume","m³"],["Velocità","m/s"],["Densità","kg/m³"]]
},
{ id:2, color:"#12945F", title:"Multipli, sottomultipli ed equivalenze", short:"Equivalenze",
  sub:"La scaletta delle unità: lunghezza, superficie, volume, massa, tempo",
  lessons:[
   {t:"Multipli e sottomultipli", h:`
    <p>Per non scrivere numeri lunghissimi si usano i <span class="hl">prefissi</span> davanti all’unità:</p>
    <div class="tbl"><table><tr><th>Prefisso</th><th>Simbolo</th><th>Vale</th></tr>
    <tr><td>kilo</td><td>k</td><td>× 1000</td></tr><tr><td>etto</td><td>h</td><td>× 100</td></tr>
    <tr><td>deca</td><td>da</td><td>× 10</td></tr><tr><td><b>unità</b></td><td></td><td>× 1</td></tr>
    <tr><td>deci</td><td>d</td><td>÷ 10</td></tr><tr><td>centi</td><td>c</td><td>÷ 100</td></tr>
    <tr><td>milli</td><td>m</td><td>÷ 1000</td></tr></table></div>
    <p class="small muted">Più grandi: mega (M) = un milione, giga (G) = un miliardo. Più piccoli: micro (µ) = un milionesimo.</p>`},
   {t:"La scaletta della lunghezza", h:`
    <div class="ladder"><div><span>km</span></div><div><span>hm</span></div><div><span>dam</span></div><div><span class="base">m</span></div><div><span>dm</span></div><div><span>cm</span></div><div><span>mm</span></div></div>
    <p>Ogni gradino vale <b>× 10</b>. <b>Scendi</b> (verso unità più piccole) → <b>moltiplichi</b>. <b>Sali</b> → <b>dividi</b>.</p>
    <div class="ex"><b>Esempio:</b> 3,5 km in m: scendi 3 gradini → × 1000 → <b>3500 m</b>.</div>
    <p>Per la massa la scaletta è uguale: kg, hg, dag, <b>g</b>, dg, cg, mg. Per la capacità: kL, hL, daL, <b>L</b>, dL, cL, mL.</p>`},
   {t:"Superficie: gradini da 100", h:`
    <p>Per le aree (m²) ogni gradino vale <b>× 100</b>, cioè 2 zeri.</p>
    <div class="ex"><b>Perché?</b> Un quadrato di 1 m di lato è lungo 10 dm per 10 dm: dentro ci stanno 10 × 10 = 100 dm².</div>
    <div class="ex"><b>Esempio:</b> 4 m² in cm²: scendi 2 gradini → × 100 × 100 = × 10 000 → <b>40 000 cm²</b>.</div>`},
   {t:"Volume: gradini da 1000", h:`
    <p>Per i volumi (m³) ogni gradino vale <b>× 1000</b>, cioè 3 zeri: m³, dm³, cm³, mm³.</p>
    <div class="ex"><b>Esempio:</b> 2 dm³ in cm³ → × 1000 → <b>2000 cm³</b>.</div>
    <p>Volume e capacità si collegano così:</p>
    <ul><li><b>1 dm³ = 1 L</b> (un cubo di 10 cm di lato contiene un litro)</li><li><b>1 cm³ = 1 mL</b></li><li><b>1 m³ = 1000 L</b></li></ul>`},
   {t:"Il tempo non è decimale", h:`
    <p>Il tempo non va di 10 in 10, ma di <b>60</b>:</p>
    <ul><li>1 h = 60 min</li><li>1 min = 60 s</li><li>1 h = 3600 s</li></ul>
    <div class="ex"><b>Esempio:</b> 1,5 h = 1,5 × 3600 = <b>5400 s</b>. Attenzione: 1,5 h è un’ora e mezza, <b>non</b> 1 h e 50 min!</div>
    <p>Velocità: per passare da <b>km/h a m/s dividi per 3,6</b>; da m/s a km/h moltiplica per 3,6.</p>
    <div class="ex"><b>Esempio:</b> 72 km/h ÷ 3,6 = <b>20 m/s</b>.</div>`}
  ],
  tricks:[
   {t:"L’ordine dei prefissi", hand:"Ken Ha Dato Un Dolce a Cinzia e Marco", h:`<p><b>k</b>ilo, <b>h</b>etto (etto), <b>da</b> (deca), <b>U</b>nità, <b>d</b>eci, <b>c</b>enti, <b>m</b>illi. Dall’alto verso il basso.</p>`},
   {t:"Su o giù?", hand:"Scendi la scala: il numero cresce", h:`<p>Unità più piccola = ce ne vogliono di più = numero più grande. 1 m = 100 cm: il centimetro è piccolo, quindi il numero è grande.</p>`},
   {t:"Quanti zeri per gradino?", hand:"L’esponente ti dice gli zeri: m → 1, m² → 2, m³ → 3", h:`<p>Lunghezza: 1 zero per gradino. Superficie (²): 2 zeri. Volume (³): 3 zeri.</p>`},
   {t:"Litri e cubi", hand:"Un litro è un cubo di 10 cm", h:`<p>Pensa a un cartone del latte: circa 1 L = 1 dm³. E 1 mL è un cubetto di 1 cm di lato, come un dado da gioco.</p>`},
   {t:"km/h e m/s", hand:"Per andare forte (km/h) moltiplica per 3,6", h:`<p>I km/h sono sempre il numero più grande. 10 m/s × 3,6 = 36 km/h.</p>`}
  ],
  formulas:[["Lunghezza, massa, capacità","1 gradino = × 10"],["Superficie","1 gradino = × 100"],["Volume","1 gradino = × 1000"],["1 dm³","= 1 L"],["1 cm³","= 1 mL"],["1 h","= 60 min = 3600 s"],["km/h → m/s","÷ 3,6"]]
},
{ id:3, color:"#7C4DDB", title:"Notazione scientifica e ordini di grandezza", short:"Notazione scientifica",
  sub:"Numeri enormi e minuscoli scritti in modo comodo",
  lessons:[
   {t:"Le potenze di 10", h:`
    <p>10<sup>n</sup> è un 1 seguito da <b>n zeri</b>: 10<sup>3</sup> = 1000, 10<sup>6</sup> = 1 000 000.</p>
    <p>Con l’esponente negativo è un numero piccolo: 10<sup>−1</sup> = 0,1; 10<sup>−3</sup> = 0,001.</p>
    <div class="ex"><b>Regola:</b> 10<sup>−n</sup> ha la cifra 1 all’<b>n-esimo</b> posto dopo la virgola.</div>
    <p>E 10<sup>0</sup> = 1.</p>`},
   {t:"Notazione scientifica", h:`
    <p>Un numero è in <span class="hl">notazione scientifica</span> quando è scritto così:</p>
    <p style="text-align:center;font-size:1.3em"><b>a · 10<sup>n</sup></b></p>
    <p>dove <b>a</b> è compreso tra 1 e 10 (1 incluso, 10 escluso) e <b>n</b> è un intero.</p>
    <div class="ex"><b>Giusto:</b> 3,5 · 10<sup>4</sup><br><b>Sbagliato:</b> 35 · 10<sup>3</sup> (35 è più grande di 10) e 0,35 · 10<sup>5</sup> (0,35 è più piccolo di 1).</div>`},
   {t:"Come si trasforma un numero", h:`
    <p>Sposta la virgola finché davanti resta <b>una sola cifra diversa da zero</b>, e conta i salti.</p>
    <div class="ex"><b>Numero grande:</b> 45 000 → 4,5 → la virgola salta 4 posti a sinistra → <b>4,5 · 10<sup>4</sup></b></div>
    <div class="ex"><b>Numero piccolo:</b> 0,0032 → 3,2 → la virgola salta 3 posti a destra → <b>3,2 · 10<sup>−3</sup></b></div>`},
   {t:"Calcolare con le potenze", h:`
    <ul><li><b>Moltiplicazione:</b> moltiplichi i numeri e <b>sommi</b> gli esponenti.<br>(2 · 10<sup>3</sup>) · (4 · 10<sup>5</sup>) = 8 · 10<sup>8</sup></li>
    <li><b>Divisione:</b> dividi i numeri e <b>sottrai</b> gli esponenti.<br>(9 · 10<sup>7</sup>) : (3 · 10<sup>2</sup>) = 3 · 10<sup>5</sup></li></ul>
    <p class="small muted">Se il risultato ha il numero davanti ≥ 10, sistemalo: 12 · 10<sup>4</sup> = 1,2 · 10<sup>5</sup>.</p>`},
   {t:"L’ordine di grandezza", h:`
    <p>L’<span class="hl">ordine di grandezza</span> è la potenza di 10 più vicina al numero. Serve per fare stime veloci.</p>
    <p>Scrivi il numero in notazione scientifica <b>a · 10<sup>n</sup></b>:</p>
    <ul><li>se <b>a &lt; 5</b> → l’ordine è <b>10<sup>n</sup></b></li><li>se <b>a ≥ 5</b> → l’ordine è <b>10<sup>n+1</sup></b></li></ul>
    <div class="ex"><b>Esempio:</b> 3,2 · 10<sup>4</sup> → 10<sup>4</sup>; 7,1 · 10<sup>4</sup> → 10<sup>5</sup>.</div>
    <p class="small muted">Alcuni libri usano 3,16 invece di 5: controlla quale regola usa il tuo professore.</p>`}
  ],
  tricks:[
   {t:"Il segno dell’esponente", hand:"Numero grande → esponente positivo. Numero piccolo (sotto 1) → esponente negativo", h:`<p>Prima di contare i salti, decidi il segno guardando il numero: 0,0007 è piccolo, quindi l’esponente sarà negativo.</p>`},
   {t:"Contare i salti", hand:"Ogni salto della virgola = 1 nell’esponente", h:`<p>Metti il dito sulla virgola e saltella fino a dopo la prima cifra diversa da zero. Quanti salti? Quello è l’esponente.</p>`},
   {t:"Prodotto e divisione", hand:"Per (×) le potenze si sommano, per (÷) si sottraggono", h:`<p>10<sup>3</sup> × 10<sup>2</sup> = 10<sup>5</sup> perché 1000 × 100 = 100 000: hai messo insieme gli zeri.</p>`},
   {t:"Ordine di grandezza", hand:"Da 5 in su si arrotonda in su", h:`<p>Come con i voti: 6,5 diventa 7. Così 6 · 10<sup>3</sup> ha ordine 10<sup>4</sup>.</p>`}
  ],
  formulas:[["Notazione scientifica","a · 10ⁿ con 1 ≤ a < 10"],["Prodotto","10ᵃ · 10ᵇ = 10ᵃ⁺ᵇ"],["Divisione","10ᵃ : 10ᵇ = 10ᵃ⁻ᵇ"],["10⁰","= 1"],["Ordine di grandezza","a < 5 → 10ⁿ; a ≥ 5 → 10ⁿ⁺¹"]]
},
{ id:4, color:"#D46A00", title:"Strumenti di misura: portata e sensibilità", short:"Strumenti di misura",
  sub:"Fin dove misura uno strumento e quanto è preciso",
  lessons:[
   {t:"Gli strumenti di misura", h:`
    <p>Ogni grandezza ha i suoi strumenti:</p>
    <ul><li><b>lunghezza:</b> righello, metro a nastro, calibro</li><li><b>massa:</b> bilancia</li><li><b>tempo:</b> cronometro</li><li><b>temperatura:</b> termometro</li></ul>
    <p>Per scegliere lo strumento giusto guardiamo due caratteristiche: la <b>portata</b> e la <b>sensibilità</b>.</p>`},
   {t:"La portata", h:`
    <p>La <span class="hl">portata</span> è il <b>valore più grande</b> che lo strumento può misurare.</p>
    <div class="ex"><b>Esempi:</b> un righello da 30 cm ha portata 30 cm; una bilancia da cucina che arriva a 5 kg ha portata 5 kg.</div>
    <p>Se l’oggetto supera la portata, lo strumento non va bene (o devi fare più misure, sommando gli errori).</p>`},
   {t:"La sensibilità", h:`
    <p>La <span class="hl">sensibilità</span> è la <b>più piccola variazione</b> che lo strumento riesce a misurare: in pratica, il valore di <b>una tacca</b>.</p>
    <div class="ex"><b>Esempio:</b> un righello con le tacche dei millimetri ha sensibilità 1 mm = 0,1 cm.</div>
    <p>Come si calcola: <b>sensibilità = intervallo della scala ÷ numero di tacche (intervalli)</b>.</p>
    <div class="ex"><b>Esempio:</b> scala da 0 a 50 cm con 500 intervalli → 50 ÷ 500 = <b>0,1 cm</b>.</div>`},
   {t:"Più sensibile = tacca più piccola", h:`
    <p>Uno strumento è <b>più sensibile</b> quando la sua sensibilità è un numero <b>più piccolo</b>: nota differenze minori.</p>
    <div class="ex"><b>Esempio:</b> un calibro da 0,05 mm è più sensibile di un righello da 1 mm.</div>
    <p>La misura si scrive con le cifre che lo strumento permette di leggere: con un righello da 1 mm scrivi <b>12,3 cm</b>, non 12,35 cm.</p>`},
   {t:"Altre caratteristiche", h:`
    <ul><li><b>Prontezza:</b> quanto velocemente lo strumento dà la misura (un termometro digitale è più pronto di quello a mercurio).</li>
    <li><b>Strumenti analogici:</b> hanno una scala con le tacche e un indice.</li>
    <li><b>Strumenti digitali:</b> mostrano direttamente le cifre; la sensibilità è l’ultima cifra che cambia.</li></ul>`}
  ],
  tricks:[
   {t:"Portata", hand:"Portata = fin dove PORTA lo strumento", h:`<p>È il massimo, il fondo scala. Come la portata di un camion: oltre non ci sta.</p>`},
   {t:"Sensibilità", hand:"Una persona sensibile nota anche le piccole cose", h:`<p>Uno strumento sensibile nota piccole differenze. Più la tacca è piccola, più è sensibile.</p>`},
   {t:"Calcolo della sensibilità", hand:"Quanto è lunga la scala ÷ quante tacche", h:`<p>È come dividere una pizza: 50 cm divisi in 500 fette = ogni fetta 0,1 cm.</p>`},
   {t:"Quante cifre scrivo?", hand:"L’ultima cifra della misura è quella della tacca", h:`<p>Se la sensibilità è 0,1 cm, la misura ha una cifra dopo la virgola in cm: 12,3 cm.</p>`}
  ],
  formulas:[["Portata","valore massimo misurabile"],["Sensibilità","intervallo della scala ÷ n° di intervalli"],["Più sensibile","sensibilità più piccola"]]
},
{ id:5, color:"#D63B3B", title:"Errori di misura", short:"Errori di misura",
  sub:"Valore medio, errore assoluto, relativo e percentuale",
  lessons:[
   {t:"Ogni misura ha un errore", h:`
    <p>Nessuna misura è perfetta: c’è sempre un’<span class="hl">incertezza</span>.</p>
    <ul><li><b>Errori casuali:</b> a volte in più, a volte in meno (riflessi, posizione dell’occhio). Si riducono ripetendo la misura.</li>
    <li><b>Errori sistematici:</b> sempre nello stesso verso (strumento tarato male, bilancia che non parte da zero).</li></ul>`},
   {t:"Una sola misura", h:`
    <p>Se misuri una volta sola, l’errore è la <b>sensibilità dello strumento</b>.</p>
    <div class="ex"><b>Esempio:</b> righello con sensibilità 0,1 cm, leggi 23,4 cm → <b>(23,4 ± 0,1) cm</b>.</div>`},
   {t:"Tante misure: il valore medio", h:`
    <p>Se ripeti la misura più volte, il valore migliore è il <span class="hl">valore medio</span>: sommi tutte le misure e dividi per quante sono.</p>
    <div class="ex"><b>Esempio:</b> 12,1 – 12,3 – 12,2 – 12,4 s → (12,1 + 12,3 + 12,2 + 12,4) ÷ 4 = <b>12,25 s</b></div>`},
   {t:"Errore assoluto", h:`
    <p>Con più misure, l’<span class="hl">errore assoluto</span> è la <b>semidispersione</b>: (valore massimo − valore minimo) ÷ 2.</p>
    <div class="ex"><b>Esempio:</b> (12,4 − 12,1) ÷ 2 = <b>0,15 s</b> → risultato: (12,25 ± 0,15) s</div>
    <p>Ha la stessa unità di misura della grandezza.</p>`},
   {t:"Errore relativo e percentuale", h:`
    <p>L’<span class="hl">errore relativo</span> dice quanto pesa l’errore rispetto alla misura: <b>Er = Ea ÷ valore medio</b>. Non ha unità.</p>
    <p>L’<b>errore percentuale</b> è lo stesso moltiplicato per 100: <b>E% = Er × 100</b>.</p>
    <div class="ex"><b>Esempio:</b> 0,15 ÷ 12,25 ≈ 0,012 → <b>1,2%</b></div>
    <p>Più l’errore relativo è piccolo, <b>più la misura è precisa</b>.</p>`}
  ],
  tricks:[
   {t:"Errore assoluto", hand:"Metà della distanza tra il più grande e il più piccolo", h:`<p>Max − min, poi diviso 2. Il risultato copre tutte le misure fatte.</p>`},
   {t:"Errore relativo", hand:"Sbagliare di 1 cm su un banco o su un campo da calcio non è la stessa cosa!", h:`<p>Per questo si divide per la misura: conta quanto è grande l’errore <b>rispetto</b> a ciò che misuri.</p>`},
   {t:"Come in ragioneria", hand:"L’errore percentuale è uno sconto al contrario", h:`<p>Er × 100 = percentuale, esattamente come calcoli il 3% di sconto su un prezzo.</p>`}
  ],
  formulas:[["Valore medio","somma delle misure ÷ numero di misure"],["Errore assoluto (1 misura)","= sensibilità"],["Errore assoluto (più misure)","(max − min) ÷ 2"],["Errore relativo","Er = Ea ÷ valore medio"],["Errore percentuale","E% = Er × 100"]]
},
{ id:6, color:"#0E8F9B", title:"Cifre significative e arrotondamenti", short:"Cifre significative",
  sub:"Quali cifre contano e come arrotondare",
  lessons:[
   {t:"Cosa sono", h:`
    <p>Le <span class="hl">cifre significative</span> sono le cifre di una misura che sono davvero state misurate (più l’ultima, incerta).</p>
    <div class="ex"><b>Esempio:</b> 12,3 cm ha 3 cifre significative.</div>`},
   {t:"Le regole degli zeri", h:`
    <ul><li>Le cifre diverse da zero contano <b>sempre</b>.</li>
    <li>Gli zeri <b>in mezzo</b> contano: 1002 → 4 cifre.</li>
    <li>Gli zeri <b>all’inizio</b> non contano mai: 0,0045 → 2 cifre.</li>
    <li>Gli zeri <b>alla fine dopo la virgola</b> contano: 3,00 → 3 cifre.</li></ul>
    <div class="ex"><b>Per questo</b> 3,0 cm e 3,00 cm non sono la stessa misura: la seconda è più precisa.</div>`},
   {t:"Arrotondare", h:`
    <p>Per tenere solo alcune cifre, guarda la <b>prima cifra che togli</b>:</p>
    <ul><li>se è <b>0, 1, 2, 3 o 4</b> → l’ultima cifra rimane uguale</li><li>se è <b>5, 6, 7, 8 o 9</b> → l’ultima cifra aumenta di 1</li></ul>
    <div class="ex"><b>Esempio:</b> 3,14159 con 3 cifre → 3,14. 12,48 con 3 cifre → 12,5.</div>`},
   {t:"Nei calcoli", h:`
    <p>Quando moltiplichi o dividi delle misure, il risultato va scritto con <b>lo stesso numero di cifre significative della misura che ne ha meno</b>.</p>
    <div class="ex"><b>Esempio:</b> 2,5 cm × 3,42 cm = 8,55 cm² → la misura “peggiore” ha 2 cifre → <b>8,6 cm²</b>.</div>`}
  ],
  tricks:[
   {t:"Gli zeri", hand:"Zeri davanti: mai. Zeri in mezzo: sempre. Zeri in fondo dopo la virgola: sì", h:`<p>Leggi il numero da sinistra: comincia a contare dalla prima cifra diversa da zero.</p>`},
   {t:"Arrotondamento", hand:"Da 5 in su si sale", h:`<p>Guardi solo la prima cifra che butti via, non le altre.</p>`},
   {t:"Calcoli", hand:"Una catena è forte come il suo anello più debole", h:`<p>Il risultato non può essere più preciso della misura meno precisa.</p>`}
  ],
  formulas:[["Zeri iniziali","non contano"],["Zeri in mezzo","contano"],["Zeri finali dopo la virgola","contano"],["Arrotondamento","≥ 5 si arrotonda in su"],["Prodotto / divisione","cifre della misura meno precisa"]]
},
{ id:7, color:"#B4530A", title:"Densità e altre grandezze derivate", short:"Densità",
  sub:"d = m / V, velocità, area e volume",
  lessons:[
   {t:"Che cos’è la densità", h:`
    <p>La <span class="hl">densità</span> dice quanta <b>massa</b> c’è in un certo <b>volume</b>. Più materia “stretta” in poco spazio = più densità.</p>
    <p style="text-align:center;font-size:1.35em"><b>d = m ÷ V</b></p>
    <div class="ex"><b>Esempio:</b> un kg di piume e un kg di ferro hanno la stessa massa, ma le piume occupano molto più spazio: hanno densità minore.</div>`},
   {t:"Le unità della densità", h:`
    <p>Nel SI: <b>kg/m³</b>. Molto usato anche <b>g/cm³</b>.</p>
    <div class="ex"><b>Regola:</b> 1 g/cm³ = 1000 kg/m³. Da g/cm³ a kg/m³ <b>moltiplichi per 1000</b>.</div>
    <p>Utile anche: 1 g/cm³ = 1 kg/dm³ = 1 kg/L.</p>
    <div class="tbl"><table><tr><th>Materiale</th><th>g/cm³</th><th>kg/m³</th></tr>
    <tr><td>sughero</td><td>0,24</td><td>240</td></tr><tr><td>legno (abete)</td><td>0,45</td><td>450</td></tr>

const rnd=Math.random;
const rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=n=>Number(Number(n).toPrecision(12));
const NF=new Intl.NumberFormat("it-IT",{maximumFractionDigits:10});
const fmt=n=>{n=clean(n);return NF.format(n).replace(/-/g,"−")};

function mc(q,correct,distr,explain){

}
function num(q,ans,explain,o={}){return{type:"num",q,answer:clean(ans),explain,unit:o.unit||"",tol:o.tol??1e-6,neg:!!o.neg}}

function makeSet(topicIds,levels,n){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard<400){guard++;const t=pick(topicIds),l=Array.isArray(levels)?levels[out.length%levels.length]:levels;
    const q=makeQuestion(t,l);if(seen.has(q.q))continue;seen.add(q.q);q.topic=t;q.level=l;out.push(q)}
  return out;
}

// fusione tra dispositivi
function mergeList(a,b,del){const m=new Map();for(const x of a||[])m.set(x.id,x);for(const y of b||[]){const x=m.get(y.id);if(!x||(y.mod||0)>(x.mod||0))m.set(y.id,y)}return [...m.values()].filter(x=>!del[x.id])}
function merge(a,b){
  if(!b||b.v!==2)return a;
  const r=JSON.parse(JSON.stringify(a));
  r.del=Object.assign({},b.del||{},a.del||{});
  for(const k of ["compiti","voti","glossario","schede"])r[k]=mergeList(a[k],b[k],r.del);
  if((b.prefMod||0)>(a.prefMod||0)){for(const k of ["nome","tutorNome","tutorSimbolo","obiettiviVoto"])r[k]=b[k];r.fis.selected=b.fis.selected;r.prefMod=b.prefMod}
  if((b.orario&&b.orario.mod||0)>(a.orario.mod||0))r.orario=b.orario;
  for(const id in (b.fis&&b.fis.topics)||{}){const x=r.fis.topics[id]||{read:[],best:{1:0,2:0,3:0},done:false,bestTest:0},y=b.fis.topics[id];
    x.read=[...new Set([...(x.read||[]),...(y.read||[])])];x.best=x.best||{};for(const l of [1,2,3])x.best[l]=Math.max(x.best[l]||0,(y.best||{})[l]||0);
    x.done=!!(x.done||y.done);x.bestTest=Math.max(x.bestTest||0,y.bestTest||0);r.fis.topics[id]=x}
  for(const k in b.tempo||{})r.tempo[k]=Math.max(r.tempo[k]||0,b.tempo[k]);
  for(const k in b.errori||{}){const x=r.errori[k],y=b.errori[k];if(!x||(y.n||0)>(x.n||0))r.errori[k]=y}
  for(const k in b.piani||{}){const x=r.piani[k],y=b.piani[k];if(!x||(y.mod||0)>(x.mod||0))r.piani[k]=y}
  for(const k in r.piani)if(r.del[k])delete r.piani[k];
  r.assegnatiFatti=[...new Set([...(a.assegnatiFatti||[]),...(b.assegnatiFatti||[])])];
  r.stat={tutor:Math.max(a.stat.tutor||0,(b.stat||{}).tutor||0),corretti:Math.max(a.stat.corretti||0,(b.stat||{}).corretti||0)};
  r.fis.stats={done:Math.max(a.fis.stats.done||0,(b.fis.stats||{}).done||0),ok:Math.max(a.fis.stats.ok||0,(b.fis.stats||{}).ok||0)};
  const RA=a.resets||{},RB=b.resets||{},sel=r.fis.selected;r.resets={};
  for(const k of RESETTABILI){const x=RA[k]||0,y=RB[k]||0;r.resets[k]=Math.max(x,y);if(x===y)continue;
    const [nuovo,vecchio,t]=y>x?[b,a,y]:[a,b,x];
    if(["compiti","voti","glossario","schede"].includes(k))r[k]=mergeList(nuovo[k]||[],(vecchio[k]||[]).filter(i=>(i.mod||0)>t),r.del);
    else r[k]=JSON.parse(JSON.stringify(nuovo[k]!==undefined?nuovo[k]:blank()[k]));
    if(k==="fis")r.fis.selected=sel}
  r.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return r}

async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

function comprimi(file,max=1568,q=.82){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
  ok(c.toDataURL("image/jpeg",q).split(",")[1])};im.onerror=ko;im.src=fr.result};fr.onerror=ko;fr.readAsDataURL(file)})}

  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;fin=t;onText(t,false)};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("Consenti l’uso del microfono per dettare")};
  rec.onend=()=>{rec=null;onEnd&&onEnd(fin)};rec.start();return rec}

async function attivaNotifiche(){
  if(!("Notification" in window)){toast("Questo browser non supporta le notifiche");return false}
  const p=await Notification.requestPermission();if(p!=="granted"){toast("Notifiche non consentite");return false}
  if(fb&&firebase.messaging&&CFG.vapidKey&&"serviceWorker" in navigator){
    try{const reg=await navigator.serviceWorker.ready;const m=firebase.messaging();
      const token=await m.getToken({vapidKey:CFG.vapidKey,serviceWorkerRegistration:reg});
      m.onMessage(pl=>{const n=pl.notification||{};toast((n.title?n.title+": ":"")+(n.body||""),6000)});
      if(ruolo==="studente"&&user){await myDoc().set({pushToken:token},{merge:true})}
      if(ruolo==="genitore"&&user){await fb.db.collection("genitori").doc(user.uid).set({tokens:firebase.firestore.FieldValue.arrayUnion(token)},{merge:true})}
      localStorage.setItem("ss-push","1");toast("Notifiche attive");return true}
    catch(e){toast("Notifiche attive solo con l’app aperta")}}
  localStorage.setItem("ss-push","local");return true}
// promemoria con l'app aperta (se le notifiche push non sono attive)
setInterval(()=>{if(ruolo==="genitore"||localStorage.getItem("ss-push")==="1")return;
  let visti={};try{visti=JSON.parse(localStorage.getItem("ss-visti")||"{}")}catch(e){}
  for(const p of promemoriaList()){const at=Date.parse(p.at);if(at<=now()&&now()-at<6*3600e3&&!visti[p.id]){visti[p.id]=1;toast(`${p.titolo}: ${p.testo}`,7000);
    if("Notification" in window&&Notification.permission==="granted"){try{new Notification(p.titolo,{body:p.testo,icon:"icon-192.png"})}catch(e){}}}}
  localStorage.setItem("ss-visti",JSON.stringify(visti))},60e3);

const media=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function medieMaterie(){const m={};for(const v of S.voti)(m[v.materia]=m[v.materia]||[]).push(+v.voto);const out={};for(const k in m)out[k]=media(m[k]);return out}

function votoNecessario(materia){const vs=S.voti.filter(v=>v.materia===materia).map(v=>+v.voto),ob=+S.obiettiviVoto[materia];if(!ob||!vs.length)return null;
  const m=media(vs);if(m>=ob)return{ok:true,m,ob};const x=ob*(vs.length+1)-vs.reduce((a,b)=>a+b,0);return{ok:false,m,ob,x:Math.ceil(x*4)/4}}
function lezioniDel(dateStr){const wd=parseD(dateStr).getDay();return wd===0?[]:(S.orario.giorni[wd]||[])}
function prossimaLezione(materia,da){for(let i=1;i<=14;i++){const d=addDays(da||today(),i);if(lezioniDel(d).includes(materia))return d}
  let d=addDays(da||today(),1);if(parseD(d).getDay()===0)d=addDays(d,1);return d}
function oraLezione(materia,dateStr){const l=lezioniDel(dateStr);const i=l.indexOf(materia);return i<0?null:i}

   <div class="stack"><p class="flabel">Inizio di ogni ora</p><div class="row wrap">${o.ore.map((h,i)=>`<input class="field" style="width:84px;min-height:40px" data-ora="${i}" value="${esc(h)}" aria-label="Inizio ${i+1}ª ora">`).join("")}</div>
   <div class="row"><button class="btn ghost sm" data-s="addora">+ Aggiungi un’ora</button><button class="btn ghost sm" data-s="delora">− Togli l’ultima</button></div></div>
   ${[1,2,3,4,5,6].map(g=>`<div class="card stack"><p class="b">${GGL[g].replace(/^./,c=>c.toUpperCase())}</p>${Array.from({length:nOre()},(_,i)=>`<label class="row"><span class="small muted b" style="width:52px">${i+1}ª ora</span><select class="field grow" data-g="${g}" data-i="${i}" style="min-height:40px"><option value="">—</option>${MATERIE.concat(["Scienze motorie","Religione"]).map(m=>`<option ${o.giorni[g][i]===m?"selected":""}>${m}</option>`).join("")}</select></label>`).join("")}</div>`).join("")}
   <div class="row"><button class="btn ghost grow" data-s="x">Annulla</button><button class="btn grow" data-s="ok">Salva l’orario</button></div>`;
  const read=bg=>{bg.querySelectorAll("[data-ora]").forEach(i=>o.ore[+i.dataset.ora]=i.value.trim());bg.querySelectorAll("select[data-g]").forEach(s=>{o.giorni[s.dataset.g][+s.dataset.i]=s.value})};
  const bg=sheet(html(),(k,bg)=>{read(bg);if(k==="x")bg.remove();
    if(k==="addora"){const last=o.ore[o.ore.length-1]||"8:00";const [h,m]=last.split(":").map(Number);o.ore.push(`${(h||7)+1}:${pad(m||0)}`);bg.querySelector(".sheet").innerHTML=html()}
    if(k==="delora"&&o.ore.length>1){o.ore.pop();for(const g in o.giorni)o.giorni[g]=o.giorni[g].slice(0,o.ore.length);bg.querySelector(".sheet").innerHTML=html()}
    if(k==="ok"){for(const g in o.giorni)o.giorni[g]=Array.from({length:o.ore.length},(_,i)=>o.giorni[g][i]||"");o.mod=now();S.orario=o;save();bg.remove();toast("Orario salvato");render()}})}
async function orarioDaFoto(){scegliFoto(async b64=>{toast("Sto leggendo l’orario…",8000);
  try{const r=await ponte("/genera",{tipo:"orario",foto:{tipo:"image/jpeg",base64:b64}});const d=r.dati||{};
    if(!d.giorni)throw new Error("Non sono riuscito a leggere l’orario: prova con una foto più nitida.");
    S.orario={ore:(d.ore&&d.ore.length?d.ore:S.orario.ore).slice(0,9),giorni:{},mod:now()};
    for(let g=1;g<=6;g++)S.orario.giorni[g]=Array.from({length:S.orario.ore.length},(_,i)=>((d.giorni[g]||d.giorni[String(g)]||[])[i]||""));
    save();render();toast("Orario letto: controllalo e correggi se serve",4000);editorOrario()}catch(e){toast(e.message,5000)}})}

  const fatti=S.compiti.filter(c=>c.fatto).sort((a,b)=>(b.fattoIl||0)-(a.fattoIl||0)).slice(0,5);
  const giorni=Array.from({length:7},(_,i)=>addDays(oggi,i));
  return `<div class="days">${giorni.map(d=>{const p=parseD(d);const due=S.compiti.filter(c=>c.scadenza===d&&!c.fatto);return `<div class="day ${d===oggi?"act":""}"><span class="xs muted b">${GG[p.getDay()]}</span><b>${p.getDate()}</b><span class="dots">${due.slice(0,3).map(c=>`<i style="background:${mcol(c.materia)}"></i>`).join("")}</span></div>`}).join("")}</div>
  <div class="card stack"><p class="b">Aggiungi un compito</p><div class="grid3">
   <button class="btn ghost" style="flex-direction:column;min-height:64px;gap:2px" data-act="newc">${ic("edit",20)}<span class="xs">Scrivi</span></button>
   <button class="btn ghost" style="flex-direction:column;min-height:64px;gap:2px" data-act="newcmic">${ic("mic",20)}<span class="xs">Detta</span></button>
   <button class="btn ghost" style="flex-direction:column;min-height:64px;gap:2px" data-act="newcfoto">${ic("cam",20)}<span class="xs">Fotografa</span></button></div>
   <p class="xs muted">La scadenza si propone da sola: la prossima lezione di quella materia.</p></div>
  ${rit.length?`<p class="label" style="color:var(--warm)">In ritardo</p><div class="card flush list warn">${rit.map(c=>rigaCompito(c)).join("")}</div>`:""}
  ${Object.keys(gruppi).sort().map(d=>`<p class="label">Per ${esc(dataLunga(d))}</p><div class="card flush list">${gruppi[d].map(c=>rigaCompito(c)).join("")}</div>`).join("")}
  ${!aperti.length?`<div class="card empty">Nessun compito da fare. Ben fatto!</div>`:""}
  ${fatti.length?`<p class="label">Fatti di recente</p><div class="card flush list">${fatti.map(c=>rigaCompito(c)).join("")}</div>`:""}`}

function editorCompito(c,opz={}){
  const nuovo=!c;c=c?JSON.parse(JSON.stringify(c)):{id:uid8(),tipo:"compito",materia:opz.materia||MATERIE[0],testo:opz.testo||"",scadenza:"",promemoria:null,fatto:false,foto:null,argomenti:""};
  let foto=opz.foto||null,premod=c.promemoria?"custom":"giorno16",autoScad=!c.scadenza;

  const calcPromo=()=>{if(premod==="no")return null;if(premod==="custom")return c.promemoria;const d=parseD(premod==="due16"?addDays(c.scadenza,-2):premod==="giorno16"?addDays(c.scadenza,-1):c.scadenza);d.setHours(premod==="stesso15"?7:16,0,0,0);return d.toISOString()};
  const loc=iso=>{if(!iso)return"";const d=new Date(iso);return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
  const html=()=>`<h2>${nuovo?"Nuovo":"Modifica"} ${c.tipo==="compito"?"compito":c.tipo}</h2>

   <div><label class="flabel" for="ct">${c.tipo==="compito"?"Cosa devi fare":"Argomenti"}</label><div class="row" style="align-items:flex-start"><textarea class="field grow" id="ct" placeholder="${c.tipo==="compito"?"Es. esercizi pag. 84, n. 3–6":"Es. i re di Roma, la repubblica"}">${esc(c.testo)}</textarea><button class="icon-btn" data-s="mic" aria-label="Detta">${ic("mic")}</button></div></div>
   <div class="row">${foto?`<div class="thumbs"><div><img src="data:image/jpeg;base64,${foto}" alt="Foto del compito"><button data-s="nofoto" aria-label="Togli foto">×</button></div></div>`:`<button class="btn ghost sm" data-s="foto">${ic("cam",18)} Aggiungi foto</button>`}</div>
   <div class="grid2"><div><label class="flabel" for="cs">${c.tipo==="compito"?"Da consegnare":"Data"}</label><input class="field" type="date" id="cs" value="${c.scadenza}"></div>
   <div><label class="flabel" for="cp">Promemoria</label><select class="field" id="cp">${promoOpts.map(o=>`<option value="${o[0]}" ${premod===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div></div>
   ${premod==="custom"?`<div><label class="flabel" for="cpc">Data e ora del promemoria</label><input class="field" type="datetime-local" id="cpc" value="${loc(c.promemoria||calcPromo()||"")}"></div>`:""}
   ${(()=>{const o=oraLezione(c.materia,c.scadenza);return o!=null?`<p class="xs muted">Lezione di ${esc(c.materia)} alla ${o+1}ª ora di ${esc(dataLunga(c.scadenza))}.</p>`:""})()}
   <div class="row">${nuovo?"":`<button class="btn danger" data-s="del">${ic("trash",18)}</button>`}<button class="btn ghost grow" data-s="x">Annulla</button><button class="btn grow" data-s="ok">Salva</button></div>`;
  const read=bg=>{const m=bg.querySelector("#cm").value;if(m!==c.materia){c.materia=m;if(autoScad)c.scadenza=prossimaLezione(m)}
    c.testo=bg.querySelector("#ct").value.trim();const s=bg.querySelector("#cs").value;if(s&&s!==c.scadenza){c.scadenza=s;autoScad=false}
    premod=bg.querySelector("#cp").value;const cc=bg.querySelector("#cpc");if(cc&&cc.value)c.promemoria=new Date(cc.value).toISOString()};
  const redraw=bg=>{bg.querySelector(".sheet").innerHTML=html()};
  const bg=sheet(html(),(k,bg)=>{read(bg);
    if(k.startsWith("tipo:")){c.tipo=k.slice(5);redraw(bg)}
    if(k==="x")bg.remove();
    if(k==="mic"){const ta=bg.querySelector("#ct");const base=ta.value?ta.value+" ":"";detta("it-IT",t=>ta.value=base+t)}
    if(k==="foto")scegliFoto(async b=>{foto=await rimpicciolisci(b);read(bg);redraw(bg)});
    if(k==="nofoto"){foto=null;c.foto=null;redraw(bg)}
    if(k==="del"&&confirm("Eliminare questo compito?")){delItem("compiti",c.id);delete S.piani[c.id];bg.remove();render()}
    if(k==="ok"){if(!c.testo&&!foto){toast("Scrivi cosa devi fare o aggiungi una foto");return}
      if(!c.testo)c.testo="Compito in foto";c.promemoria=calcPromo();c.mod=now();
      if(foto){c.foto=c.foto||uid8();salvaFoto(c.foto,foto)}
      const i=S.compiti.findIndex(x=>x.id===c.id);if(i>=0)S.compiti[i]=c;else S.compiti.push(c);save();bg.remove();render();
      toast(c.promemoria?`Salvato. Promemoria ${quando(ymd(new Date(c.promemoria)))} alle ${oraDi(c.promemoria)}`:"Salvato");

    if(k!=="x"&&k!=="ok"&&k!=="del"&&!k.startsWith("tipo")&&k!=="foto"&&k!=="mic"&&k!=="nofoto")redraw(bg)});
  bg.addEventListener("change",e=>{if(["cm","cp","cs"].includes(e.target.id)){read(bg);redraw(bg)}});
  if(opz.mic)setTimeout(()=>{const ta=bg.querySelector("#ct");detta("it-IT",t=>ta.value=t)},300)}
async function aiutoCompito(id){const c=S.compiti.find(x=>x.id===id);if(!c)return;let foto=null;if(c.foto)foto=await leggiFoto(c.foto);

async function creaPiano(id){const c=S.compiti.find(x=>x.id===id);if(!c)return;toast("Preparo il piano di studio…",8000);
  try{const r=await ponte("/genera",{tipo:"piano",materia:c.materia,argomento:c.testo,data:c.scadenza,oggi:today()});
    const g=((r.dati&&r.dati.giorni)||[]).filter(x=>x.data&&x.attivita).map(x=>({data:x.data,attivita:String(x.attivita),minuti:+x.minuti||20,fatto:false}));
    if(!g.length)throw new Error("Non sono riuscito a preparare il piano, riprova.");

function vVoti(){const mm=medieMaterie(),mg=mediaGenerale();
  const mesi={};for(const v of S.voti){const k=v.data.slice(0,7);(mesi[k]=mesi[k]||[]).push(+v.voto)}
  const ks=Object.keys(mesi).sort().slice(-4);const pts=ks.map(k=>media(mesi[k]));
  let svg="";if(pts.length>1){const lo=Math.min(...pts)-.5,hi=Math.max(...pts)+.5;const X=i=>8+i*(114/(pts.length-1)),Y=v=>52-(v-lo)/(hi-lo)*40;
    svg=`<svg width="130" height="72" viewBox="0 0 130 72" role="img" aria-label="Andamento della media per mese: ${ks.map((k,i)=>MESI[+k.slice(5)-1]+" "+fmtVoto(pts[i].toFixed(2))).join(", ")}"><path d="${pts.map((v,i)=>(i?"L":"M")+X(i)+" "+Y(v)).join(" ")}" fill="none" stroke="#7E98F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===pts.length-1?5:4}" fill="${i===pts.length-1?"#fff":"#7E98F2"}"/><text x="${X(i)}" y="70" fill="#C2C9D8" font-size="10" text-anchor="middle" font-family="Manrope,sans-serif">${MESI[+ks[i].slice(5)-1].slice(0,3)}</text>`).join("")}</svg>`}
  const obHtml=Object.keys(S.obiettiviVoto).map(m=>{const n=votoNecessario(m);if(!n)return"";return `<div class="card ${n.ok?"":"warn"} stack" style="gap:2px"><p class="xs b" style="color:${n.ok?"var(--ok)":"var(--warm)"}">Obiettivo ${esc(m)}: ${fmtVoto(n.ob)}</p><p class="small b">${n.ok?`Sei a ${fmtMedia(n.m)}: obiettivo raggiunto.`:n.x>10?`Sei a ${fmtMedia(n.m)}: con un solo voto non basta, servono più prove buone.`:`Sei a ${fmtMedia(n.m)}: con un ${fmtVoto(n.x)} alla prossima prova arrivi a ${fmtVoto(n.ob)}.`}</p></div>`}).join("");
  const righe=Object.entries(mm).sort((a,b)=>b[1]-a[1]);
  const ultimi=S.voti.slice().sort((a,b)=>a.data<b.data?1:-1).slice(0,6);
  return `<div class="dark row" style="gap:14px"><div class="grow"><p class="small muted b">Media generale</p><p class="xb" style="font-size:2.4em;letter-spacing:-.03em;line-height:1.1">${fmtMedia(mg)}</p><p class="xs muted">${S.voti.length} vot${S.voti.length===1?"o":"i"} in ${righe.length} materi${righe.length===1?"a":"e"}</p></div>${svg}</div>
  ${obHtml}
  ${righe.length?`<div class="card flush list">${righe.map(([m,v])=>`<button class="gradeRow" data-act="vmat:${esc(m)}" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left"><span class="grow b small">${esc(m)}</span><span class="bar"><i style="width:${v*10}%;background:${mcol(m)}"></i></span><span class="v">${fmtMedia(v)}</span></button>`).join("")}</div>`:`<div class="card empty">Inserisci il primo voto per vedere le medie.</div>`}
  <div class="sec"><h2>Ultimi voti</h2><button class="btn sm" data-act="newv">${ic("plus",16)} Aggiungi voto</button></div>
  ${ultimi.length?`<div class="card flush list">${ultimi.map(v=>`<div class="row"><button class="grow" data-act="vedit:${v.id}" style="text-align:left;background:none;border:0;padding:0"><p class="b small">${esc(v.materia)}</p><p class="xs muted">${esc(dataBreve(v.data))} · ${esc(v.tipo)}${v.nota?" · "+esc(v.nota):""}</p></button>${v.tipo==="scritto"?`<button class="link" data-act="vanalisi:${v.id}">Analizza</button>`:""}<span class="xb" style="font-size:1.15em;width:44px;text-align:right">${fmtVoto(v.voto)}</span></div>`).join("")}</div>`:""}`}

  const voti=[];for(let x=2;x<=10;x+=.25)voti.push(x);

function vStudio(){const sch=schedeDaFare().length,err=erroriTop(4),ver=compitiAperti().filter(c=>c.tipo!=="compito");
  const tile=(go,act,t,d,icn)=>`<button class="card row" style="text-align:left;width:100%" ${go?`data-go="${go}"`:`data-act="${act}"`}><span class="icon-btn" style="background:var(--pri-soft);color:var(--pri-ink)">${ic(icn)}</span><span class="grow"><span class="b" style="display:block">${t}</span><span class="small muted">${d}</span></span></button>`;
  return `<h1>Studio</h1>
  <div class="sec"><h2>Con il tutor</h2></div>

async function ripasso(k){const e=S.errori[k];if(!e)return;toast("Preparo gli esercizi per te…",9000);
  try{const r=await ponte("/genera",{tipo:"quiz",materia:e.materia,argomento:e.argomento,dettagli:`Lo studente fa spesso questo errore: ${e.errore}. Concentrati su questo.`,n:6});

const starsOf=b=>b>=10?3:b>=8?2:b>=6?1:0;
function fT(id){if(!S.fis.topics[id])S.fis.topics[id]={read:[],best:{1:0,2:0,3:0},done:false,bestTest:0};return S.fis.topics[id]}
const topicById=id=>TOPICS.find(t=>t.id===+id);
function topicPct(id){const t=fT(id),tp=topicById(id);const r=Math.min(t.read.length,tp.lessons.length)/tp.lessons.length;const st=[1,2,3].reduce((a,l)=>a+starsOf(t.best[l]||0),0)/9;return Math.round(r*30+st*50+(t.done?20:0))}
function padronanza(id){const t=fT(id);if(t.done)return["Completato","ok"];const p=topicPct(id);return p===0?["Da iniziare",""]:p<40?["In corso","pri"]:p<75?["Buono","pri"]:["Ottimo","ok"]}
const livNome=b=>b>=10?"Ottimo":b>=8?"Buono":b>=6?"Sufficiente":b?"Da rifare":"Non fatto";

  return `<button class="back" data-go="studio">${ic("back",18)} Studio</button><h1>Fisica</h1><p class="small muted">Lezioni brevi, trucchi per ricordare ed esercizi sempre nuovi.</p>
  <div class="row"><button class="btn ghost grow" data-act="fchoose">Argomenti (${sel.length} su ${TOPICS.length})</button><button class="btn grow" data-act="fstart:mix">Allenamento misto</button></div>
  <div class="stack">${sel.map(tp=>{const [lab,cl]=padronanza(tp.id);return `<button class="card" style="text-align:left;width:100%" data-go="f/${tp.id}/impara"><div class="row" style="margin-bottom:10px"><span class="icon-btn" style="background:${tp.color};color:#fff;font-weight:800">${tp.id}</span><span class="grow"><span class="b" style="display:block">${tp.short}</span><span class="xs muted">${tp.sub}</span></span><span class="chip ${cl}">${lab}</span></div><div class="bar"><i style="width:${topicPct(tp.id)}%;background:${tp.color}"></i></div></button>`}).join("")||`<div class="card empty">Nessun argomento scelto.</div>`}</div>`}
function chooseFis(){sheet(`<h2>Argomenti di fisica</h2><div class="row"><button class="btn ghost grow" data-s="all">Tutti</button><button class="btn ghost grow" data-s="none">Nessuno</button></div>
  <div class="stack">${TOPICS.map(t=>`<label class="card row" style="cursor:pointer"><input type="checkbox" value="${t.id}" ${S.fis.selected.includes(t.id)?"checked":""} style="width:22px;height:22px;accent-color:var(--pri)"><span class="grow"><span class="b" style="display:block">${t.short}</span><span class="xs muted">${t.sub}</span></span></label>`).join("")}</div>
  <div class="row"><button class="btn ghost grow" data-s="x">Annulla</button><button class="btn grow" data-s="ok">Salva</button></div>`,(k,bg)=>{const cb=[...bg.querySelectorAll("input")];
   if(k==="all")cb.forEach(c=>c.checked=true);if(k==="none")cb.forEach(c=>c.checked=false);if(k==="x")bg.remove();
   if(k==="ok"){S.fis.selected=cb.filter(c=>c.checked).map(c=>+c.value);S.prefMod=now();save();bg.remove();render()}})}
function vTopic(id,tab){const tp=topicById(id);if(!tp)return vFisica();const t=fT(id);let body="";
  if(tab==="trucchi")body=`<div class="stack">${tp.tricks.map((k,i)=>`<div class="card"><p class="b">${k.t}</p>${k.tri?triHtml(id,i,k.tri):""}<p class="hand">${k.hand}</p><div class="small">${k.h}</div></div>`).join("")}</div><button class="btn wide" data-go="f/${id}/esercizi">Mettiti alla prova</button>`;

  return `<button class="back" data-go="fisica">${ic("back",18)} Fisica</button><div class="row"><span class="icon-btn" style="background:${tp.color};color:#fff;font-weight:800">${tp.id}</span><h1 style="font-size:1.3em">${tp.title}</h1></div>

function triHtml(tid,i,tri){const k=tid+"-"+i,c=triState[k];const [a,b,d,na,nb,nd]=tri;
  const res=c===a?`${a} = ${b} × ${d}`:c===b?`${b} = ${a} ÷ ${d}`:c===d?`${d} = ${a} ÷ ${b}`:"Tocca la lettera da trovare";

  quiz={topic,level,qs,i:0,score:0,answered:false,wrong:[],last:null};go("quiz")}
function vQuiz(){if(!quiz)return vFisica();const q=quiz.qs[quiz.i],n=quiz.qs.length,tp=topicById(q.topic);let ans="";
  if(q.type==="mc")ans=q.options.map((o,k)=>{let c="";if(quiz.answered){if(k===q.answer)c="ok";else if(k===quiz.last)c="ko"}return `<button class="opt ${c}" data-act="pick:${k}" ${quiz.answered?"disabled":""}>${o}</button>`}).join("");
  else ans=`<div class="row"><input id="ans" class="field grow" inputmode="decimal" autocomplete="off" placeholder="Scrivi il numero" value="${quiz.answered?esc(quiz.typed||""):""}" ${quiz.answered?"disabled":""} aria-label="Risposta" style="font-size:1.15em">${q.unit?`<span class="b muted">${q.unit}</span>`:""}</div>
   ${quiz.answered?"":`<div class="row">${q.neg?`<button class="btn ghost sm" data-act="key:-">−</button>`:""}<button class="btn ghost sm" data-act="key:,">,</button><span class="xs muted">Usa la virgola per i decimali</span></div><button class="btn wide" data-act="check">Controlla</button>`}`;

  <span class="chip" style="align-self:flex-start;background:${tp.color};color:#fff">${tp.short}</span><div class="card stack"><p class="b" style="font-size:1.08em">${q.q}</p>${ans}</div>${fbk}`}
function parseUser(str){let s=String(str).trim().replace(/\s+/g,"").replace(/[−–]/g,"-");s=s.replace(/[x×*·]10\^?\(?(-?\d+)\)?/i,"e$1").replace(/[a-zA-Z°%€²³\/µ]+$/,"");const c=[];
  if(s.includes(","))c.push(s.replace(/\./g,"").replace(",","."));else if((s.match(/\./g)||[]).length>1)c.push(s.replace(/\./g,""));else if(/^-?\d{1,3}\.\d{3}$/.test(s)){c.push(s);c.push(s.replace(".",""))}else c.push(s);
  return c.map(Number).filter(x=>s!==""&&isFinite(x))}
function quizAnswer(ok){quiz.answered=true;quiz.lastOk=ok;S.fis.stats.done++;if(ok){quiz.score++;S.fis.stats.ok++}else{const q=quiz.qs[quiz.i];quiz.wrong.push(q);addErrore("Fisica",topicById(q.topic).short,`esercizi di livello ${q.level} sbagliati`)}persist();render()}
function checkNum(){const inp=$("#ans");if(!inp||quiz.answered)return;const q=quiz.qs[quiz.i];const c=parseUser(inp.value);if(!c.length){toast("Scrivi un numero");return}
  quiz.typed=inp.value;quizAnswer(c.some(v=>Math.abs(v-q.answer)<=Math.max(q.tol*Math.abs(q.answer),1e-9)))}
function finishQuiz(){const r={topic:quiz.topic,level:quiz.level,score:quiz.score,n:quiz.qs.length,wrong:quiz.wrong,done:false};
  if(quiz.topic!=="mix"){const t=fT(quiz.topic);if(quiz.level==="test"){t.bestTest=Math.max(t.bestTest||0,r.score);if(r.score>=8&&!t.done){t.done=true;r.done=true}}else t.best[quiz.level]=Math.max(t.best[quiz.level]||0,r.score)}
  save();lastResult=r;quiz=null;go("risultato")}
function vRisultato(){const r=lastResult;if(!r)return vFisica();const tp=r.topic==="mix"?null:topicById(r.topic);
  return `<div class="card stack" style="text-align:center"><p class="muted">${tp?tp.short:"Allenamento misto"}${r.level==="test"?" · mini-verifica":r.topic!=="mix"?` · livello ${r.level}`:""}</p><p class="xb" style="font-size:3em;line-height:1">${r.score}<span class="muted" style="font-size:.4em">/${r.n}</span></p>
  ${r.done?`<p class="chip ok" style="align-self:center">Argomento completato</p>`:""}<p>${r.score===r.n?"Tutto giusto, complimenti.":r.score>=8?"Ottimo lavoro.":r.score>=6?"Bene, ci sei quasi.":"Rileggi i trucchi e riprova: migliorerai."}</p>
  <div class="row"><button class="btn ghost grow" data-go="${tp?`f/${tp.id}/esercizi`:"fisica"}">Indietro</button><button class="btn grow" data-act="fstart:${r.topic}:${r.level}">Riprova</button></div></div>
  ${r.wrong.length?`<div class="sec"><h2>Da ripassare</h2></div><div class="stack">${r.wrong.map(q=>`<div class="card stack"><p>${q.q}</p><p class="small b">Risposta: ${q.type==="mc"?q.options[q.answer]:fmt(q.answer)+(q.unit?" "+q.unit:"")}</p><p class="small muted">${q.explain}</p></div>`).join("")}</div>`:""}`}

async function invia(testoForzato){
  if(T.sending)return;const inp=$("#tin");let testo=(testoForzato??(inp?inp.value:T.draft)).trim();
  if(!testo&&!T.foto.length)return;

  const s=T.sess;s.msgs.push({r:"u",t:testo,f:T.foto.slice()});if(!s.titolo)s.titolo=testo.slice(0,60);
  const foto=T.foto.map(b=>({tipo:"image/jpeg",base64:b}));T.foto=[];T.draft="";T.sending=true;renderTutor();
  try{
    const messaggi=s.msgs.filter(m=>m.r==="u"||m.r==="a").map((m,i,arr)=>({ruolo:m.r==="u"?"user":"assistant",testo:m.t+(m.r==="u"&&m.f&&m.f.length&&i<arr.length-1?" [foto inviata prima]":""),...(i===arr.length-1&&foto.length?{foto}:{})}));
    const r=await ponte("/chat",{messaggi,materia:s.materia||"",modo:s.modo,nomeTutor:S.tutorNome,nome:S.nome,sessione:s.id});
    s.msgs.push({r:"a",t:r.risposta||"…"});T.rimasti=r.rimasti;
    const mt=r.meta||{};const mat=MATERIE.includes(mt.materia)?mt.materia:(s.materia||"Altro");
    if(mt.errore)addErrore(mat,mt.argomento||"",mt.errore);
    for(const g of mt.glossario||[])addGlossario(mat,g);
    S.stat.tutor++;if(mt.esito==="corretto")S.stat.corretti++;save();
  }catch(e){s.msgs.pop();T.draft=testo;T.foto=foto.map(f=>f.base64);toast(e.message,5000)}
  T.sending=false;for(const m of s.msgs)if(m.f)m.f=m.f.map(f=>f&&f.length>200000?"x":f);
  salvaLocale();salvaChat(T.sess);renderTutor()}

function settimanaLog(){return G.log.filter(l=>l.ms>now()-7*864e5&&!String(l.modo).startsWith("genera"))}
function gPanoramica(){if(!G.cur)return gVuoto("Area genitore");const D=G.dati,oggi=today();
  let min=0,giorniOk=0;const ob=+G.imp.obiettivoMin||20;const giorni=[];for(let i=6;i>=0;i--){const d=addDays(oggi,-i),m=Math.round(D.tempo[d]||0);min+=m;if(m>=ob)giorniOk++;giorni.push([d,m])}
  const max=Math.max(ob,...giorni.map(g=>g[1]))||1;
  const sett=settimanaLog(),segn=sett.filter(l=>l.segnalazione);
  const fatti=D.compiti.filter(c=>c.fatto&&c.fattoIl&&c.fattoIl>now()-30*864e5),inTempo=fatti.filter(c=>ymd(new Date(c.fattoIl))<=c.scadenza).length;
  const ritardo=D.compiti.filter(c=>!c.fatto&&c.scadenza<oggi);
  const mm={};for(const v of D.voti)(mm[v.materia]=mm[v.materia]||[]).push(+v.voto);const medie=Object.entries(mm).map(([k,a])=>[k,media(a)]).sort((a,b)=>a[1]-b[1]);const mg=medie.length?media(medie.map(x=>x[1])):null;
  const err=Object.values(D.errori).filter(e=>e.n>0).sort((a,b)=>b.n-a.n).slice(0,5);
  const mese="m"+oggi.slice(0,7).replace("-","_"),uso=(G.stato.mesi||{})[mese]||{};
  const usatiOggi=G.stato.giorno===oggi?G.stato.n||0:0;
  const perMat={};for(const l of sett)perMat[l.materia||"Altro"]=(perMat[l.materia||"Altro"]||0)+1;
  const ass=(G.imp.assegnati||[]);
  const agg=G.cur.agg&&G.cur.agg.toDate?G.cur.agg.toDate():null;
  return `${gHead("Panoramica")}
  ${G.cur.prova?`<p class="chip warm" style="align-self:flex-start">Stai guardando l’account di prova</p>`:""}
  ${agg?`<p class="xs muted">Ultimo aggiornamento dall’app: ${agg.toLocaleString("it-IT",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</p>`:""}
  ${segn.length?`<button class="card warn row" style="text-align:left;width:100%" data-go="g/segn"><span class="icon-btn" style="background:var(--warm-soft);color:var(--warm)">${ic("flag")}</span><span class="grow"><span class="b" style="display:block">${segn.length} segnalazion${segn.length>1?"i":"e"} questa settimana</span><span class="small muted">${segn.filter(s=>s.segnalazione==="delicato").length?"Include un argomento delicato. ":""}Tocca per leggere.</span></span></button>`:""}
  <div class="card stack"><div class="row"><p class="b grow">Tempo di studio · ultimi 7 giorni</p><p class="xb">${Math.floor(min/60)} h ${min%60} min</p></div>
   <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px">${giorni.map(([d,m])=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><span class="xs b">${m||""}</span><div style="width:100%;max-width:26px;border-radius:6px 6px 2px 2px;height:${Math.max(3,m/max*60)}px;background:${m>=ob?"var(--pri)":"var(--line)"}"></div><span class="xs muted">${GG[parseD(d).getDay()]}</span></div>`).join("")}</div>
   <p class="small muted">Obiettivo di ${ob} minuti raggiunto in ${giorniOk} giorn${giorniOk===1?"o":"i"} su 7.</p></div>
  <div class="grid2">
   <div class="card stack"><p class="xs b muted">Messaggi al tutor (7 gg)</p><p class="xb" style="font-size:1.5em">${sett.length}</p><p class="xs muted">Oggi ${usatiOggi} su ${G.imp.tetto||60}</p></div>
   <div class="card stack"><p class="xs b muted">Compiti (30 gg)</p><p class="xb" style="font-size:1.5em">${inTempo}/${fatti.length}</p><p class="xs muted">fatti in tempo${ritardo.length?` · ${ritardo.length} in ritardo`:""}</p></div>
  </div>
  ${Object.keys(perMat).length?`<div class="card stack"><p class="b">Materie con il tutor (7 gg)</p>${Object.entries(perMat).sort((a,b)=>b[1]-a[1]).map(([m,n])=>`<div class="gradeRow"><span class="grow small b">${esc(m)}</span><span class="bar"><i style="width:${n/sett.length*100}%;background:${mcol(m)}"></i></span><span class="v small">${n}</span></div>`).join("")}</div>`:""}
  <div class="card stack"><div class="row"><p class="b grow">Voti</p><p class="xb">Media ${fmtMedia(mg)}</p></div>${medie.length?medie.map(([m,v])=>`<div class="gradeRow"><span class="grow small b">${esc(m)}</span><span class="bar"><i style="width:${v*10}%;background:${v<6?"var(--bad)":mcol(m)}"></i></span><span class="v small">${fmtMedia(v)}</span></div>`).join(""):`<p class="small muted">Nessun voto inserito.</p>`}</div>
  <div class="card stack"><p class="b">Punti deboli</p>${err.length?err.map(e=>`<div><p class="small b">${esc(e.materia)} · ${esc(e.argomento||"")}</p><p class="xs muted">${esc(e.errore)} · ${e.n} volt${e.n>1?"e":"a"}</p></div>`).join(""):`<p class="small muted">Ancora nessun errore registrato.</p>`}</div>
  ${ritardo.length?`<div class="card stack warn"><p class="b">Compiti in ritardo</p>${ritardo.map(c=>`<p class="small"><b>${esc(c.materia)}</b>: ${esc(c.testo)} <span class="muted">(era per ${quando(c.scadenza)})</span></p>`).join("")}</div>`:""}
  ${ass.length?`<div class="card stack"><p class="b">Attività assegnate</p>${ass.map(a=>`<div class="row"><span class="chip ${D.assegnatiFatti.includes(a.id)?"ok":"warm"}">${D.assegnatiFatti.includes(a.id)?"Fatto":"Da fare"}</span><span class="small grow">${esc(a.testo)}</span></div>`).join("")}</div>`:""}
  ${G.imp.premio?`<div class="card stack"><p class="b">Premio: ${esc(G.imp.premio)}</p><p class="small muted">Giorni con obiettivo raggiunto questa settimana: ${(()=>{const d=new Date(),off=(d.getDay()+6)%7;let n=0;for(let i=0;i<=off;i++)if((D.tempo[addDays(oggi,-i)]||0)>=ob)n++;return n})()} su ${G.imp.premioSessioni||5}</p></div>`:""}
  <div class="card stack"><p class="b">Credito del tutor</p><p class="small">Questo mese: ${uso.n||0} richieste, circa <b>${(uso.dollari||0).toFixed(2).replace(".",",")} $</b> (stima).</p><p class="xs muted">Il saldo esatto è sulla Claude Console (platform.claude.com).</p></div>
  ${provaCard()}`}

function gChat(soloSegn){const t=soloSegn?"Segnalazioni":"Conversazioni";if(!G.cur)return gVuoto(t,true);
  const L=G.log.filter(l=>!String(l.modo).startsWith("genera")&&(!soloSegn||l.segnalazione));
  const perGiorno={};for(const l of L){const d=ymd(new Date(l.ms));(perGiorno[d]=perGiorno[d]||[]).push(l)}
  const nomeMod=m=>(MODI.find(x=>x[0]===m)||["","Tutor"])[1];const chi=G.cur.prova?"Prova":esc(G.cur.nome);
  return `${gHead(t,true)}
  ${soloSegn?`<p class="small muted">Richieste di farsi fare i compiti e argomenti delicati. Il tutor non dà mai le soluzioni e su temi delicati invita a parlarne con voi.</p>`:`<p class="small muted">Tutto quello che è stato scritto al tutor e le risposte, dalle più recenti. Questo registro lo scrive il ponte e dall’app studente non si può cancellare.</p>`}
  ${Object.keys(perGiorno).length?Object.keys(perGiorno).sort().reverse().map(d=>`<p class="label">${esc(dataLunga(d))}</p><div class="stack">${perGiorno[d].map(l=>`<div class="card stack ${l.segnalazione?"warn":""}">
    <div class="row wrap" style="gap:6px"><span class="xs b muted">${new Date(l.ms).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})}</span><span class="chip">${esc(nomeMod(l.modo))}</span><span class="chip" style="color:${mcol(l.materia)}">${esc(l.materia||"")}</span>${l.segnalazione?`<span class="chip warm">${l.segnalazione==="delicato"?"Argomento delicato":"Scorciatoia"}</span>`:""}${l.esito==="corretto"?`<span class="chip ok">Risolto da solo</span>`:""}</div>
    <p class="small"><b>${chi}:</b> ${l.haFoto?`<span class="chip">foto</span> `:""}${esc(l.domanda||"")}</p>
    <p class="small muted" style="white-space:pre-wrap"><b>Tutor:</b> ${md((l.risposta||"").replace(/<ascolto[^>]*>/,"[testo di ascolto] ").replace(/<\/ascolto>/,""))}</p>
    ${l.errore?`<p class="xs" style="color:var(--warm)"><b>Errore:</b> ${esc(l.errore)}</p>`:""}</div>`).join("")}</div>`).join(""):`<div class="card empty">${soloSegn?"Nessuna segnalazione.":"Nessuna conversazione ancora."}</div>`}`}
