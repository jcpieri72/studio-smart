    try{await G.salvaImp();toast("Attività assegnata");render()}catch(e){toast("Non salvato")}return true}
  if(f==="gnota"){const t=$("#gn").value.trim();if(!t)return true;G.imp.note=(G.imp.note||[]).concat({id:uid8(),testo:t,da:GEN_NOME,t:now()}).slice(-10);
    try{await G.salvaImp();toast("Messaggio inviato");render()}catch(e){toast("Non salvato")}return true}

function seraList(st){if(st.seraOn===false)return[];const out=[];const [h,m]=(st.oraSera||"18:00").split(":").map(Number);
  for(let i=0;i<7;i++){const giorno=addDays(today(),i),dom=addDays(giorno,1);const cs=(st.compiti||[]).filter(c=>!c.fatto&&c.scadenza===dom);if(!cs.length)continue;
    const at=parseD(giorno);at.setHours(h||18,m||0,0,0);const ver=cs.filter(c=>c.tipo!=="compito");
    out.push({id:"sera@"+giorno+"@"+cs.length,at:at.toISOString(),titolo:ver.length?`Domani: ${ver[0].tipo} di ${ver[0].materia}`:`Domani: ${cs.length} compit${cs.length>1?"i":"o"} da consegnare`,testo:cs.map(c=>`${c.materia}: ${c.testo}`).join(" · ").slice(0,160)})}
  return out}

function ripristinaCopia(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());if(!o.dati||o.app!=="Studio Smart")throw 0;

  const D=Object.assign(blank(),o.dati),t=now();D.resets=D.resets||{};for(const k of RESETTABILI)D.resets[k]=t;for(const k of ["compiti","voti","glossario","schede"])for(const x of D[k])x.mod=t;

let CONDIVISI=[],condUnsub=null;
async function davideUid(){if(G.stud&&G.stud.length){const d=G.stud.find(s=>!s.prova);if(d)return d.uid}
  try{const q=await fb.db.collection("studenti").get();const gh=genitoriCfg().map(g=>g.hash);
    for(const d of q.docs){if(!d.data().json)continue;const h=await sha256(String(d.data().email||"").toLowerCase());if(!gh.includes(h)&&!d.data().prova)return d.id}}catch(e){}return null}
async function condividiConDavide(c){if(!fb||!user){toast("Serve l’accesso con Google");return}
  const uid=await davideUid();if(!uid){toast("Davide non ha ancora fatto l’accesso all’app",5000);return}
  const id=uid8();try{await fb.db.collection("studenti").doc(uid).collection("condivisi").doc(id).set({tipo:c.tipo,titolo:c.titolo||"",materia:c.materia||"",nota:c.nota||"",da:GEN_NOME||"genitore",t:now(),dati:JSON.stringify(c.dati||{})});

function disegnaMappa(){const z=$("#mapzoom"),c=$("#mapcanvas"),n=$("#mnode"),svg=$("#mlines");if(!z||!c||!n)return;
  const narrow=z.clientWidth<620;c.classList.toggle("narrow",narrow);
  const W=narrow?z.clientWidth-2:980;const fit=narrow?1:Math.min(1,(z.clientWidth-4)/W);if(mapZoom===null)mapZoom=fit;
  c.style.width=W+"px";c.style.transform=`scale(${mapZoom})`;const H=c.offsetHeight;z.style.height=Math.ceil(H*mapZoom+6)+"px";
  svg.setAttribute("width",W);svg.setAttribute("height",H);
  const pos=el=>{let x=0,y=0,e=el;while(e&&e!==c){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x,y,w:el.offsetWidth,h:el.offsetHeight}};
  const N=pos(n);let p="";
  c.querySelectorAll(".mbranch").forEach(b=>{const B=pos(b);const colr=getComputedStyle(b).getPropertyValue("--c");
    if(narrow){const x0=14,y0=N.y+N.h/2,y2=B.y+Math.min(B.h/2,22);p+=`<path d="M${N.x} ${y0} H${x0+8} Q${x0} ${y0} ${x0} ${y0+8} V${y2-8} Q${x0} ${y2} ${x0+8} ${y2} H${B.x}" fill="none" stroke="${colr}" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>`;return}
    const left=B.x<N.x;const x1=left?N.x:N.x+N.w,y1=N.y+N.h/2,x2=left?B.x+B.w:B.x,y2=B.y+Math.min(B.h/2,28);const mx=(x1+x2)/2;
    p+=`<path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="${colr}" stroke-width="3" stroke-linecap="round" opacity=".75"/>`});
  svg.innerHTML=p}

function editRamo(id,i){const m=S.mappe.find(x=>x.id===id);if(!m)return;const nuovo=i==="new";const r=nuovo?{t:"",punti:[]}:m.rami[+i];

function guidaIniziale(){const P=[["Benvenuta nell’area genitore","Qui vedi tutto quello che fa Davide nell’app: tempo di studio, voti, compiti e le conversazioni con il tutor. In alto c’è sempre la barra «Area genitore» con il tuo nome."],

    case "esciprova":sheet(`<h2>Torni all’area genitore</h2><p class="small">Quello che hai fatto resta salvato nella <b>Simulazione ${esc(GEN_NOME||"genitore")}</b>: lo ritrovi la prossima volta e Davide non lo vede.</p><div class="row"><button class="btn ghost grow" data-s="x">Resta qui</button><button class="btn grow" data-s="ok">Torna all’area genitore</button></div>`,(k,bg)=>{bg.remove();if(k==="ok")esciProva()});break;
    case "novita":mostraNovita();break;
    case "aggiorna":aggiornaApp();break;
    case "colore":S.colore=x;S.prefMod=now();save();render();break;
    case "avtipo":S.avatarTipo=x;S.prefMod=now();save();render();if(x==="foto"&&!S.avatar)scegliFotoProfilo();break;
    case "avsym":S.avatarSimbolo=+x;S.prefMod=now();save();render();break;
    case "avfoto":scegliFotoProfilo();break;
    case "matcol":coloriMaterie();break;
    case "tmgo":tmStart();break;
    case "tmstop":tmStop();break;
    case "tmdur":TM.durata=+x;render();break;
    case "logout":logout();break;
    case "notif":attivaNotifiche();break;
    case "askfoto":scegliFoto(b=>{pendingAsk={testo:($("[data-form=ask] input")||{}).value||"",foto:[b],nuova:true,invia:false};go("tutor")});break;
    case "askmic":{const inp=$("[data-form=ask] input");detta("it-IT",t=>inp.value=t,fin=>{if(fin){pendingAsk={testo:fin,nuova:true};go("tutor")}});toast("Ti ascolto…");break}
    case "assok":S.assegnatiFatti.push(x);save();render();toast("Segnato come fatto");break;
    case "newc":editorCompito(null);break;
    case "newcmic":editorCompito(null,{mic:true});break;
    case "newcfoto":scegliFoto(async b=>{const small=await rimpicciolisci(b);editorCompito(null,{foto:small,testo:""})});break;
    case "cedit":editorCompito(S.compiti.find(c=>c.id===x));break;
    case "cdone":{const c=S.compiti.find(c=>c.id===x);if(c){c.fatto=!c.fatto;c.fattoIl=c.fatto?now():null;c.mod=now();save();render();if(c.fatto)toast("Fatto. Ben fatto!")}break}
    case "chelp":aiutoCompito(x);break;
    case "piano":creaPiano(x);break;
    case "pdone":{const p=S.piani[x];p.giorni[+y].fatto=!p.giorni[+y].fatto;p.mod=now();save();render();break}
    case "pfai":{const c=S.compiti.find(c=>c.id===x),g=S.piani[x].giorni[+y];pendingAsk={testo:`Sto preparando la ${c.tipo} di ${c.materia} (${c.testo}). Oggi devo fare: ${g.attivita}. Aiutami.`,materia:c.materia,modo:"lezione",nuova:true};go("tutor");break}
    case "interr":{const c=S.compiti.find(c=>c.id===x);pendingAsk={testo:`Interrogami su: ${c.testo}`,materia:c.materia,modo:"interrogazione",nuova:true};go("tutor");break}
    case "agday":agDay=x;render();break;
    case "agw":agWeek+=+x;agDay=null;render();break;
    case "orfoto":orarioDaFoto();break;
    case "ored":editorOrario();break;
    case "newv":editorVoto(null);break;
    case "vedit":editorVoto(S.voti.find(v=>v.id===x));break;
    case "vmat":schedaMateria(x);break;
    case "vanalisi":{const v=VV().find(v=>v.id===x);scegliFoto(b=>{pendingAsk={testo:`Questa è la mia verifica di ${v.materia} del ${dataBreve(v.data)}: ho preso ${fmtVoto(v.voto)}. Mi aiuti a capire gli errori?`,foto:[b],materia:v.materia,modo:"verifica",nuova:true,invia:false};go("tutor")});break}
    case "modo":pendingAsk={testo:"",modo:x,nuova:true,invia:false};go("tutor");break;
    case "rip":ripasso(x);break;
    case "qzgo":gq.i=0;gq.ans=null;render();break;
    case "qzp":if(gq.ans==null){gq.ans=+x;const q=gq.domande[gq.i];if(+x===+q.giusta)gq.score++;render()}break;
    case "qznext":gq.i++;gq.ans=null;if(gq.i>=gq.domande.length&&gq.errK&&S.errori[gq.errK]&&gq.score/gq.domande.length>=.8){S.errori[gq.errK].n=Math.max(0,S.errori[gq.errK].n-2);save()}render();scrollTo(0,0);break;
    case "qzagain":if(gq.errK)ripasso(gq.errK);else if(gq.mappa)testDaMappa(gq.mappa);else{const q=gq;toast("Preparo altre domande…",9000);ponte("/genera",{tipo:"quiz",materia:q.materia,argomento:q.titolo,n:6}).then(r=>{const d=r.dati||{};gq=Object.assign({},q,{ripasso:d.ripasso||"",domande:(d.domande||[]).filter(z=>z&&z.q&&Array.isArray(z.opzioni)&&z.opzioni.length>1),i:-1,score:0,ans:null});render()}).catch(e=>toast(e.message,5000))}break;
    case "qzesp":esportaTest();break;
    case "ntest":nuovoTestSheet();break;
    case "mnuova":nuovaMappaSheet(x);break;
    case "mzoom":{const z=$("#mapzoom");const fit=z?(z.clientWidth<620?1:Math.min(1,(z.clientWidth-4)/980)):1;mapZoom=Math.max(fit,Math.min(1.6,(mapZoom||fit)*(x==="+"?1.25:.8)));disegnaMappa();break}
    case "medr":editRamo(x,y);break;
    case "maddr":editRamo(x,"new");break;
    case "medc":editCentro(x);break;
    case "mmod":modificaMappaAI(x);break;
    case "mmic":{const inp=$("#mind");if(inp){detta("it-IT",t=>inp.value=t);toast("Ti ascolto…")}break}
    case "mundo":{const m=S.mappe.find(z=>z.id===x);if(m&&(m.storia||[]).length){const o=JSON.parse(m.storia.pop());Object.assign(m,o);m.mod=now();save();mapZoom=null;render();toast("Versione precedente ripristinata")}break}
    case "mvar":{const m=S.mappe.find(z=>z.id===x);if(m)creaMappaAuto({materia:m.materia,argomento:m.argomento||m.titolo,dettagli:"Organizza i concetti in modo diverso dalla versione precedente."},m);break}
    case "mtest":testDaMappa(y?x+":"+y:x);break;
    case "mesp":esportaMappa(y?x+":"+y:x);break;
    case "mcopia":{const m=mappaById(y?x+":"+y:x);if(m){const n=normMappa(m,{id:uid8(),materia:m.materia||"Altro",origine:"condivisa",creata:now()});n.mod=now();S.mappe.push(n);save();toast("Salvata tra le tue mappe");go("mappa/"+n.id)}break}
    case "mdel":{const m=S.mappe.find(z=>z.id===x);if(m){delItem("mappe",x);go("mappe")}break}
    case "merr":mappaErrori(x);break;
    case "apricond":apriCondiviso(x);break;
    case "espcond":{const c=CONDIVISI.find(z=>z.id===x);if(c)esportaSheet({titolo:c.titolo||"Spiegazione",testo:testoMsgs(c.dati.msgs||[]),html:htmlMsgs(c.dati.msgs||[])});break}
    case "chiedicond":{const c=CONDIVISI.find(z=>z.id===x);if(c){pendingAsk={testo:`Ho letto la spiegazione “${c.titolo}” che mi hanno mandato. Ho un dubbio: `,materia:c.materia,modo:"lezione",nuova:true,invia:false};go("tutor")}break}
    case "notaok":S.noteViste.push(x);save();render();break;
    case "pmappa":{const c=S.compiti.find(z=>z.id===x);if(c)nuovaMappaSheet("auto",{materia:c.materia,argomento:c.testo});break}
    case "pesp":esportaPiano(x);break;
    case "espag":esportaAgenda(x);break;
    case "esperr":esportaErrori();break;
    case "espglo":esportaGlossario();break;
    case "qzquit":if(confirm("Uscire dagli esercizi?")){gq=null;go("studio")}break;
    case "fshow":flashShow=true;render();break;
    case "fok":case "fno":{const s=schedeDaFare()[flashI];if(s){s.box=cmd==="fok"?Math.min(4,s.box+1):0;s.prossima=addDays(today(),cmd==="fok"?INT[s.box]:1);s.mod=now();save()}flashShow=false;render();break}
    case "say":{const s=schedeDaFare()[flashI];if(s)leggi(s.fronte,x==="de"?"de-DE":"en-GB");break}
    case "vocab":editorVocabolo();break;
    case "set":S[x]=y;S.prefMod=now();save();render();break;
    case "sym":S.tutorSimbolo=+x;S.prefMod=now();save();render();break;
    case "fchoose":chooseFis();break;
    case "fstart":startQuiz(x,y);break;
    case "fask":{const tp=topicById(+x);pendingAsk={testo:`Non ho capito questa parte della lezione di fisica: “${tp.lessons[+y].t}”. Me la spieghi in modo semplice?`,materia:"Fisica",modo:"lezione",nuova:true};go("tutor");break}
    case "lok":{const id=+x,t=fT(id),tp=topicById(id),i=lessonIdx[id];if(!t.read.includes(i)){t.read.push(i);save()}if(i<tp.lessons.length-1){lessonIdx[id]=i+1;render();scrollTo(0,0)}else go(`f/${id}/trucchi`);break}
    case "lprev":lessonIdx[+x]=Math.max(0,lessonIdx[+x]-1);render();break;
    case "tri":triState[x]=triState[x]===y?null:y;render();break;
    case "pick":if(!quiz.answered){quiz.last=+x;quizAnswer(+x===quiz.qs[quiz.i].answer)}break;
    case "key":{const inp=$("#ans");if(!inp)break;if(x==="-")inp.value=inp.value.startsWith("-")?inp.value.slice(1):"-"+inp.value;else inp.value+=",";inp.focus();break}
    case "check":checkNum();break;
    case "qnext":if(quiz.i<quiz.qs.length-1){quiz.i++;quiz.answered=false;quiz.last=null;quiz.typed="";render();scrollTo(0,0)}else finishQuiz();break;
    case "qquit":if(confirm("Uscire? Le risposte di questo giro non verranno salvate.")){quiz=null;go("fisica")}break;
  }});
function splitAct(s){const i=s.indexOf(":");if(i<0)return[s];const cmd=s.slice(0,i),rest=s.slice(i+1);
  if(["rip","vmat","merr","set","tri","fstart","pdone","pfai","tsay"].includes(cmd)){if(cmd==="rip"||cmd==="vmat"||cmd==="merr")return[cmd,rest];const j=rest.lastIndexOf(":");return j<0?[cmd,rest]:[cmd,rest.slice(0,j),rest.slice(j+1)]}
  const p=rest.split(":");return[cmd,p[0],p.slice(1).join(":")]}
document.addEventListener("submit",async e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(await gForm(f))return;
  if(await famForm(f,e.target))return;
  if(await profForm(f))return;
  if(f==="ask"){const v=e.target.q.value.trim();if(!v)return;pendingAsk={testo:v,nuova:true};go("tutor")}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ans"){e.preventDefault();checkNum()}});
document.addEventListener("change",e=>{
  if(e.target.id==="gfiltro"){GS.filtro=e.target.value;render();return}
  if(e.target.id==="pn"){S.nome=e.target.value.trim()||"Davide";S.prefMod=now();save();toast("Nome salvato")}
  if(e.target.id==="seraOn"){S.seraOn=e.target.checked;S.prefMod=now();save();toast(S.seraOn?"Promemoria serale attivo":"Promemoria serale disattivato")}
  if(e.target.id==="oraSera"){S.oraSera=e.target.value||"18:00";S.prefMod=now();save();toast("Promemoria serale alle "+S.oraSera)}
  if(e.target.id==="tn"){S.tutorNome=e.target.value.trim()||"Orione";S.prefMod=now();save();toast("Nome del tutor salvato")}});
function scegliFotoProfilo(){scegliFoto(async b=>{const t=await miniatura(b);if(t){S.avatar=t;S.avatarTipo="foto";S.prefMod=now();save();render()}})}
function coloriMaterie(){sheet(`<h2>Colori delle materie</h2><p class="small muted">Tocca il colore per cambiarlo.</p><div class="card flush list">${MATERIE.map(m=>`<label class="row" style="cursor:pointer"><span class="grow b small">${m}</span><input type="color" data-mat="${m}" value="${mcol(m)}" style="width:52px;height:36px;border:0;background:none;padding:0" aria-label="Colore di ${m}"></label>`).join("")}</div>
  <div class="row"><button class="btn ghost grow" data-s="reset">Colori originali</button><button class="btn grow" data-s="ok">Fatto</button></div>`,(k,bg)=>{
  if(k==="reset"){S.coloriMaterie={};S.prefMod=now();save();bg.remove();render();return}
  const cm={};bg.querySelectorAll("[data-mat]").forEach(i=>{if(i.value.toLowerCase()!==(MCOL[i.dataset.mat]||"").toLowerCase())cm[i.dataset.mat]=i.value});S.coloriMaterie=cm;S.prefMod=now();save();bg.remove();render()})}
function rimpicciolisci(b64){return new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6).split(",")[1])};im.onerror=()=>ok(b64);im.src="data:image/jpeg;base64,"+b64})}

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
if(window.speechSynthesis)speechSynthesis.getVoices();
render();initFirebase();

</script>
