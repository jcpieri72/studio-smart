<style>
:root{
  --paper:#F6F8FB; --grid:rgba(36,87,214,.07); --card:#FFFFFF; --line:#DCE3EE;
  --ink:#1B2B4B; --ink2:#55627F; --blue:#2457D6; --blue-soft:#E7EEFF;
  --yellow:#FFD23F; --red:#E23D3D; --red-soft:#FDECEC; --green:#12945F; --green-soft:#E3F6EC;
  --shadow:0 1px 0 rgba(27,43,75,.06),0 6px 18px -10px rgba(27,43,75,.25);
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --fs:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121A26; --grid:rgba(255,255,255,.045); --card:#1B2533; --line:#2C3A4F;
    --ink:#E8EEF8; --ink2:#9FB0CB; --blue:#7EA5FF; --blue-soft:#22314D;
    --red:#FF7272; --red-soft:#3A2228; --green:#3DD68C; --green-soft:#183427;
    --shadow:0 6px 18px -10px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121A26; --grid:rgba(255,255,255,.045); --card:#1B2533; --line:#2C3A4F;
  --ink:#E8EEF8; --ink2:#9FB0CB; --blue:#7EA5FF; --blue-soft:#22314D;
  --red:#FF7272; --red-soft:#3A2228; --green:#3DD68C; --green-soft:#183427;
  --shadow:0 6px 18px -10px rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-size="big"]{--fs:18.5px}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{
  margin:0;min-height:100%;font-family:var(--font);font-size:var(--fs);line-height:1.55;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
sup{font-size:.7em;line-height:0}

/* barra in alto */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:var(--card);border-bottom:1.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.12em;letter-spacing:-.01em;flex:1;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand small{font-weight:400;color:var(--ink2);font-size:.62em;margin-left:2px}
.sync{display:flex;align-items:center;gap:6px;font-size:.78em;color:var(--ink2);background:none;border:1.5px solid var(--line);border-radius:99px;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.dot.on{background:var(--green)} .dot.off{background:#B9C2D3}

/* struttura */
.wrap{display:flex;min-height:calc(100vh - 56px)}
main{flex:1;min-width:0;padding:18px 16px 110px;max-width:780px;margin:0 auto;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  background:var(--card);border-top:1.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.7em;color:var(--ink2);padding:6px 2px;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.act{color:var(--blue);font-weight:600}
.nav button.act svg{stroke-width:2.4}
@media (min-width:900px){
  .nav{position:sticky;top:57px;bottom:auto;right:auto;height:calc(100vh - 57px);flex-direction:column;justify-content:flex-start;
    gap:4px;width:200px;border-top:0;border-right:1.5px solid var(--line);padding:16px 10px}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:.92em;padding:10px 14px;justify-content:flex-start}
  .nav button.act{background:var(--blue-soft)}
  main{padding:28px 32px 60px}
}

/* tipografia */
h1{font-size:1.65em;line-height:1.15;margin:.2em 0 .35em;letter-spacing:-.02em}
h2{font-size:1.2em;margin:1.4em 0 .6em;letter-spacing:-.01em}
h3{font-size:1.04em;margin:0 0 .35em}
p{margin:.45em 0}
.muted{color:var(--ink2)}
.small{font-size:.86em}

/* blocchi */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;
  font-weight:600;background:var(--blue);color:#fff;min-height:46px}
:root[data-theme="dark"] .btn{color:#0E1726}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1726}}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78em;padding:3px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-weight:600}

/* saluto */
.hello{margin:4px 0 18px}
.hello h1{font-size:1.9em}
.topic.next{border-left:6px solid var(--tc,var(--blue))}

/* righello (elemento distintivo) */
.ruler{position:relative;height:30px;border:1.5px solid var(--ink2);border-radius:5px;background:var(--card);overflow:hidden}
.ruler .fill{position:absolute;inset:0 auto 0 0;background:var(--tc,var(--yellow));opacity:.38;transition:width .6s ease}
.ruler::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(90deg,var(--ink2) 1.5px,transparent 1.5px) 0 0/10% 13px repeat-x,
   linear-gradient(90deg,var(--ink2) 1px,transparent 1px) 0 0/2% 6px repeat-x,
   linear-gradient(90deg,var(--ink2) 1px,transparent 1px) 0 0/5% 9px repeat-x;opacity:.65}
.ruler .val{position:absolute;right:8px;bottom:2px;font-size:.72em;font-weight:700;color:var(--ink)}
.ruler.big{height:44px}
.ruler.big .val{font-size:.9em;bottom:4px}

/* argomenti */
.topics{display:grid;gap:12px}
@media (min-width:620px){.topics{grid-template-columns:1fr 1fr}}
.topic{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.topic .head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.tnum{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--tc)}
.topic h3{margin:0;font-size:1em}
.topic .sub{font-size:.8em;color:var(--ink2)}
.medal{font-size:1.25em}

/* pagina argomento */
.thead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.thead .tnum{width:52px;height:52px;font-size:1.25em}
.back{background:none;border:0;color:var(--blue);font-weight:600;padding:6px 0;margin-bottom:6px;display:inline-flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px;margin:14px 0 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:600;color:var(--ink2)}
.tabs button.act{background:var(--tc,var(--blue));color:#fff}

/* lezioni */
.lesson{position:relative}
.lesson .step{font-size:.8em;color:var(--ink2);margin-bottom:4px}
.lesson h3{font-size:1.18em}
.lesson ul{padding-left:1.2em;margin:.4em 0}
.lesson li{margin:.25em 0}
.ex{background:var(--blue-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.ex b:first-child{color:var(--blue)}
.hl{background:linear-gradient(transparent 55%,rgba(255,210,63,.6) 55%);padding:0 2px}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:.9em;min-width:280px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{background:var(--blue-soft)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--tc,var(--blue))}
.dots i.cur{outline:2px solid var(--tc,var(--blue));outline-offset:2px}
.lnav{display:flex;gap:10px}
.lnav .btn{flex:1}

/* scaletta */
.ladder{display:flex;flex-direction:column;gap:3px;margin:10px 0}
.ladder div{display:flex;align-items:center;gap:10px}
.ladder span{display:inline-block;padding:5px 10px;border-radius:8px;background:var(--blue-soft);font-weight:700;min-width:58px;text-align:center}
.ladder .base{background:var(--yellow);color:#1B2B4B}

/* trucchi */
.trick{background:var(--card);border:1.5px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px;position:relative;box-shadow:var(--shadow)}
.trick::before{content:"";position:absolute;left:-1.5px;top:-1.5px;width:58px;height:7px;background:var(--tc,var(--yellow));border-radius:4px 4px 0 0;opacity:.85}
.trick h3{margin-top:4px}
.hand{font-family:var(--hand);font-size:1.6em;line-height:1.2;color:var(--blue);margin:6px 0}

/* triangolo delle formule */
.tri{position:relative;width:230px;height:200px;margin:10px auto 4px}
.tri .shape{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--tc,var(--blue));opacity:.18}
.tri .bar{position:absolute;left:22%;right:22%;top:54%;height:3px;background:var(--ink)}
.tri .mid{position:absolute;left:50%;top:64%;width:3px;height:30%;background:var(--ink);transform:translateX(-50%)}
.tri button{position:absolute;width:62px;height:62px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:1.4em;font-weight:700;font-style:italic}
.tri button.cov{background:var(--ink);color:var(--card)}
.tri .t{left:50%;top:18%;transform:translateX(-50%)}
.tri .l{left:12%;bottom:4%}
.tri .r{right:12%;bottom:4%}
.trires{text-align:center;font-size:1.25em;font-weight:700;min-height:1.6em}

/* livelli */
.levels{display:grid;gap:10px}
.level{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.level .lv{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:700;flex:none}
.level.test{border-color:var(--tc,var(--blue));border-width:2px}
.stars{letter-spacing:2px;font-size:1.05em;color:#E5A800}
.stars .no{color:var(--line)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qbar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--tc,var(--blue));transition:width .3s}
.qcount{font-size:.85em;color:var(--ink2);font-weight:600}
.qtext{font-size:1.14em;font-weight:500;margin:4px 0 16px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);min-height:54px;font-size:1.02em}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.ko{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default;opacity:1}
.numrow{display:flex;gap:8px;align-items:stretch}
.numrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.15em;background:var(--card)}
.numrow input:focus{border-color:var(--blue);outline:none}
.numrow .unit{display:grid;place-items:center;padding:0 12px;font-weight:700;color:var(--ink2)}
.keys{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.keys button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{border-color:var(--green);background:var(--green-soft)}
.fb.ko{border-color:var(--red);background:var(--red-soft)}
.fb h3{margin:0 0 4px}
.fb.ok h3{color:var(--green)} .fb.ko h3{color:var(--red)}
.qfoot{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px}

/* risultato */
.result{text-align:center}
.result .score{font-size:3.2em;font-weight:700;letter-spacing:-.03em;line-height:1}
.result .stars{font-size:2em}
.wrong{border-left:4px solid var(--red)}

/* impostazioni / selezione */
.check{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);padding:10px 6px;font-size:.9em}
.seg button.act{background:var(--blue);color:#fff;font-weight:600}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card)}
.formula{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.formula:last-child{border-bottom:0}
.formula b{font-size:1.08em;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;z-index:50;font-size:.9em;max-width:90vw}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

<header class="top"><div class="brand"><svg class="brand-mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#2457D6"/><rect x="10" y="38" width="44" height="15" rx="3" fill="#FFD23F"/><path d="M16 38v7M22 38v4M28 38v7M34 38v4M40 38v7M46 38v4" stroke="#1B2B4B" stroke-width="2.4" stroke-linecap="round"/><path d="M23 30V12h17M23 21h12" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
<span>FisicaFacile</span></div><button class="sync" id="sync" data-go="impostazioni" aria-label="Stato sincronizzazione"></button></header>
<div class="wrap"><nav class="nav" id="nav" aria-label="Menu"></nav><main id="main"></main></div>
<script>
// ===== CONTENUTI: 9 argomenti di fisica per la 1ª superiore =====
const TOPICS = [
{ id:1, color:"#2457D6", title:"Grandezze fisiche e Sistema Internazionale", short:"Grandezze fisiche",
  sub:"Cosa si misura, fondamentali e derivate, unità SI",
  lessons:[
   {t:"Che cos’è una grandezza fisica", h:`
    <p>Una <span class="hl">grandezza fisica</span> è una caratteristica che si può <b>misurare</b> con uno strumento e che dà lo stesso risultato per tutti.</p>
    <div class="ex"><b>Sì:</b> la lunghezza del banco, la massa dello zaino, il tempo di una corsa, la temperatura della stanza.</div>
    <div class="ex"><b>No:</b> la bellezza di un quadro, la simpatia di un amico, il coraggio. Non esiste uno strumento che li misuri per tutti allo stesso modo.</div>`},
   {t:"Misurare = confrontare", h:`
    <p><b>Misurare</b> vuol dire confrontare una grandezza con un’altra della stessa specie scelta come <span class="hl">unità di misura</span>, e contare quante volte ci sta.</p>
    <div class="ex"><b>Esempio:</b> il banco è lungo 1,2 m: il metro “ci sta” 1,2 volte.</div>
    <p>Una misura ha sempre <b>due parti</b>: il numero e l’unità. Scrivere solo “1,2” non vuol dire niente!</p>
    <div class="ex"><b>Come in ragioneria:</b> “costa 15” non basta, serve dire 15 € o 15 $.</div>`},
   {t:"Il Sistema Internazionale (SI)", h:`
    <p>Per capirsi in tutto il mondo si usa il <b>Sistema Internazionale</b>, che fissa <span class="hl">7 grandezze fondamentali</span>, ognuna con la sua unità:</p>
    <div class="tbl"><table><tr><th>Grandezza</th><th>Unità</th><th>Simbolo</th></tr>
    <tr><td>lunghezza</td><td>metro</td><td>m</td></tr><tr><td>massa</td><td>kilogrammo</td><td>kg</td></tr>
    <tr><td>tempo</td><td>secondo</td><td>s</td></tr><tr><td>temperatura</td><td>kelvin</td><td>K</td></tr>
    <tr><td>intensità di corrente</td><td>ampere</td><td>A</td></tr><tr><td>quantità di sostanza</td><td>mole</td><td>mol</td></tr>
    <tr><td>intensità luminosa</td><td>candela</td><td>cd</td></tr></table></div>
    <p class="small muted">Le più usate quest’anno: lunghezza, massa e tempo.</p>`},
   {t:"Grandezze derivate", h:`
    <p>Le <span class="hl">grandezze derivate</span> si ottengono combinando quelle fondamentali con moltiplicazioni e divisioni.</p>
    <div class="tbl"><table><tr><th>Grandezza</th><th>Come si ottiene</th><th>Unità SI</th></tr>
    <tr><td>area</td><td>lunghezza × lunghezza</td><td>m²</td></tr>
    <tr><td>volume</td><td>lunghezza × lunghezza × lunghezza</td><td>m³</td></tr>
    <tr><td>velocità</td><td>lunghezza ÷ tempo</td><td>m/s</td></tr>
    <tr><td>densità</td><td>massa ÷ volume</td><td>kg/m³</td></tr></table></div>`},
   {t:"Come si scrivono le unità", h:`
    <ul><li>Il simbolo va <b>dopo</b> il numero, con uno spazio: <b>5 kg</b>.</li>
    <li>Niente punto dopo il simbolo: <b>20 s</b>, non “20 sec.”</li>
    <li>Maiuscole e minuscole contano: <b>km</b> (non Km), <b>m</b> (non M o mt), <b>kg</b> (non Kg).</li>
    <li>Il simbolo non ha plurale: <b>3 kg</b>, non “3 kgs”.</li></ul>
    <div class="ex"><b>Attenzione:</b> M maiuscola vuol dire “mega” (un milione), m minuscola “metro” o “milli”. Cambia tutto!</div>`}
  ],
  tricks:[
   {t:"Le 7 fondamentali in una frase", hand:"Luca Mangia Tre Torte, Carla Quattro Insalate", h:`<p>Le iniziali: <b>L</b>unghezza, <b>M</b>assa, <b>T</b>empo, <b>T</b>emperatura, <b>C</b>orrente, <b>Q</b>uantità di sostanza, <b>I</b>ntensità luminosa.</p>`},
   {t:"Fondamentale o derivata?", hand:"Ha una formula? Allora è derivata!", h:`<p>Se per calcolarla devi fare un’operazione con altre grandezze (÷ o ×), è derivata. La velocità è spazio ÷ tempo → derivata.</p>`},
   {t:"Misura o opinione?", hand:"Se due persone possono litigare sul risultato, non è una grandezza fisica", h:`<p>La lunghezza del banco è uguale per tutti. Quanto è bello il banco… dipende da chi lo guarda!</p>`},
   {t:"I simboli sono “nomi propri”", hand:"kg, m, s: sempre minuscoli, senza punto, senza plurale", h:`<p>Scrivili sempre uguali, come la sigla di una provincia: TV non diventa “Tv.”</p>`}
  ],
  formulas:[["Misura","numero + unità (es. 5 kg)"],["Area","m²"],["Volume","m³"],["Velocità","m/s"],["Densità","kg/m³"]]
},
{ id:2, color:"#12945F", title:"Multipli, sottomultipli ed equivalenze", short:"Equivalenze",
  sub:"La scaletta delle unità: lunghezza, superficie, volume, massa, tempo",
  lessons:[
   {t:"Multipli e sottomultipli", h:`
    <p>Per non scrivere numeri lunghissimi si usano i <span class="hl">prefissi</span> davanti all’unità:</p>
    <div class="tbl"><table><tr><th>Prefisso</th><th>Simbolo</th><th>Vale</th></tr>
    <tr><td>kilo</td><td>k</td><td>× 1000</td></tr><tr><td>etto</td><td>h</td><td>× 100</td></tr>
    <tr><td>deca</td><td>da</td><td>× 10</td></tr><tr><td><b>unità</b></td><td></td><td>× 1</td></tr>
    <tr><td>deci</td><td>d</td><td>÷ 10</td></tr><tr><td>centi</td><td>c</td><td>÷ 100</td></tr>
    <tr><td>milli</td><td>m</td><td>÷ 1000</td></tr></table></div>
    <p class="small muted">Più grandi: mega (M) = un milione, giga (G) = un miliardo. Più piccoli: micro (µ) = un milionesimo.</p>`},
   {t:"La scaletta della lunghezza", h:`
    <div class="ladder"><div><span>km</span></div><div><span>hm</span></div><div><span>dam</span></div><div><span class="base">m</span></div><div><span>dm</span></div><div><span>cm</span></div><div><span>mm</span></div></div>
    <p>Ogni gradino vale <b>× 10</b>. <b>Scendi</b> (verso unità più piccole) → <b>moltiplichi</b>. <b>Sali</b> → <b>dividi</b>.</p>
    <div class="ex"><b>Esempio:</b> 3,5 km in m: scendi 3 gradini → × 1000 → <b>3500 m</b>.</div>
    <p>Per la massa la scaletta è uguale: kg, hg, dag, <b>g</b>, dg, cg, mg. Per la capacità: kL, hL, daL, <b>L</b>, dL, cL, mL.</p>`},
   {t:"Superficie: gradini da 100", h:`
    <p>Per le aree (m²) ogni gradino vale <b>× 100</b>, cioè 2 zeri.</p>
    <div class="ex"><b>Perché?</b> Un quadrato di 1 m di lato è lungo 10 dm per 10 dm: dentro ci stanno 10 × 10 = 100 dm².</div>
    <div class="ex"><b>Esempio:</b> 4 m² in cm²: scendi 2 gradini → × 100 × 100 = × 10 000 → <b>40 000 cm²</b>.</div>`},
   {t:"Volume: gradini da 1000", h:`
    <p>Per i volumi (m³) ogni gradino vale <b>× 1000</b>, cioè 3 zeri: m³, dm³, cm³, mm³.</p>
    <div class="ex"><b>Esempio:</b> 2 dm³ in cm³ → × 1000 → <b>2000 cm³</b>.</div>
    <p>Volume e capacità si collegano così:</p>
    <ul><li><b>1 dm³ = 1 L</b> (un cubo di 10 cm di lato contiene un litro)</li><li><b>1 cm³ = 1 mL</b></li><li><b>1 m³ = 1000 L</b></li></ul>`},
   {t:"Il tempo non è decimale", h:`
    <p>Il tempo non va di 10 in 10, ma di <b>60</b>:</p>
    <ul><li>1 h = 60 min</li><li>1 min = 60 s</li><li>1 h = 3600 s</li></ul>
    <div class="ex"><b>Esempio:</b> 1,5 h = 1,5 × 3600 = <b>5400 s</b>. Attenzione: 1,5 h è un’ora e mezza, <b>non</b> 1 h e 50 min!</div>
    <p>Velocità: per passare da <b>km/h a m/s dividi per 3,6</b>; da m/s a km/h moltiplica per 3,6.</p>
    <div class="ex"><b>Esempio:</b> 72 km/h ÷ 3,6 = <b>20 m/s</b>.</div>`}
  ],
  tricks:[
   {t:"L’ordine dei prefissi", hand:"Ken Ha Dato Un Dolce a Cinzia e Marco", h:`<p><b>k</b>ilo, <b>h</b>etto (etto), <b>da</b> (deca), <b>U</b>nità, <b>d</b>eci, <b>c</b>enti, <b>m</b>illi. Dall’alto verso il basso.</p>`},
   {t:"Su o giù?", hand:"Scendi la scala: il numero cresce", h:`<p>Unità più piccola = ce ne vogliono di più = numero più grande. 1 m = 100 cm: il centimetro è piccolo, quindi il numero è grande.</p>`},
   {t:"Quanti zeri per gradino?", hand:"L’esponente ti dice gli zeri: m → 1, m² → 2, m³ → 3", h:`<p>Lunghezza: 1 zero per gradino. Superficie (²): 2 zeri. Volume (³): 3 zeri.</p>`},
   {t:"Litri e cubi", hand:"Un litro è un cubo di 10 cm", h:`<p>Pensa a un cartone del latte: circa 1 L = 1 dm³. E 1 mL è un cubetto di 1 cm di lato, come un dado da gioco.</p>`},
   {t:"km/h e m/s", hand:"Per andare forte (km/h) moltiplica per 3,6", h:`<p>I km/h sono sempre il numero più grande. 10 m/s × 3,6 = 36 km/h.</p>`}
  ],
  formulas:[["Lunghezza, massa, capacità","1 gradino = × 10"],["Superficie","1 gradino = × 100"],["Volume","1 gradino = × 1000"],["1 dm³","= 1 L"],["1 cm³","= 1 mL"],["1 h","= 60 min = 3600 s"],["km/h → m/s","÷ 3,6"]]
},
{ id:3, color:"#7C4DDB", title:"Notazione scientifica e ordini di grandezza", short:"Notazione scientifica",
  sub:"Numeri enormi e minuscoli scritti in modo comodo",
  lessons:[
   {t:"Le potenze di 10", h:`
    <p>10<sup>n</sup> è un 1 seguito da <b>n zeri</b>: 10<sup>3</sup> = 1000, 10<sup>6</sup> = 1 000 000.</p>
    <p>Con l’esponente negativo è un numero piccolo: 10<sup>−1</sup> = 0,1; 10<sup>−3</sup> = 0,001.</p>
    <div class="ex"><b>Regola:</b> 10<sup>−n</sup> ha la cifra 1 all’<b>n-esimo</b> posto dopo la virgola.</div>
    <p>E 10<sup>0</sup> = 1.</p>`},
   {t:"Notazione scientifica", h:`
    <p>Un numero è in <span class="hl">notazione scientifica</span> quando è scritto così:</p>
    <p style="text-align:center;font-size:1.3em"><b>a · 10<sup>n</sup></b></p>
    <p>dove <b>a</b> è compreso tra 1 e 10 (1 incluso, 10 escluso) e <b>n</b> è un intero.</p>
    <div class="ex"><b>Giusto:</b> 3,5 · 10<sup>4</sup><br><b>Sbagliato:</b> 35 · 10<sup>3</sup> (35 è più grande di 10) e 0,35 · 10<sup>5</sup> (0,35 è più piccolo di 1).</div>`},
   {t:"Come si trasforma un numero", h:`
    <p>Sposta la virgola finché davanti resta <b>una sola cifra diversa da zero</b>, e conta i salti.</p>
    <div class="ex"><b>Numero grande:</b> 45 000 → 4,5 → la virgola salta 4 posti a sinistra → <b>4,5 · 10<sup>4</sup></b></div>
    <div class="ex"><b>Numero piccolo:</b> 0,0032 → 3,2 → la virgola salta 3 posti a destra → <b>3,2 · 10<sup>−3</sup></b></div>`},
   {t:"Calcolare con le potenze", h:`
    <ul><li><b>Moltiplicazione:</b> moltiplichi i numeri e <b>sommi</b> gli esponenti.<br>(2 · 10<sup>3</sup>) · (4 · 10<sup>5</sup>) = 8 · 10<sup>8</sup></li>
    <li><b>Divisione:</b> dividi i numeri e <b>sottrai</b> gli esponenti.<br>(9 · 10<sup>7</sup>) : (3 · 10<sup>2</sup>) = 3 · 10<sup>5</sup></li></ul>
    <p class="small muted">Se il risultato ha il numero davanti ≥ 10, sistemalo: 12 · 10<sup>4</sup> = 1,2 · 10<sup>5</sup>.</p>`},
   {t:"L’ordine di grandezza", h:`
    <p>L’<span class="hl">ordine di grandezza</span> è la potenza di 10 più vicina al numero. Serve per fare stime veloci.</p>
    <p>Scrivi il numero in notazione scientifica <b>a · 10<sup>n</sup></b>:</p>
    <ul><li>se <b>a &lt; 5</b> → l’ordine è <b>10<sup>n</sup></b></li><li>se <b>a ≥ 5</b> → l’ordine è <b>10<sup>n+1</sup></b></li></ul>
    <div class="ex"><b>Esempio:</b> 3,2 · 10<sup>4</sup> → 10<sup>4</sup>; 7,1 · 10<sup>4</sup> → 10<sup>5</sup>.</div>
    <p class="small muted">Alcuni libri usano 3,16 invece di 5: controlla quale regola usa il tuo professore.</p>`}
  ],
  tricks:[
   {t:"Il segno dell’esponente", hand:"Numero grande → esponente positivo. Numero piccolo (sotto 1) → esponente negativo", h:`<p>Prima di contare i salti, decidi il segno guardando il numero: 0,0007 è piccolo, quindi l’esponente sarà negativo.</p>`},
   {t:"Contare i salti", hand:"Ogni salto della virgola = 1 nell’esponente", h:`<p>Metti il dito sulla virgola e saltella fino a dopo la prima cifra diversa da zero. Quanti salti? Quello è l’esponente.</p>`},
   {t:"Prodotto e divisione", hand:"Per (×) le potenze si sommano, per (÷) si sottraggono", h:`<p>10<sup>3</sup> × 10<sup>2</sup> = 10<sup>5</sup> perché 1000 × 100 = 100 000: hai messo insieme gli zeri.</p>`},
   {t:"Ordine di grandezza", hand:"Da 5 in su si arrotonda in su", h:`<p>Come con i voti: 6,5 diventa 7. Così 6 · 10<sup>3</sup> ha ordine 10<sup>4</sup>.</p>`}
  ],
  formulas:[["Notazione scientifica","a · 10ⁿ con 1 ≤ a < 10"],["Prodotto","10ᵃ · 10ᵇ = 10ᵃ⁺ᵇ"],["Divisione","10ᵃ : 10ᵇ = 10ᵃ⁻ᵇ"],["10⁰","= 1"],["Ordine di grandezza","a < 5 → 10ⁿ; a ≥ 5 → 10ⁿ⁺¹"]]
},
{ id:4, color:"#D46A00", title:"Strumenti di misura: portata e sensibilità", short:"Strumenti di misura",
  sub:"Fin dove misura uno strumento e quanto è preciso",
  lessons:[
   {t:"Gli strumenti di misura", h:`
    <p>Ogni grandezza ha i suoi strumenti:</p>
    <ul><li><b>lunghezza:</b> righello, metro a nastro, calibro</li><li><b>massa:</b> bilancia</li><li><b>tempo:</b> cronometro</li><li><b>temperatura:</b> termometro</li></ul>
    <p>Per scegliere lo strumento giusto guardiamo due caratteristiche: la <b>portata</b> e la <b>sensibilità</b>.</p>`},
   {t:"La portata", h:`
    <p>La <span class="hl">portata</span> è il <b>valore più grande</b> che lo strumento può misurare.</p>
    <div class="ex"><b>Esempi:</b> un righello da 30 cm ha portata 30 cm; una bilancia da cucina che arriva a 5 kg ha portata 5 kg.</div>
    <p>Se l’oggetto supera la portata, lo strumento non va bene (o devi fare più misure, sommando gli errori).</p>`},
   {t:"La sensibilità", h:`
    <p>La <span class="hl">sensibilità</span> è la <b>più piccola variazione</b> che lo strumento riesce a misurare: in pratica, il valore di <b>una tacca</b>.</p>
    <div class="ex"><b>Esempio:</b> un righello con le tacche dei millimetri ha sensibilità 1 mm = 0,1 cm.</div>
    <p>Come si calcola: <b>sensibilità = intervallo della scala ÷ numero di tacche (intervalli)</b>.</p>
    <div class="ex"><b>Esempio:</b> scala da 0 a 50 cm con 500 intervalli → 50 ÷ 500 = <b>0,1 cm</b>.</div>`},
   {t:"Più sensibile = tacca più piccola", h:`
    <p>Uno strumento è <b>più sensibile</b> quando la sua sensibilità è un numero <b>più piccolo</b>: nota differenze minori.</p>
    <div class="ex"><b>Esempio:</b> un calibro da 0,05 mm è più sensibile di un righello da 1 mm.</div>
    <p>La misura si scrive con le cifre che lo strumento permette di leggere: con un righello da 1 mm scrivi <b>12,3 cm</b>, non 12,35 cm.</p>`},
   {t:"Altre caratteristiche", h:`
    <ul><li><b>Prontezza:</b> quanto velocemente lo strumento dà la misura (un termometro digitale è più pronto di quello a mercurio).</li>
    <li><b>Strumenti analogici:</b> hanno una scala con le tacche e un indice.</li>
    <li><b>Strumenti digitali:</b> mostrano direttamente le cifre; la sensibilità è l’ultima cifra che cambia.</li></ul>`}
  ],
  tricks:[
   {t:"Portata", hand:"Portata = fin dove PORTA lo strumento", h:`<p>È il massimo, il fondo scala. Come la portata di un camion: oltre non ci sta.</p>`},
   {t:"Sensibilità", hand:"Una persona sensibile nota anche le piccole cose", h:`<p>Uno strumento sensibile nota piccole differenze. Più la tacca è piccola, più è sensibile.</p>`},
   {t:"Calcolo della sensibilità", hand:"Quanto è lunga la scala ÷ quante tacche", h:`<p>È come dividere una pizza: 50 cm divisi in 500 fette = ogni fetta 0,1 cm.</p>`},
   {t:"Quante cifre scrivo?", hand:"L’ultima cifra della misura è quella della tacca", h:`<p>Se la sensibilità è 0,1 cm, la misura ha una cifra dopo la virgola in cm: 12,3 cm.</p>`}
  ],
  formulas:[["Portata","valore massimo misurabile"],["Sensibilità","intervallo della scala ÷ n° di intervalli"],["Più sensibile","sensibilità più piccola"]]
},
{ id:5, color:"#D63B3B", title:"Errori di misura", short:"Errori di misura",
  sub:"Valore medio, errore assoluto, relativo e percentuale",
  lessons:[
   {t:"Ogni misura ha un errore", h:`
    <p>Nessuna misura è perfetta: c’è sempre un’<span class="hl">incertezza</span>.</p>
    <ul><li><b>Errori casuali:</b> a volte in più, a volte in meno (riflessi, posizione dell’occhio). Si riducono ripetendo la misura.</li>
    <li><b>Errori sistematici:</b> sempre nello stesso verso (strumento tarato male, bilancia che non parte da zero).</li></ul>`},
   {t:"Una sola misura", h:`
    <p>Se misuri una volta sola, l’errore è la <b>sensibilità dello strumento</b>.</p>
    <div class="ex"><b>Esempio:</b> righello con sensibilità 0,1 cm, leggi 23,4 cm → <b>(23,4 ± 0,1) cm</b>.</div>`},
   {t:"Tante misure: il valore medio", h:`
    <p>Se ripeti la misura più volte, il valore migliore è il <span class="hl">valore medio</span>: sommi tutte le misure e dividi per quante sono.</p>
    <div class="ex"><b>Esempio:</b> 12,1 – 12,3 – 12,2 – 12,4 s → (12,1 + 12,3 + 12,2 + 12,4) ÷ 4 = <b>12,25 s</b></div>`},
   {t:"Errore assoluto", h:`
    <p>Con più misure, l’<span class="hl">errore assoluto</span> è la <b>semidispersione</b>: (valore massimo − valore minimo) ÷ 2.</p>
    <div class="ex"><b>Esempio:</b> (12,4 − 12,1) ÷ 2 = <b>0,15 s</b> → risultato: (12,25 ± 0,15) s</div>
    <p>Ha la stessa unità di misura della grandezza.</p>`},
   {t:"Errore relativo e percentuale", h:`
    <p>L’<span class="hl">errore relativo</span> dice quanto pesa l’errore rispetto alla misura: <b>Er = Ea ÷ valore medio</b>. Non ha unità.</p>
    <p>L’<b>errore percentuale</b> è lo stesso moltiplicato per 100: <b>E% = Er × 100</b>.</p>
    <div class="ex"><b>Esempio:</b> 0,15 ÷ 12,25 ≈ 0,012 → <b>1,2%</b></div>
    <p>Più l’errore relativo è piccolo, <b>più la misura è precisa</b>.</p>`}
  ],
  tricks:[
   {t:"Errore assoluto", hand:"Metà della distanza tra il più grande e il più piccolo", h:`<p>Max − min, poi diviso 2. Il risultato copre tutte le misure fatte.</p>`},
   {t:"Errore relativo", hand:"Sbagliare di 1 cm su un banco o su un campo da calcio non è la stessa cosa!", h:`<p>Per questo si divide per la misura: conta quanto è grande l’errore <b>rispetto</b> a ciò che misuri.</p>`},
   {t:"Come in ragioneria", hand:"L’errore percentuale è uno sconto al contrario", h:`<p>Er × 100 = percentuale, esattamente come calcoli il 3% di sconto su un prezzo.</p>`}
  ],
  formulas:[["Valore medio","somma delle misure ÷ numero di misure"],["Errore assoluto (1 misura)","= sensibilità"],["Errore assoluto (più misure)","(max − min) ÷ 2"],["Errore relativo","Er = Ea ÷ valore medio"],["Errore percentuale","E% = Er × 100"]]
},
{ id:6, color:"#0E8F9B", title:"Cifre significative e arrotondamenti", short:"Cifre significative",
  sub:"Quali cifre contano e come arrotondare",
  lessons:[
   {t:"Cosa sono", h:`
    <p>Le <span class="hl">cifre significative</span> sono le cifre di una misura che sono davvero state misurate (più l’ultima, incerta).</p>
    <div class="ex"><b>Esempio:</b> 12,3 cm ha 3 cifre significative.</div>`},
   {t:"Le regole degli zeri", h:`
    <ul><li>Le cifre diverse da zero contano <b>sempre</b>.</li>
    <li>Gli zeri <b>in mezzo</b> contano: 1002 → 4 cifre.</li>
    <li>Gli zeri <b>all’inizio</b> non contano mai: 0,0045 → 2 cifre.</li>
    <li>Gli zeri <b>alla fine dopo la virgola</b> contano: 3,00 → 3 cifre.</li></ul>
    <div class="ex"><b>Per questo</b> 3,0 cm e 3,00 cm non sono la stessa misura: la seconda è più precisa.</div>`},
   {t:"Arrotondare", h:`
    <p>Per tenere solo alcune cifre, guarda la <b>prima cifra che togli</b>:</p>
    <ul><li>se è <b>0, 1, 2, 3 o 4</b> → l’ultima cifra rimane uguale</li><li>se è <b>5, 6, 7, 8 o 9</b> → l’ultima cifra aumenta di 1</li></ul>
    <div class="ex"><b>Esempio:</b> 3,14159 con 3 cifre → 3,14. 12,48 con 3 cifre → 12,5.</div>`},
   {t:"Nei calcoli", h:`
    <p>Quando moltiplichi o dividi delle misure, il risultato va scritto con <b>lo stesso numero di cifre significative della misura che ne ha meno</b>.</p>
    <div class="ex"><b>Esempio:</b> 2,5 cm × 3,42 cm = 8,55 cm² → la misura “peggiore” ha 2 cifre → <b>8,6 cm²</b>.</div>`}
  ],
  tricks:[
   {t:"Gli zeri", hand:"Zeri davanti: mai. Zeri in mezzo: sempre. Zeri in fondo dopo la virgola: sì", h:`<p>Leggi il numero da sinistra: comincia a contare dalla prima cifra diversa da zero.</p>`},
   {t:"Arrotondamento", hand:"Da 5 in su si sale", h:`<p>Guardi solo la prima cifra che butti via, non le altre.</p>`},
   {t:"Calcoli", hand:"Una catena è forte come il suo anello più debole", h:`<p>Il risultato non può essere più preciso della misura meno precisa.</p>`}
  ],
  formulas:[["Zeri iniziali","non contano"],["Zeri in mezzo","contano"],["Zeri finali dopo la virgola","contano"],["Arrotondamento","≥ 5 si arrotonda in su"],["Prodotto / divisione","cifre della misura meno precisa"]]
},
{ id:7, color:"#B4530A", title:"Densità e altre grandezze derivate", short:"Densità",
  sub:"d = m / V, velocità, area e volume",
  lessons:[
   {t:"Che cos’è la densità", h:`
    <p>La <span class="hl">densità</span> dice quanta <b>massa</b> c’è in un certo <b>volume</b>. Più materia “stretta” in poco spazio = più densità.</p>
    <p style="text-align:center;font-size:1.35em"><b>d = m ÷ V</b></p>
    <div class="ex"><b>Esempio:</b> un kg di piume e un kg di ferro hanno la stessa massa, ma le piume occupano molto più spazio: hanno densità minore.</div>`},
   {t:"Le unità della densità", h:`
    <p>Nel SI: <b>kg/m³</b>. Molto usato anche <b>g/cm³</b>.</p>
    <div class="ex"><b>Regola:</b> 1 g/cm³ = 1000 kg/m³. Da g/cm³ a kg/m³ <b>moltiplichi per 1000</b>.</div>
    <p>Utile anche: 1 g/cm³ = 1 kg/dm³ = 1 kg/L.</p>
    <div class="tbl"><table><tr><th>Materiale</th><th>g/cm³</th><th>kg/m³</th></tr>
    <tr><td>sughero</td><td>0,24</td><td>240</td></tr><tr><td>legno (abete)</td><td>0,45</td><td>450</td></tr>
    <tr><td>olio d’oliva</td><td>0,92</td><td>920</td></tr><tr><td>acqua</td><td>1</td><td>1000</td></tr>
    <tr><td>alluminio</td><td>2,7</td><td>2700</td></tr><tr><td>ferro</td><td>7,9</td><td>7900</td></tr>
    <tr><td>rame</td><td>8,9</td><td>8900</td></tr><tr><td>piombo</td><td>11,3</td><td>11 300</td></tr>
    <tr><td>oro</td><td>19,3</td><td>19 300</td></tr></table></div>`},
   {t:"Trovare massa e volume", h:`
    <p>Dalla formula d = m ÷ V ricavi le altre due:</p>
    <ul><li><b>m = d × V</b></li><li><b>V = m ÷ d</b></li></ul>
    <div class="ex"><b>Esempio:</b> 2 L di olio (d = 0,92 kg/L) → m = 0,92 × 2 = <b>1,84 kg</b>.</div>
    <p>Prima di calcolare, controlla che le unità “vadano d’accordo” (g con cm³, kg con dm³ o m³).</p>`},
   {t:"Galleggia o affonda?", h:`
    <p>Un oggetto pieno <b>galleggia</b> in un liquido se la sua densità è <b>minore</b> di quella del liquido.</p>

const rnd=Math.random;
const rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=n=>Number(Number(n).toPrecision(12));
const NF=new Intl.NumberFormat("it-IT",{maximumFractionDigits:10});
const fmt=n=>{n=clean(n);return NF.format(n).replace(/-/g,"−")};

function mc(q,correct,distr,explain){
  const opts=[correct];for(const d of distr){if(!opts.includes(d))opts.push(d);if(opts.length>=4)break}
  const s=shuffle(opts);return{type:"mc",q,options:s,answer:s.indexOf(correct),explain};
}
function num(q,ans,explain,o={}){return{type:"num",q,answer:clean(ans),explain,unit:o.unit||"",tol:o.tol??1e-6,neg:!!o.neg}}

// ---------- 9. Vettori ----------
const SCAL=["la massa","il tempo","la temperatura","il volume","la densità","l’energia"];
const VETT=["lo spostamento","la velocità","la forza","l’accelerazione"];
const G9={
 1:[()=>{const v=rnd()<.5;const g=pick(v?VETT:SCAL);return mc(`${cap(g)} è una grandezza…`,v?"vettoriale":"scalare",[v?"scalare":"vettoriale"],v?`${cap(g)} ha anche direzione e verso: è <b>vettoriale</b>.`:`Per ${g} basta un numero con l’unità: è <b>scalare</b>.`)},
    ()=>mc("Per descrivere un vettore servono…","modulo, direzione e verso",["solo il modulo","modulo e unità di misura","direzione e colore"],"MDV: Modulo, Direzione, Verso.")],
 2:[()=>{const a=rint(2,15),b=rint(2,15);return num(`Due forze di <b>${a} N</b> e <b>${b} N</b> agiscono nella stessa direzione e nello <b>stesso verso</b>. Quanto vale la risultante?`,a+b,`Stesso verso → si sommano: ${a} + ${b} = <b>${a+b} N</b>`,{unit:"N"})},
    ()=>{let a=rint(5,20),b=rint(2,a-1);return num(`Due forze di <b>${a} N</b> e <b>${b} N</b> hanno la stessa direzione ma <b>versi opposti</b>. Quanto vale la risultante?`,a-b,`Versi opposti → si sottraggono: ${a} − ${b} = <b>${a-b} N</b> (nel verso della forza più grande)`,{unit:"N"})}],
 3:[()=>{const t=pick([[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17]]);return num(`Due forze <b>perpendicolari</b> valgono <b>${t[0]} N</b> e <b>${t[1]} N</b>. Quanto vale la risultante?`,t[2],`Pitagora: √(${t[0]}² + ${t[1]}²) = √${t[0]*t[0]+t[1]*t[1]} = <b>${t[2]} N</b>`,{unit:"N"})},
    ()=>mc("Cammini 3 km verso nord e poi 3 km verso sud. Qual è il tuo <b>spostamento</b>?","0 km",["6 km","3 km","9 km"],"Lo spostamento è un vettore: i due tratti hanno versi opposti e si annullano. Hai <b>percorso</b> 6 km, ma ti sei <b>spostato</b> di 0 km.")]
};

const GEN={1:G1,2:G2,3:G3,4:G4,5:G5,6:G6,7:G7,8:G8,9:G9};
function makeQuestion(topicId,level){return pick(GEN[topicId][level])()}
function makeSet(topicIds,levels,n){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard<400){guard++;const t=pick(topicIds),l=Array.isArray(levels)?levels[out.length%levels.length]:levels;
    const q=makeQuestion(t,l);if(seen.has(q.q))continue;seen.add(q.q);q.topic=t;q.level=l;out.push(q)}
  return out;
}

function parseUser(str){
  let s=String(str).trim().replace(/\s+/g,"").replace(/[−–]/g,"-");
  s=s.replace(/[x×*·]10\^?\(?(-?\d+)\)?/i,"e$1").replace(/[a-zA-Z°%€²³\/µ]+$/,"");
  const c=[];
  if(s.includes(","))c.push(s.replace(/\./g,"").replace(",","."));
  else if((s.match(/\./g)||[]).length>1)c.push(s.replace(/\./g,""));
  else if(/^-?\d{1,3}\.\d{3}$/.test(s)){c.push(s);c.push(s.replace(".",""))}
  else c.push(s);
  return c.map(Number).filter(x=>s!==""&&isFinite(x));
}

  return `<div class="card result pop" style="--tc:${tp?tp.color:"var(--blue)"}">
   <p class="muted" style="margin-top:0">${tp?tp.short:"Allenamento misto"}${r.level==="test"?" · mini-verifica":r.topic!=="mix"?` · livello ${r.level}`:""}</p>
   <div class="score">${r.score}<span class="muted" style="font-size:.45em">/${r.n}</span></div>
   ${r.level!=="test"&&r.topic!=="mix"?`<div style="margin:6px 0">${starsHtml(st)}</div>`:""}
   ${r.newMedal?`<p style="font-size:2.4em;margin:6px 0">🏅</p><p><b>Hai conquistato la medaglia!</b></p>`:""}
   <p>${msg}</p>${r.improved?'<p class="chip">Nuovo record di stelle</p>':""}
   <div class="row" style="margin-top:14px"><button class="btn ghost grow" data-go="${tp?`t/${tp.id}/esercizi`:"home"}">${tp?"Torna all’argomento":"Torna alla Home"}</button><button class="btn grow" data-act="retry">Riprova</button></div></div>
   ${r.wrong.length?`<h2>Da ripassare</h2><div class="stack">${r.wrong.map(q=>`<div class="card wrong"><p style="margin-top:0">${q.q}</p><p class="small"><b>Risposta: ${q.type==="mc"?q.options[q.answer]:fmt(q.answer)+(q.unit?" "+q.unit:"")}</b></p><p class="small muted" style="margin-bottom:0">${q.explain}</p></div>`).join("")}</div>`:""}`}

// ---------- FORMULARIO ----------
function vFormule(){const list=showAllFormulas?TOPICS:selectedTopics();
  return `<h1>Formulario</h1><p class="muted">Le regole da ricordare, tutte in un posto.</p>
  <div class="stack">${list.map(tp=>`<div class="card" style="border-left:6px solid ${tp.color}"><h3>${tp.short}</h3>${tp.formulas.map(f=>`<div class="formula"><span>${f[0]}</span><b>${f[1]}</b></div>`).join("")}</div>`).join("")}</div>
  <button class="btn ghost wide" style="margin-top:16px" data-act="allf">${showAllFormulas?"Mostra solo i miei argomenti":"Mostra anche gli altri argomenti"}</button>`}

// ---------- PROGRESSI ----------
function vProgress(){const sel=selectedTopics();const pct=S.stats.done?Math.round(S.stats.ok/S.stats.done*100):0;
  const medals=sel.filter(t=>T(t.id).medal).length;
  return `<h1>Progressi</h1>
  <div class="card stack"><h3 style="margin:0">Programma completato</h3>${ruler(overallPct(),"var(--yellow)",true)}
   <div class="row small muted"><span class="grow">${S.stats.done} risposte date, ${pct}% giuste</span><span>${medals} 🏅 su ${sel.length}</span></div></div>
  <h2>Per argomento</h2>
  <div class="stack">${sel.map(tp=>{const t=T(tp.id);return `<div class="card" style="--tc:${tp.color}"><div class="row" style="margin-bottom:10px"><div class="tnum" style="width:34px;height:34px">${tp.id}</div><b class="grow">${tp.short}</b>${t.medal?"🏅":""}</div>
   ${ruler(topicPct(tp.id),tp.color)}
   <div class="row small" style="margin-top:10px;flex-wrap:wrap;gap:14px"><span>Lezioni ${Math.min(t.read.length,tp.lessons.length)}/${tp.lessons.length}</span>${[1,2,3].map(l=>`<span>Liv. ${l} ${starsHtml(starsOf(t.best[l]||0))}</span>`).join("")}</div></div>`}).join("")}</div>`}

// ---------- IMPOSTAZIONI ----------
function vSettings(){const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button class="${S[k]===o[0]?"act":""}" data-act="set:${k}:${o[0]}">${o[1]}</button>`).join("")}</div>`;
  let sync;
  if(!fbConfigured())sync=`<p class="small muted">La sincronizzazione non è ancora attiva: mancano i dati di Firebase nel file. Per ora i progressi restano su questo dispositivo.</p>`;
  else if(user)sync=`<p class="small">Accesso fatto come <b>${esc(user.email||"")}</b>. I progressi sono uguali su tutti i dispositivi.</p><button class="btn ghost wide" data-act="logout">Esci dall’account</button>`;
  else sync=`<p class="small muted">Accedi con il tuo account Google per ritrovare i progressi su PC e cellulare.</p><button class="btn wide" data-act="login">Accedi con Google</button>`;
  return `<h1>Impostazioni</h1><div class="stack">
  <div class="card stack"><h3 style="margin:0">Il tuo nome</h3><input class="field" id="name" value="${esc(S.name)}" maxlength="30" placeholder="Come ti chiami?"></div>
  <div class="card stack"><h3 style="margin:0">Argomenti da studiare</h3><p class="small muted" style="margin:0">${selectedTopics().map(t=>t.short).join(", ")||"Nessuno"}</p><button class="btn ghost wide" data-act="choose">Scegli gli argomenti</button></div>
  <div class="card stack"><h3 style="margin:0">Sincronizzazione</h3>${sync}</div>
  <div class="card stack"><h3 style="margin:0">Aspetto</h3><div class="small muted">Tema</div>${seg("theme",[["auto","Automatico"],["light","Chiaro"],["dark","Scuro"]])}<div class="small muted">Testo</div>${seg("size",[["normal","Normale"],["big","Grande"]])}</div>
  <div class="card stack"><h3 style="margin:0">Ricomincia da zero</h3><p class="small muted" style="margin:0">Cancella lezioni lette, stelle e medaglie.</p><button class="btn ghost wide" style="color:var(--red)" data-act="reset">Azzera i progressi</button></div>
  <p class="small muted" style="text-align:center">FisicaFacile versione ${APP_VERSION}</p></div>`}

// ---------- eventi ----------
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const a=e.target.closest("[data-act]");if(!a)return;const [cmd,x,y]=a.dataset.act.split(":");
  switch(cmd){
    case "start":startQuiz(x,y);break;
    case "choose":chooseSheet();break;
    case "lok":{const id=+x,t=T(id),tp=topicById(id),i=lessonIdx[id];if(!t.read.includes(i)){t.read.push(i);save()}
      if(i<tp.lessons.length-1){lessonIdx[id]=i+1;render();window.scrollTo(0,0)}else{go(`t/${id}/trucchi`)}break}
    case "lprev":lessonIdx[+x]=Math.max(0,lessonIdx[+x]-1);render();window.scrollTo(0,0);break;
    case "tri":triState[x]=triState[x]===y?null:y;render();break;
    case "pick":if(!quiz.answered){quiz.last=+x;answer(+x===quiz.qs[quiz.i].answer)}break;
    case "key":{const inp=$("#ans");if(!inp)break;if(x==="-")inp.value=inp.value.startsWith("-")?inp.value.slice(1):"-"+inp.value;else inp.value+=",";inp.focus();break}
    case "check":checkNum();break;
    case "next":if(quiz.i<quiz.qs.length-1){quiz.i++;quiz.answered=false;quiz.last=null;quiz.typed="";render();window.scrollTo(0,0)}else finishQuiz();break;
    case "quit":if(confirm("Vuoi uscire? Le risposte di questo giro non verranno salvate.")){const t=quiz.topic;quiz=null;go(t==="mix"?"home":`t/${t}/esercizi`)}break;
    case "retry":{const r=lastResult;startQuiz(r.topic,r.level);break}
    case "allf":showAllFormulas=!showAllFormulas;render();break;
    case "set":S[x]=y;save();render();break;
    case "login":login();break;
    case "logout":if(fb)fb.auth.signOut();break;
    case "reset":if(confirm("Sicuro? Lezioni, stelle e medaglie verranno cancellate.")){const keep={name:S.name,theme:S.theme,size:S.size,selected:S.selected,selAt:S.selAt};S=Object.assign(blankState(),keep);S.resetAt=Date.now();save();toast("Progressi azzerati");render()}break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ans"){e.preventDefault();checkNum()}});
document.addEventListener("change",e=>{if(e.target.id==="name"){S.name=e.target.value.trim();save();toast("Nome salvato")}});
function checkNum(){const inp=$("#ans");if(!inp||quiz.answered)return;const q=quiz.qs[quiz.i];const c=parseUser(inp.value);
  if(!c.length){toast("Scrivi un numero");inp.focus();return}
  quiz.typed=inp.value;const a=q.answer;const ok=c.some(v=>Math.abs(v-a)<=Math.max(q.tol*Math.abs(a),1e-9));answer(ok)}
let toastT;function toast(m){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2200)}

// ---------- sincronizzazione Firebase ----------
let fb=null,user=null,syncTimer=null,syncErr=false;
function fbConfigured(){return FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith("INSERISCI")}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function initFirebase(){
  if(!fbConfigured())return;
  try{const v="10.12.2",b=`https://www.gstatic.com/firebasejs/${v}/`;
    await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);fb={auth:firebase.auth(),db:firebase.firestore()};
    fb.auth.getRedirectResult().catch(()=>{});
    fb.auth.onAuthStateChanged(async u=>{user=u;if(u)await pull();render()});
  }catch(e){syncErr=true;renderSync()}
}
function login(){if(!fb){toast("Sincronizzazione non disponibile, controlla la connessione");return}
  const p=new firebase.auth.GoogleAuthProvider();
  fb.auth.signInWithPopup(p).catch(err=>{if(/popup/i.test(err.code||""))fb.auth.signInWithRedirect(p);else toast("Accesso non riuscito: riprova")})}
const docRef=()=>fb.db.collection("studenti").doc(user.uid);
function merge(a,b){
  if(!b||!b.topics)return a;const r=JSON.parse(JSON.stringify(a));
  if((b.resetAt||0)>(a.resetAt||0)){return Object.assign(blankState(),b,{theme:a.theme,size:a.size})}
  if((a.resetAt||0)>(b.resetAt||0))return r;
  for(const id in b.topics){const x=r.topics[id]||blankTopic(),y=b.topics[id];x.best=x.best||{1:0,2:0,3:0};
    x.read=[...new Set([...(x.read||[]),...(y.read||[])])];
    for(const l of [1,2,3])x.best[l]=Math.max(x.best[l]||0,(y.best||{})[l]||0);
    x.medal=!!(x.medal||y.medal);x.bestTest=Math.max(x.bestTest||0,y.bestTest||0);r.topics[id]=x}
  if((b.selAt||0)>(a.selAt||0)){r.selected=b.selected;r.selAt=b.selAt}
  if((b.updatedAt||0)>(a.updatedAt||0)&&b.name)r.name=b.name;
  r.stats={done:Math.max(a.stats.done,(b.stats||{}).done||0),ok:Math.max(a.stats.ok,(b.stats||{}).ok||0)};
  r.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);return r}
async function pull(){if(!user)return;try{const d=await docRef().get();if(d.exists){S=merge(S,d.data().stato);persist()}await push();syncErr=false}catch(e){syncErr=true}renderSync()}
async function push(){if(!user)return;const {theme,size,...rest}=S;
  try{await docRef().set({stato:rest,aggiornato:firebase.firestore.FieldValue.serverTimestamp()});syncErr=false}catch(e){syncErr=true}renderSync()}
function scheduleSync(){if(!user)return;clearTimeout(syncTimer);syncTimer=setTimeout(push,1200)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&user&&!quiz)pull().then(render)});
function renderSync(){const b=$("#sync");if(!b)return;let dot="off",txt="Solo qui";
  if(user){dot=syncErr?"":"on";txt=syncErr?"Non sincronizzato":"Sincronizzato"}else if(fbConfigured())txt="Accedi";
  b.innerHTML=`<span class="dot ${dot}"></span>${txt}`}

// ---------- avvio ----------
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();initFirebase();

</script>
