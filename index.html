const ord=(a,k)=>a.slice().sort((x,y)=>(x[k]<y[k]?1:-1));
function gDati(){if(!G.cur)return gVuoto("Dati",true);const D=G.dati;
  const sez=(id,tit,n,desc,body)=>`<div class="card stack"><div class="row"><div class="grow"><p class="b">${tit} <span class="muted small">(${n})</span></p>${desc?`<p class="xs muted">${desc}</p>`:""}</div>${n?`<button class="btn danger sm" data-act="gres:${id}">Azzera</button>`:""}</div>${body||""}</div>`;
  const rigaBtn=(ed,de)=>`<span class="gbtns">${ed?`<button class="icon-btn" style="width:38px;height:38px" data-act="${ed}" aria-label="Modifica">${ic("edit",17)}</button>`:""}<button class="icon-btn" style="width:38px;height:38px;color:var(--bad)" data-act="${de}" aria-label="Elimina">${ic("trash",17)}</button></span>`;
  const comp=ord(D.compiti,"scadenza").slice(0,60),voti=ord(D.voti,"data").slice(0,60);
  const errs=Object.entries(D.errori).filter(([k,e])=>e.n>0).sort((a,b)=>b[1].n-a[1].n);window._gerr=errs.map(e=>e[0]);
  const ore=Object.values(D.orario.giorni||{}).reduce((a,g)=>a+(g||[]).filter(Boolean).length,0);
  const minTot=Math.round(Object.values(D.tempo).reduce((a,b)=>a+b,0));
  const fisN=Object.keys(D.fis.topics||{}).length;const usati=G.stato.giorno===today()?G.stato.n||0:0;
  return `${gHead("Dati",true)}
  <p class="small muted">${G.cur.prova?"Dati dell’account di prova.":`Dati di ${esc(G.cur.nome)}.`} Le modifiche arrivano anche sull’app studente al prossimo aggiornamento, e quello che cancelli non ricompare.</p>
  ${sez("compiti","Compiti e verifiche",D.compiti.length,"",comp.length?`<div class="list" style="margin:0 -16px">${comp.map(c=>`<div class="row"><div class="grow"><p class="xs b" style="color:${mcol(c.materia)}">${esc(c.materia)} · ${esc(c.tipo)} · ${esc(dataBreve(c.scadenza))}${c.fatto?" · fatto":""}</p><p class="small b">${esc(c.testo)}</p></div>${rigaBtn("gcomp:"+c.id,"gdelc:"+c.id)}</div>`).join("")}</div>`:"")}
  ${sez("voti","Voti",D.voti.length,"",voti.length?`<div class="list" style="margin:0 -16px">${voti.map(v=>`<div class="row"><div class="grow"><p class="small b">${esc(v.materia)} · ${fmtVoto(v.voto)}</p><p class="xs muted">${esc(dataBreve(v.data))} · ${esc(v.tipo)}${v.nota?" · "+esc(v.nota):""}</p></div>${rigaBtn("gvoto:"+v.id,"gdelv:"+v.id)}</div>`).join("")}</div>`:"")}
  ${sez("errori","Quaderno degli errori",errs.length,"",errs.length?`<div class="list" style="margin:0 -16px">${errs.slice(0,60).map(([k,e],i)=>`<div class="row"><div class="grow"><p class="small b">${esc(e.materia)} · ${esc(e.argomento||"")}</p><p class="xs muted">${esc(e.errore)} · ${e.n} volt${e.n>1?"e":"a"}</p></div>${rigaBtn("","gdele:"+i)}</div>`).join("")}</div>`:"")}
  ${sez("orario","Orario delle lezioni",ore,"Ore di lezione inserite")}
  ${sez("glossario","Glossario e schede di ripasso",D.glossario.length+D.schede.length,`${D.glossario.length} parole · ${D.schede.length} schede`)}
  ${sez("tempo","Tempo di studio",minTot,"Minuti totali registrati")}
  ${sez("fis","Progressi di fisica",fisN,"Lezioni lette, livelli e argomenti completati")}
  ${sez("piani","Piani di studio",Object.keys(D.piani).length,"")}
  ${sez("log","Conversazioni con il tutor",G.log.length,"Cancella il registro completo e le copie nell’app")}
  ${sez("contatori","Messaggi usati oggi",usati,"Riporta a zero il conteggio del tetto giornaliero")}
  <div class="card stack warn"><p class="b">Azzera tutto</p><p class="small muted">Cancella compiti, voti, orario, errori, schede, tempo, progressi e conversazioni${G.cur.prova?" dell’account di prova":` di ${esc(G.cur.nome)}`}. Restano il nome e le tue impostazioni.</p><button class="btn danger" data-act="gres:tutto">${ic("trash",18)} Azzera tutto</button></div>`}
const NOMI_RES={compiti:"tutti i compiti",voti:"tutti i voti",errori:"il quaderno degli errori",orario:"l’orario",glossario:"glossario e schede",tempo:"il tempo di studio",fis:"i progressi di fisica",piani:"i piani di studio",log:"tutte le conversazioni",contatori:"il conteggio dei messaggi di oggi",tutto:"TUTTI i dati"};
async function gReset(k){const chi=G.cur.prova?"dell’account di prova":"di "+G.cur.nome;
  if(!confirm(`Cancellare ${NOMI_RES[k]} ${chi}? Non si può annullare.`))return;
  if(k==="tutto"&&!confirm("Sei proprio sicuro? Verranno cancellati tutti i dati."))return;
  toast("Cancello…",8000);const D=G.dati,t=now(),B=blank();
  const doKey=key=>{if(["compiti","voti","glossario","schede"].includes(key))for(const x of D[key])D.del[x.id]=t;
    if(key==="fis")D.fis=Object.assign(JSON.parse(JSON.stringify(B.fis)),{selected:D.fis.selected});else D[key]=JSON.parse(JSON.stringify(B[key]));
    if(key==="orario"){D.orario.mod=t;D.orario.ore=G.dati.orario.ore||B.orario.ore}D.resets[key]=t};
  try{
    if(k==="log"){await G.svuota("log");await G.svuota("chat")}
    else if(k==="contatori")await G.ref().collection("sistema").doc("stato").set({giorno:"",n:0},{merge:true});
    else if(k==="tutto"){for(const key of RESETTABILI)doKey(key);await G.salvaDati();await G.svuota("log");await G.svuota("chat");await G.svuota("foto");await G.ref().collection("sistema").doc("stato").set({giorno:"",n:0},{merge:true})}
    else{doKey(k);if(k==="glossario")doKey("schede");await G.salvaDati()}
    await G.carica();toast("Fatto")}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000)}
  render()}
async function gDelItem(lista,id){if(!confirm("Eliminare questo elemento?"))return;const D=G.dati;D[lista]=D[lista].filter(x=>x.id!==id);D.del[id]=now();if(lista==="compiti")delete D.piani[id];
  try{await G.salvaDati();toast("Eliminato")}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000)}render()}
async function gDelErr(i){const k=window._gerr[i];if(!k||!confirm("Eliminare questo errore dal quaderno?"))return;G.dati.errori[k].n=0;G.dati.errori[k].ultimo=now();
  try{await G.salvaDati();toast("Eliminato")}catch(e){toast("Non riuscito",4000)}render()}
function gEditCompito(id){const c=Object.assign({},G.dati.compiti.find(x=>x.id===id));if(!c.id)return;
  sheet(`<h2>Modifica compito</h2><div><label class="flabel" for="gcm">Materia</label><select class="field" id="gcm">${selMaterie(c.materia)}</select></div>
   <div><label class="flabel" for="gct">Testo</label><textarea class="field" id="gct">${esc(c.testo)}</textarea></div>
   <div class="grid2"><div><label class="flabel" for="gcs">Scadenza</label><input class="field" type="date" id="gcs" value="${c.scadenza}"></div><div><label class="flabel" for="gcf">Stato</label><select class="field" id="gcf"><option value="0" ${c.fatto?"":"selected"}>Da fare</option><option value="1" ${c.fatto?"selected":""}>Fatto</option></select></div></div>
   <div class="row"><button class="btn ghost grow" data-s="x">Annulla</button><button class="btn grow" data-s="ok">Salva</button></div>`,async(k,bg)=>{if(k==="x"){bg.remove();return}
   c.materia=bg.querySelector("#gcm").value;c.testo=bg.querySelector("#gct").value.trim()||c.testo;c.scadenza=bg.querySelector("#gcs").value||c.scadenza;const f=bg.querySelector("#gcf").value==="1";if(f!==!!c.fatto){c.fatto=f;c.fattoIl=f?now():null}c.mod=now();
   G.dati.compiti=G.dati.compiti.map(x=>x.id===id?c:x);bg.remove();try{await G.salvaDati();toast("Salvato")}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000)}render()})}
function gEditVoto(id){const v=Object.assign({},G.dati.voti.find(x=>x.id===id));if(!v.id)return;const vv=[];for(let x=2;x<=10;x+=.25)vv.push(x);
  sheet(`<h2>Modifica voto</h2><div><label class="flabel" for="gvm">Materia</label><select class="field" id="gvm">${selMaterie(v.materia)}</select></div>
   <div class="grid2"><div><label class="flabel" for="gvv">Voto</label><select class="field" id="gvv">${vv.map(x=>`<option value="${x}" ${+v.voto===x?"selected":""}>${fmtVoto(x)}</option>`).join("")}</select></div><div><label class="flabel" for="gvd">Data</label><input class="field" type="date" id="gvd" value="${v.data}"></div></div>
   <div><label class="flabel" for="gvt">Tipo</label><select class="field" id="gvt">${["scritto","orale","pratico"].map(t=>`<option ${v.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div>
   <div class="row"><button class="btn ghost grow" data-s="x">Annulla</button><button class="btn grow" data-s="ok">Salva</button></div>`,async(k,bg)=>{if(k==="x"){bg.remove();return}
   v.materia=bg.querySelector("#gvm").value;v.voto=+bg.querySelector("#gvv").value;v.data=bg.querySelector("#gvd").value||v.data;v.tipo=bg.querySelector("#gvt").value;v.mod=now();
   G.dati.voti=G.dati.voti.map(x=>x.id===id?v:x);bg.remove();try{await G.salvaDati();toast("Salvato")}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000)}render()})}

   <form data-form="gass" class="stack"><input class="field" id="ga" placeholder="Es. ripassa il capitolo 3 di storia" required><div class="grid2"><select class="field" id="gam">${selMaterie("","<option value=''>Materia</option>")}</select><input class="field" id="gae" type="date" aria-label="Entro il"></div><button class="btn ghost" type="submit">${ic("plus",16)} Assegna</button></form></div>`:""}
  ${provaCard()}
  <div class="card stack"><p class="b">Notifiche su questo telefono</p><p class="small muted">Ricevi un avviso quando c’è una segnalazione.</p><button class="btn ghost wide" data-act="notif">Attiva le notifiche</button></div>
  <div class="card stack"><p class="b">Blocco dell’area genitore</p><p class="small muted">${cfg.cred||cfg.pin?"Attivo":"Non attivo"}: chiede impronta o PIN quando apri l’area dopo 10 minuti.</p>
   <div class="grid2"><button class="btn ghost" data-act="gsetimpronta">${cfg.cred?"Rifai impronta":"Usa l’impronta"}</button><button class="btn ghost" data-act="gsetpin">${cfg.pin?"Cambia PIN":"Imposta un PIN"}</button></div>
   ${cfg.cred||cfg.pin?`<button class="link" data-act="gnolock">Togli il blocco</button>`:""}</div>
  <div class="card stack"><p class="small">Accesso come <b>${esc(user.email||"")}</b></p><button class="btn ghost wide" data-act="logout">Esci dall’account</button></div>
  <p class="xs muted" style="text-align:center">Studio Smart ${APP_VERSION} · area genitore</p>`}

// ---------- rendering ed eventi ----------
function renderGenitore(){const r=route();
  if(!G.caricato){$("#app").innerHTML=`<div class="lock"><p class="muted">Carico i dati…</p></div>`;return}
  const cfg=lockCfg();if(cfg&&(cfg.cred||cfg.pin)&&!sbloccato()){$("#app").innerHTML=vLock();if(cfg.cred&&!window._autoFp){window._autoFp=1;setTimeout(()=>gAct("gimpronta"),300)}return}
  if(!location.hash.startsWith("#g")){location.hash="g";return}
  const name=r.a?"g/"+r.a:"g";
  const html=name==="g/chat"?gChat(false):name==="g/segn"?gChat(true):name==="g/dati"?gDati():name==="g/imp"?gImp():gPanoramica();
  $("#app").innerHTML=`<div class="app">${gnav(name)}<main id="main" class="fade">${html}</main></div>`}
async function gAct(cmd,x){if(ruolo!=="genitore")return false;switch(cmd){
  case "gimpronta":if(await usaImpronta()){sessionStorage.setItem("ss-unl",now());render()}else toast("Impronta non riconosciuta");return true;
  case "gback":if(history.length>1&&location.hash!=="#g")history.back();else go("g");return true;
  case "greload":toast("Aggiorno…");await G.init();render();return true;
  case "gprova":entraProva();return true;
  case "gstud":sheet(`<h2>Di chi vuoi vedere i dati?</h2>${G.stud.map(s=>`<button class="btn ${s.uid===G.cur.uid?"":"ghost"} wide" data-s="${s.uid}">${esc(s.nome)}${s.prova?"":" · "+esc(s.email)}</button>`).join("")}`,async(k,bg)=>{G.cur=G.stud.find(s=>s.uid===k);localStorage.setItem("ss-g-stud",k);bg.remove();await G.carica();render()});return true;
  case "gdel":G.imp.assegnati=(G.imp.assegnati||[]).filter(a=>a.id!==x);await G.salvaImp();render();return true;
  case "gres":gReset(x);return true;
  case "gdelc":gDelItem("compiti",x);return true;
  case "gdelv":gDelItem("voti",x);return true;
  case "gdele":gDelErr(+x);return true;
  case "gcomp":gEditCompito(x);return true;
  case "gvoto":gEditVoto(x);return true;
  case "gsetimpronta":await creaImpronta();sessionStorage.setItem("ss-unl",now());render();return true;
  case "gsetpin":{const p=prompt("Scegli un PIN di 4-8 cifre");if(!p)return true;if(!/^\d{4,8}$/.test(p)){toast("Il PIN deve avere da 4 a 8 cifre");return true}
    const cfg=lockCfg()||{};cfg.pin=await sha256("ss:"+p);localStorage.setItem(LOCK,JSON.stringify(cfg));sessionStorage.setItem("ss-unl",now());toast("PIN impostato");render();return true}
  case "gnolock":if(confirm("Togliere il blocco dell’area genitore su questo telefono?")){localStorage.removeItem(LOCK);render()}return true;
 }return false}
async function gForm(f){
  if(f==="pin"){const cfg=lockCfg();const v=$("#pinin").value;if(cfg&&cfg.pin&&await sha256("ss:"+v)===cfg.pin){sessionStorage.setItem("ss-unl",now());render()}else{toast("PIN errato");$("#pinin").value=""}return true}
  if(f==="gimp"){const I=G.imp;I.tetto=Math.max(5,+$("#gt").value||60);I.oraInizio=$("#gi").value;I.oraFine=$("#gf").value;I.obiettivoMin=Math.max(5,+$("#go").value||20);I.premio=$("#gp").value.trim();I.premioSessioni=Math.min(7,Math.max(1,+$("#gps").value||5));
    try{await G.salvaImp();toast("Impostazioni salvate")}catch(e){toast("Non salvato: controlla le regole di Firebase")}return true}
  if(f==="gass"){const t=$("#ga").value.trim();if(!t)return true;G.imp.assegnati=(G.imp.assegnati||[]).concat({id:uid8(),testo:t,materia:$("#gam").value,entro:$("#gae").value,creato:now()});
    try{await G.salvaImp();toast("Attività assegnata");render()}catch(e){toast("Non salvato")}return true}
  return false}

// ===== STUDIO SMART – avvio, navigazione, eventi =====
function render(){applyTheme();
  if(fbConfigured()&&!fbReady){$("#app").innerHTML=`<div class="lock"><div class="logo" style="width:56px;height:56px;border-radius:16px">${LOGO}</div><p class="muted">Studio Smart</p></div>`;return}
  if(ruolo==="genitore"){renderGenitore();return}
  const r=route();let html="",act=r.name;
  if(r.name.startsWith("g"))location.hash="home";
  switch(r.name){
    case "tutor":html=vTutor();break;
    case "agenda":html=vAgenda(r.a);break;
    case "studio":html=vStudio();break;
    case "profilo":html=vProfilo();break;
    case "piano":html=vPiano(r.a);act="home";break;
    case "errori":html=vErrori();act="studio";break;
    case "qz":html=vQz();act="studio";break;
    case "schede":html=vSchede();act="studio";break;
    case "glossario":html=vGlossario();act="studio";break;
    case "metodo":html=vMetodo();act="studio";break;
    case "fisica":html=vFisica();act="studio";break;
    case "f":html=vTopic(+r.a,r.b||"impara");act="studio";break;
    case "quiz":html=vQuiz();act="studio";break;
    case "risultato":html=vRisultato();act="studio";break;
    case "storico":html="";act="profilo";break;
    default:html=vHome();act="home"}
  const full=r.name==="tutor"||r.name==="quiz"||r.name==="qz";
  $("#app").innerHTML=`${prova?`<div class="prova-bar"><span class="grow">Modalità prova: stai usando l’app come la vede Davide (account di prova)</span><button data-act="esciprova">Torna all’area genitore</button></div>`:""}<div class="app">${full&&matchMedia("(max-width:899px)").matches?"":navHtml(act)}<main id="main" class="fade" ${r.name==="tutor"?'style="padding-bottom:0"':""}>${html}</main></div>`;
  if(r.name==="storico")vStorico();
  if(r.name==="tutor")scrollChat();
  const a=$("#ans");if(a&&quiz&&!quiz.answered)a.focus({preventScroll:true})}

document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest(".sheet-bg")){go(g.dataset.go);return}
  const a=e.target.closest("[data-act]");if(!a||e.target.closest(".sheet-bg"))return;
  const [cmd,x,y]=splitAct(a.dataset.act);
  if(tutorAct(cmd,x,y))return;
  if(await gAct(cmd,x))return;
  switch(cmd){
    case "login":login();break;
    case "esciprova":esciProva();break;
    case "logout":logout();break;
    case "notif":attivaNotifiche();break;
    case "askfoto":scegliFoto(b=>{pendingAsk={testo:($("[data-form=ask] input")||{}).value||"",foto:[b],nuova:true,invia:false};go("tutor")});break;
    case "askmic":{const inp=$("[data-form=ask] input");detta("it-IT",t=>inp.value=t,fin=>{if(fin){pendingAsk={testo:fin,nuova:true};go("tutor")}});toast("Ti ascolto…");break}
    case "assok":S.assegnatiFatti.push(x);save();render();toast("Segnato come fatto");break;
    case "newc":editorCompito(null);break;
    case "newcmic":editorCompito(null,{mic:true});break;
    case "newcfoto":scegliFoto(async b=>{const small=await rimpicciolisci(b);editorCompito(null,{foto:small,testo:""})});break;
    case "cedit":editorCompito(S.compiti.find(c=>c.id===x));break;
    case "cdone":{const c=S.compiti.find(c=>c.id===x);if(c){c.fatto=!c.fatto;c.fattoIl=c.fatto?now():null;c.mod=now();save();render();if(c.fatto)toast("Fatto. Ben fatto!")}break}
    case "chelp":aiutoCompito(x);break;
    case "piano":creaPiano(x);break;
    case "pdone":{const p=S.piani[x];p.giorni[+y].fatto=!p.giorni[+y].fatto;p.mod=now();save();render();break}
    case "pfai":{const c=S.compiti.find(c=>c.id===x),g=S.piani[x].giorni[+y];pendingAsk={testo:`Sto preparando la ${c.tipo} di ${c.materia} (${c.testo}). Oggi devo fare: ${g.attivita}. Aiutami.`,materia:c.materia,modo:"lezione",nuova:true};go("tutor");break}
    case "interr":{const c=S.compiti.find(c=>c.id===x);pendingAsk={testo:`Interrogami su: ${c.testo}`,materia:c.materia,modo:"interrogazione",nuova:true};go("tutor");break}
    case "agday":agDay=x;render();break;
    case "agw":agWeek+=+x;agDay=null;render();break;
    case "orfoto":orarioDaFoto();break;
    case "ored":editorOrario();break;
    case "newv":editorVoto(null);break;
    case "vedit":editorVoto(S.voti.find(v=>v.id===x));break;
    case "vmat":schedaMateria(x);break;
    case "vanalisi":{const v=S.voti.find(v=>v.id===x);scegliFoto(b=>{pendingAsk={testo:`Questa è la mia verifica di ${v.materia} del ${dataBreve(v.data)}: ho preso ${fmtVoto(v.voto)}. Mi aiuti a capire gli errori?`,foto:[b],materia:v.materia,modo:"verifica",nuova:true,invia:false};go("tutor")});break}
    case "modo":pendingAsk={testo:"",modo:x,nuova:true,invia:false};go("tutor");break;
    case "rip":ripasso(x);break;
    case "qzgo":gq.i=0;gq.ans=null;render();break;
    case "qzp":if(gq.ans==null){gq.ans=+x;const q=gq.domande[gq.i];if(+x===+q.giusta)gq.score++;render()}break;
    case "qznext":gq.i++;gq.ans=null;if(gq.i>=gq.domande.length&&gq.errK&&S.errori[gq.errK]&&gq.score/gq.domande.length>=.8){S.errori[gq.errK].n=Math.max(0,S.errori[gq.errK].n-2);save()}render();scrollTo(0,0);break;
    case "qzagain":ripasso(gq.errK);break;
    case "qzquit":if(confirm("Uscire dagli esercizi?")){gq=null;go("studio")}break;
    case "fshow":flashShow=true;render();break;
    case "fok":case "fno":{const s=schedeDaFare()[flashI];if(s){s.box=cmd==="fok"?Math.min(4,s.box+1):0;s.prossima=addDays(today(),cmd==="fok"?INT[s.box]:1);s.mod=now();save()}flashShow=false;render();break}
    case "say":{const s=schedeDaFare()[flashI];if(s)leggi(s.fronte,x==="de"?"de-DE":"en-GB");break}
    case "vocab":editorVocabolo();break;
    case "set":S[x]=y;S.prefMod=now();save();render();break;
    case "sym":S.tutorSimbolo=+x;S.prefMod=now();save();render();break;
    case "fchoose":chooseFis();break;
    case "fstart":startQuiz(x,y);break;
    case "fask":{const tp=topicById(+x);pendingAsk={testo:`Non ho capito questa parte della lezione di fisica: “${tp.lessons[+y].t}”. Me la spieghi in modo semplice?`,materia:"Fisica",modo:"lezione",nuova:true};go("tutor");break}
    case "lok":{const id=+x,t=fT(id),tp=topicById(id),i=lessonIdx[id];if(!t.read.includes(i)){t.read.push(i);save()}if(i<tp.lessons.length-1){lessonIdx[id]=i+1;render();scrollTo(0,0)}else go(`f/${id}/trucchi`);break}
    case "lprev":lessonIdx[+x]=Math.max(0,lessonIdx[+x]-1);render();break;
    case "tri":triState[x]=triState[x]===y?null:y;render();break;
    case "pick":if(!quiz.answered){quiz.last=+x;quizAnswer(+x===quiz.qs[quiz.i].answer)}break;
    case "key":{const inp=$("#ans");if(!inp)break;if(x==="-")inp.value=inp.value.startsWith("-")?inp.value.slice(1):"-"+inp.value;else inp.value+=",";inp.focus();break}
    case "check":checkNum();break;
    case "qnext":if(quiz.i<quiz.qs.length-1){quiz.i++;quiz.answered=false;quiz.last=null;quiz.typed="";render();scrollTo(0,0)}else finishQuiz();break;
    case "qquit":if(confirm("Uscire? Le risposte di questo giro non verranno salvate.")){quiz=null;go("fisica")}break;
  }});
function splitAct(s){const i=s.indexOf(":");if(i<0)return[s];const cmd=s.slice(0,i),rest=s.slice(i+1);
  if(["rip","vmat","set","tri","fstart","pdone","pfai","tsay"].includes(cmd)){if(cmd==="rip"||cmd==="vmat")return[cmd,rest];const j=rest.lastIndexOf(":");return j<0?[cmd,rest]:[cmd,rest.slice(0,j),rest.slice(j+1)]}
  const p=rest.split(":");return[cmd,p[0],p.slice(1).join(":")]}
document.addEventListener("submit",async e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(await gForm(f))return;
  if(f==="ask"){const v=e.target.q.value.trim();if(!v)return;pendingAsk={testo:v,nuova:true};go("tutor")}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ans"){e.preventDefault();checkNum()}});
document.addEventListener("change",e=>{
  if(e.target.id==="pn"){S.nome=e.target.value.trim()||"Davide";S.prefMod=now();save();toast("Nome salvato")}
  if(e.target.id==="tn"){S.tutorNome=e.target.value.trim()||"Orione";S.prefMod=now();save();toast("Nome del tutor salvato")}});
function rimpicciolisci(b64){return new Promise(ok=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6).split(",")[1])};im.onerror=()=>ok(b64);im.src="data:image/jpeg;base64,"+b64})}

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
if(window.speechSynthesis)speechSynthesis.getVoices();
render();initFirebase();

</script>
