<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --soft:#F0F2F5; --line:#E3E6EC; --line2:#EEF0F4;
  --ink:#172033; --ink2:#5B6577; --pri:#3451D1; --pri-ink:#26399B; --pri-soft:#E3E8FB;
  --dark:#172033; --dark2:#26314A; --on-dark2:#C2C9D8;
  --warm:#9A4316; --warm-soft:#FCEFE6; --warm-line:#F1C8AE;
  --ok:#0F766E; --ok-soft:#E3F4F1; --bad:#B42318; --bad-soft:#FDECEA;
  --shadow:0 1px 2px rgba(23,32,51,.04);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:16px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1522; --card:#182033; --soft:#1F2940; --line:#2A3550; --line2:#232D45;
  --ink:#E8ECF4; --ink2:#A3AEC4; --pri:#7E98F2; --pri-ink:#B4C4FA; --pri-soft:#243156;
  --dark:#232E4A; --dark2:#2E3A5C; --on-dark2:#C2C9D8;
  --warm:#F2A877; --warm-soft:#3A2618; --warm-line:#5A3A24;
  --ok:#4CC9AE; --ok-soft:#163A35; --bad:#F59A8E; --bad-soft:#3E1F1C; color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --card:#182033; --soft:#1F2940; --line:#2A3550; --line2:#232D45;
  --ink:#E8ECF4; --ink2:#A3AEC4; --pri:#7E98F2; --pri-ink:#B4C4FA; --pri-soft:#243156;
  --dark:#232E4A; --dark2:#2E3A5C; --on-dark2:#C2C9D8;
  --warm:#F2A877; --warm-soft:#3A2618; --warm-line:#5A3A24;
  --ok:#4CC9AE; --ok-soft:#163A35; --bad:#F59A8E; --bad-soft:#3E1F1C; color-scheme:dark;
}}
:root[data-size="big"]{--fs:18px}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:8px}
sup{font-size:.7em;line-height:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1{font-size:1.65em;line-height:1.15;margin:0;letter-spacing:-.025em;font-weight:800}
h2{font-size:1.08em;margin:0;font-weight:800;letter-spacing:-.01em}
h3{font-size:1em;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:.84em} .xs{font-size:.76em}
.b{font-weight:700} .xb{font-weight:800}

/* struttura */
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0;max-width:760px;margin:0 auto;width:100%;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 110px;display:flex;flex-direction:column;gap:16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7em;font-weight:600;color:var(--ink2);padding:4px 0}
.nav button svg{width:23px;height:23px}
.nav button.act{color:var(--pri);font-weight:800}
.nav.g{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (min-width:900px){
  .nav{left:50%;right:auto;transform:translateX(-50%);width:min(760px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
  .nav button{font-size:.78em}
  main{padding-top:28px}
}
.brandside{display:none;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800}

/* elementi */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.06em;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--pri);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri-ink);font-weight:800;display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flush{padding:0}
.card.warn{border-color:var(--warm-line)}
.dark{background:var(--dark);color:#fff;border-radius:20px;padding:18px}
.dark .muted{color:var(--on-dark2)}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec a,.link{color:var(--pri);font-weight:700;font-size:.84em;text-decoration:none;background:none;border:0;padding:4px 0}
.label{font-size:.78em;font-weight:800;color:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:0 18px;min-height:46px;font-weight:700;font-size:.92em;background:var(--pri);color:#fff}
:root[data-theme="dark"] .btn:not(.ghost):not(.soft):not(.danger){color:#0F1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.soft):not(.danger){color:#0F1522}}
.btn.soft{background:var(--pri-soft);color:var(--pri-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--bad);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 13px;font-size:.82em;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:46px;height:46px;border-radius:14px;border:0;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn.pri{background:var(--pri);color:#fff}
.icon-btn svg{width:22px;height:22px}
.icon-btn.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76em;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--ink2);border:0;white-space:nowrap}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.pri{background:var(--pri-soft);color:var(--pri-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
button.chip{min-height:34px;padding:0 13px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.big{height:10px}
.list>*{padding:13px 16px;border-bottom:1px solid var(--line2)}
.list>*:last-child{border-bottom:0}
.tag{width:5px;align-self:stretch;border-radius:3px;flex:none}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-size:.84em;font-weight:700;color:var(--ink2)}
.seg button.act{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);min-height:46px}
textarea.field{min-height:90px;resize:vertical}
.field:focus{outline:2px solid var(--pri);border-color:transparent}
.flabel{display:block;font-size:.8em;font-weight:700;color:var(--ink2);margin:0 0 5px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:15px;height:15px}
.empty{text-align:center;padding:22px 12px;color:var(--ink2);font-size:.9em}
.back{background:none;border:0;color:var(--pri);font-weight:700;padding:4px 0;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.day{text-align:center;padding:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);position:relative}
.day.act{background:var(--dark);border-color:var(--dark);color:#fff}
.day.act .muted{color:var(--on-dark2)}
.day b{display:block;font-size:1.02em}
.day .dots{display:flex;gap:3px;justify-content:center;height:6px;margin-top:2px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.lesson{display:flex;gap:12px}
.lesson .hour{width:48px;flex:none;padding-top:11px}
.lesson .box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;overflow:hidden;min-width:0}
.lesson .box>div:last-child{flex:1;padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gradeRow{display:flex;align-items:center;gap:12px}
.gradeRow .bar{width:90px}
.gradeRow .v{width:44px;text-align:right;font-weight:800}

/* chat */
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 40px)}
.chathead{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 6px) 0 10px;display:flex;flex-direction:column;gap:10px}
.tutor-av{width:40px;height:40px;border-radius:12px;background:var(--dark);display:grid;place-items:center;flex:none;color:#fff}
.tutor-av svg{width:22px;height:22px}
.ai-note{font-size:.76em;color:var(--ink2);background:var(--soft);border-radius:10px;padding:7px 10px}
.msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding:6px 0 12px}
.msg{max-width:86%;padding:11px 14px;font-size:.96em;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-radius:18px 18px 6px 18px}
:root[data-theme="dark"] .msg.u{color:#0F1522}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.u{color:#0F1522}}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
.msg .tts{background:none;border:0;color:var(--ink2);font-size:.78em;font-weight:700;padding:6px 0 0;display:inline-flex;gap:5px;align-items:center}
.listen{background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin:4px 0;display:flex;flex-direction:column;gap:8px;white-space:normal}
.typing{align-self:flex-start;color:var(--ink2);font-size:.88em;padding:6px 4px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink2);margin-right:4px;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.chatbar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.chatbar .row{align-items:flex-end}
.chatin{flex:1;min-width:0;border:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:46px;max-height:140px;resize:none;line-height:1.4}
.chatin:focus{outline:2px solid var(--pri);border-color:transparent}
.thumbs{display:flex;gap:8px}
.thumbs div{position:relative}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--card);font-size:13px;line-height:1}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qbar{flex:1;height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);min-height:54px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.ko{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{margin-bottom:4px}
.fb.ok h3{color:var(--ok)} .fb.ko h3{color:var(--bad)}
.flash{min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;font-size:1.1em}

/* lezioni fisica */
.lessonbody ul{padding-left:1.2em;margin:.4em 0}
.lessonbody p{margin:.45em 0}
.ex{background:var(--pri-soft);border-radius:12px;padding:10px 12px;margin:10px 0}
.hl{background:linear-gradient(transparent 58%,rgba(52,81,209,.22) 58%);padding:0 2px}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;width:100%;font-size:.9em;min-width:280px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.tbl th{background:var(--soft)}
.ladder{display:flex;flex-direction:column;gap:3px;margin:10px 0}
.ladder span{display:inline-block;padding:5px 10px;border-radius:8px;background:var(--soft);font-weight:700;min-width:58px;text-align:center}
.ladder .base{background:var(--pri);color:#fff}
.hand{font-weight:800;color:var(--pri);font-size:1.08em;margin:6px 0}
.tri{position:relative;width:230px;height:200px;margin:10px auto 4px}
.tri .shape{position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:var(--pri);opacity:.14}
.tri .bar1{position:absolute;left:22%;right:22%;top:54%;height:3px;background:var(--ink)}
.tri .mid{position:absolute;left:50%;top:64%;width:3px;height:30%;background:var(--ink);transform:translateX(-50%)}
.tri button{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:1.35em;font-weight:800;font-style:italic}
.tri button.cov{background:var(--ink);color:var(--card)}
.tri .t{left:50%;top:18%;transform:translateX(-50%)} .tri .l{left:12%;bottom:4%} .tri .r{right:12%;bottom:4%}

/* fogli */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:12px;z-index:60;font-size:.9em;max-width:90vw;text-align:center}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.pin{display:flex;gap:10px}
.pin input{width:52px;height:58px;text-align:center;font-size:1.5em;font-weight:800;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.prova-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warm-soft);color:var(--warm);border-bottom:1px solid var(--warm-line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;font-size:.84em;font-weight:700}
.prova-bar .grow{min-width:160px}
.prova-bar button{border:1px solid var(--warm-line);background:var(--card);color:var(--warm);border-radius:10px;padding:7px 12px;font-weight:800}
.gbtns{display:flex;gap:8px;flex-wrap:wrap}

.swatch{width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);color:#fff;display:grid;place-items:center;padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--ink)}
.upd-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:55;display:flex;align-items:center;gap:12px;background:var(--dark);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;font-size:.88em;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.upd-bar button{border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:800;padding:8px 14px}

.toast .undo{margin-left:10px;border:0;background:none;color:var(--pri-soft);font-weight:800;text-decoration:underline;padding:0}

.navbadge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center}
.chatwrap{min-height:calc(100vh - 110px)}
/* v2.3 – come funziona */
.howto{border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:.92em}
.howto>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--pri-ink);display:flex;align-items:center;gap:8px;min-height:44px}
.howto>summary::-webkit-details-marker{display:none}
.howto>summary::before{content:"";width:0;height:0;border-left:7px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.howto[open]>summary::before{transform:rotate(90deg)}
.howto>div{padding:0 14px 12px;color:var(--ink2);line-height:1.5}
.howto-es{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--pri-soft);color:var(--ink)}
/* v2.3 – mappe */
.mapzoom{position:relative;overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--card);-webkit-overflow-scrolling:touch}
.mapcanvas{position:relative;display:grid;grid-template-columns:1fr 210px 1fr;gap:56px;padding:22px;transform-origin:0 0;align-items:center}
.mlines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.mcenter{display:flex;justify-content:center;position:relative;z-index:1}
.mnode{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 18px;font-weight:800;font-size:1.15em;text-align:center;line-height:1.25;min-width:150px;cursor:pointer}
.mbranch{text-align:left;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.mbranch b{display:block;color:var(--c);font-size:1.02em;margin-bottom:2px}
.mbranch ul{margin:0;padding-left:17px;font-size:.9em;color:var(--ink2)}
.mbranch:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mapcanvas.narrow{display:flex;flex-direction:column;gap:10px;padding:14px 12px 14px 30px}
.mapcanvas.narrow .mcol{display:contents}
.mapcanvas.narrow .mcenter{order:0;justify-content:flex-start}
.mapcanvas.narrow .mbranch{order:var(--o)}
.mapcanvas.narrow .mnode{font-size:1.05em;padding:12px 16px}
.mapcanvas.narrow .mbranch{width:100%}
/* v2.4 – colori delle materie e rifiniture */
.sigla{--m:#5B6577;flex:none;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;font-size:.72em;font-weight:800;letter-spacing:.02em;color:var(--m);background:color-mix(in srgb,var(--m) 14%,var(--card));border:1px solid color-mix(in srgb,var(--m) 28%,transparent)}
.mrow{position:relative}
.mrow::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--m)}
.mcard{border-left:5px solid var(--m)}
.datebox{flex:none;width:48px;min-height:52px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.datebox b{font-size:1.25em}.datebox span{font-size:.7em;font-weight:700;color:var(--ink2);text-transform:uppercase}
.datebox.big{width:58px;min-height:62px}.datebox.big b{font-size:1.5em}
.datebox.oggi{background:var(--pri);color:#fff}.datebox.oggi span{color:#fff}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;color:var(--pri-ink);text-align:center;cursor:pointer}
.sec h2{display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:1em;border-radius:3px;background:var(--pri)}
.card{box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 1px rgba(16,24,40,.02)}
form.dark{background:linear-gradient(135deg,var(--dark) 55%,color-mix(in srgb,var(--pri) 38%,var(--dark)))}
.gradeRow .bar i{border-radius:6px}
.nav.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.nav.six button{font-size:.62em;letter-spacing:-.01em}
.nav.six button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* v2.5 – modalità chiare */
.gbar{position:sticky;top:0;z-index:31;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:var(--pri);color:#fff;font-size:.86em}
.gbar b{font-weight:800}.gbar-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.18)}
.gbar-av{background:none;border:0;padding:0;display:grid;cursor:pointer}
.gbar-ro{background:rgba(255,255,255,.22);border-radius:6px;padding:1px 6px;font-weight:700}
.prova-bar{background:var(--warm);color:#fff;border-bottom:0}
.prova-bar button{background:rgba(255,255,255,.95);color:var(--warm);border:0}
.app.provamode::after{content:"";position:fixed;inset:0;border:4px solid var(--warm);pointer-events:none;z-index:60}
.guardo{border-width:1.5px}
.guardo.sim{border:2px solid var(--warm);background:var(--warm-soft)}
.opzg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opzg b{display:block}.opzg span span{display:block;font-size:.82em;color:var(--ink2)}
.opzg.on{border-color:var(--pri);background:var(--pri-soft)}
.opzg.sim svg{color:var(--warm)}.opzg.sim.on{border-color:var(--warm);background:var(--warm-soft)}
.opzg[disabled]{opacity:.55;cursor:default}

<script>
// ===== CONTENUTI: 9 argomenti di fisica per la 1ª superiore =====
const TOPICS = [
{ id:1, color:"#2457D6", title:"Grandezze fisiche e Sistema Internazionale", short:"Grandezze fisiche",
  sub:"Cosa si misura, fondamentali e derivate, unità SI",
  lessons:[
   {t:"Che cos’è una grandezza fisica", h:`
    <p>Una <span class="hl">grandezza fisica</span> è una caratteristica che si può <b>misurare</b> con uno strumento e che dà lo stesso risultato per tutti.</p>
    <div class="ex"><b>Sì:</b> la lunghezza del banco, la massa dello zaino, il tempo di una corsa, la temperatura della stanza.</div>
    <div class="ex"><b>No:</b> la bellezza di un quadro, la simpatia di un amico, il coraggio. Non esiste uno strumento che li misuri per tutti allo stesso modo.</div>`},
   {t:"Misurare = confrontare", h:`
    <p><b>Misurare</b> vuol dire confrontare una grandezza con un’altra della stessa specie scelta come <span class="hl">unità di misura</span>, e contare quante volte ci sta.</p>
    <div class="ex"><b>Esempio:</b> il banco è lungo 1,2 m: il metro “ci sta” 1,2 volte.</div>
    <p>Una misura ha sempre <b>due parti</b>: il numero e l’unità. Scrivere solo “1,2” non vuol dire niente!</p>
    <div class="ex"><b>Come in ragioneria:</b> “costa 15” non basta, serve dire 15 € o 15 $.</div>`},
   {t:"Il Sistema Internazionale (SI)", h:`
    <p>Per capirsi in tutto il mondo si usa il <b>Sistema Internazionale</b>, che fissa <span class="hl">7 grandezze fondamentali</span>, ognuna con la sua unità:</p>
    <div class="tbl"><table><tr><th>Grandezza</th><th>Unità</th><th>Simbolo</th></tr>
    <tr><td>lunghezza</td><td>metro</td><td>m</td></tr><tr><td>massa</td><td>kilogrammo</td><td>kg</td></tr>
    <tr><td>tempo</td><td>secondo</td><td>s</td></tr><tr><td>temperatura</td><td>kelvin</td><td>K</td></tr>
    <tr><td>intensità di corrente</td><td>ampere</td><td>A</td></tr><tr><td>quantità di sostanza</td><td>mole</td><td>mol</td></tr>
    <tr><td>intensità luminosa</td><td>candela</td><td>cd</td></tr></table></div>
    <p class="small muted">Le più usate quest’anno: lunghezza, massa e tempo.</p>`},
   {t:"Grandezze derivate", h:`
    <p>Le <span class="hl">grandezze derivate</span> si ottengono combinando quelle fondamentali con moltiplicazioni e divisioni.</p>
    <div class="tbl"><table><tr><th>Grandezza</th><th>Come si ottiene</th><th>Unità SI</th></tr>
    <tr><td>area</td><td>lunghezza × lunghezza</td><td>m²</td></tr>
    <tr><td>volume</td><td>lunghezza × lunghezza × lunghezza</td><td>m³</td></tr>
    <tr><td>velocità</td><td>lunghezza ÷ tempo</td><td>m/s</td></tr>
    <tr><td>densità</td><td>massa ÷ volume</td><td>kg/m³</td></tr></table></div>`},
   {t:"Come si scrivono le unità", h:`
    <ul><li>Il simbolo va <b>dopo</b> il numero, con uno spazio: <b>5 kg</b>.</li>
    <li>Niente punto dopo il simbolo: <b>20 s</b>, non “20 sec.”</li>
    <li>Maiuscole e minuscole contano: <b>km</b> (non Km), <b>m</b> (non M o mt), <b>kg</b> (non Kg).</li>
    <li>Il simbolo non ha plurale: <b>3 kg</b>, non “3 kgs”.</li></ul>
    <div class="ex"><b>Attenzione:</b> M maiuscola vuol dire “mega” (un milione), m minuscola “metro” o “milli”. Cambia tutto!</div>`}
  ],
  tricks:[
   {t:"Le 7 fondamentali in una frase", hand:"Luca Mangia Tre Torte, Carla Quattro Insalate", h:`<p>Le iniziali: <b>L</b>unghezza, <b>M</b>assa, <b>T</b>empo, <b>T</b>emperatura, <b>C</b>orrente, <b>Q</b>uantità di sostanza, <b>I</b>ntensità luminosa.</p>`},
   {t:"Fondamentale o derivata?", hand:"Ha una formula? Allora è derivata!", h:`<p>Se per calcolarla devi fare un’operazione con altre grandezze (÷ o ×), è derivata. La velocità è spazio ÷ tempo → derivata.</p>`},
   {t:"Misura o opinione?", hand:"Se due persone possono litigare sul risultato, non è una grandezza fisica", h:`<p>La lunghezza del banco è uguale per tutti. Quanto è bello il banco… dipende da chi lo guarda!</p>`},
   {t:"I simboli sono “nomi propri”", hand:"kg, m, s: sempre minuscoli, senza punto, senza plurale", h:`<p>Scrivili sempre uguali, come la sigla di una provincia: TV non diventa “Tv.”</p>`}
  ],
  formulas:[["Misura","numero + unità (es. 5 kg)"],["Area","m²"],["Volume","m³"],["Velocità","m/s"],["Densità","kg/m³"]]
},
{ id:2, color:"#12945F", title:"Multipli, sottomultipli ed equivalenze", short:"Equivalenze",
  sub:"La scaletta delle unità: lunghezza, superficie, volume, massa, tempo",
  lessons:[
   {t:"Multipli e sottomultipli", h:`
    <p>Per non scrivere numeri lunghissimi si usano i <span class="hl">prefissi</span> davanti all’unità:</p>
    <div class="tbl"><table><tr><th>Prefisso</th><th>Simbolo</th><th>Vale</th></tr>
    <tr><td>kilo</td><td>k</td><td>× 1000</td></tr><tr><td>etto</td><td>h</td><td>× 100</td></tr>
    <tr><td>deca</td><td>da</td><td>× 10</td></tr><tr><td><b>unità</b></td><td></td><td>× 1</td></tr>
    <tr><td>deci</td><td>d</td><td>÷ 10</td></tr><tr><td>centi</td><td>c</td><td>÷ 100</td></tr>
    <tr><td>milli</td><td>m</td><td>÷ 1000</td></tr></table></div>
    <p class="small muted">Più grandi: mega (M) = un milione, giga (G) = un miliardo. Più piccoli: micro (µ) = un milionesimo.</p>`},
   {t:"La scaletta della lunghezza", h:`
    <div class="ladder"><div><span>km</span></div><div><span>hm</span></div><div><span>dam</span></div><div><span class="base">m</span></div><div><span>dm</span></div><div><span>cm</span></div><div><span>mm</span></div></div>
    <p>Ogni gradino vale <b>× 10</b>. <b>Scendi</b> (verso unità più piccole) → <b>moltiplichi</b>. <b>Sali</b> → <b>dividi</b>.</p>
    <div class="ex"><b>Esempio:</b> 3,5 km in m: scendi 3 gradini → × 1000 → <b>3500 m</b>.</div>
    <p>Per la massa la scaletta è uguale: kg, hg, dag, <b>g</b>, dg, cg, mg. Per la capacità: kL, hL, daL, <b>L</b>, dL, cL, mL.</p>`},
   {t:"Superficie: gradini da 100", h:`
    <p>Per le aree (m²) ogni gradino vale <b>× 100</b>, cioè 2 zeri.</p>
    <div class="ex"><b>Perché?</b> Un quadrato di 1 m di lato è lungo 10 dm per 10 dm: dentro ci stanno 10 × 10 = 100 dm².</div>
    <div class="ex"><b>Esempio:</b> 4 m² in cm²: scendi 2 gradini → × 100 × 100 = × 10 000 → <b>40 000 cm²</b>.</div>`},
   {t:"Volume: gradini da 1000", h:`
    <p>Per i volumi (m³) ogni gradino vale <b>× 1000</b>, cioè 3 zeri: m³, dm³, cm³, mm³.</p>
    <div class="ex"><b>Esempio:</b> 2 dm³ in cm³ → × 1000 → <b>2000 cm³</b>.</div>
    <p>Volume e capacità si collegano così:</p>
    <ul><li><b>1 dm³ = 1 L</b> (un cubo di 10 cm di lato contiene un litro)</li><li><b>1 cm³ = 1 mL</b></li><li><b>1 m³ = 1000 L</b></li></ul>`},
   {t:"Il tempo non è decimale", h:`
    <p>Il tempo non va di 10 in 10, ma di <b>60</b>:</p>
    <ul><li>1 h = 60 min</li><li>1 min = 60 s</li><li>1 h = 3600 s</li></ul>
    <div class="ex"><b>Esempio:</b> 1,5 h = 1,5 × 3600 = <b>5400 s</b>. Attenzione: 1,5 h è un’ora e mezza, <b>non</b> 1 h e 50 min!</div>
    <p>Velocità: per passare da <b>km/h a m/s dividi per 3,6</b>; da m/s a km/h moltiplica per 3,6.</p>
    <div class="ex"><b>Esempio:</b> 72 km/h ÷ 3,6 = <b>20 m/s</b>.</div>`}
  ],
  tricks:[
   {t:"L’ordine dei prefissi", hand:"Ken Ha Dato Un Dolce a Cinzia e Marco", h:`<p><b>k</b>ilo, <b>h</b>etto (etto), <b>da</b> (deca), <b>U</b>nità, <b>d</b>eci, <b>c</b>enti, <b>m</b>illi. Dall’alto verso il basso.</p>`},
   {t:"Su o giù?", hand:"Scendi la scala: il numero cresce", h:`<p>Unità più piccola = ce ne vogliono di più = numero più grande. 1 m = 100 cm: il centimetro è piccolo, quindi il numero è grande.</p>`},
   {t:"Quanti zeri per gradino?", hand:"L’esponente ti dice gli zeri: m → 1, m² → 2, m³ → 3", h:`<p>Lunghezza: 1 zero per gradino. Superficie (²): 2 zeri. Volume (³): 3 zeri.</p>`},
   {t:"Litri e cubi", hand:"Un litro è un cubo di 10 cm", h:`<p>Pensa a un cartone del latte: circa 1 L = 1 dm³. E 1 mL è un cubetto di 1 cm di lato, come un dado da gioco.</p>`},
   {t:"km/h e m/s", hand:"Per andare forte (km/h) moltiplica per 3,6", h:`<p>I km/h sono sempre il numero più grande. 10 m/s × 3,6 = 36 km/h.</p>`}
  ],
  formulas:[["Lunghezza, massa, capacità","1 gradino = × 10"],["Superficie","1 gradino = × 100"],["Volume","1 gradino = × 1000"],["1 dm³","= 1 L"],["1 cm³","= 1 mL"],["1 h","= 60 min = 3600 s"],["km/h → m/s","÷ 3,6"]]
},
{ id:3, color:"#7C4DDB", title:"Notazione scientifica e ordini di grandezza", short:"Notazione scientifica",
  sub:"Numeri enormi e minuscoli scritti in modo comodo",
  lessons:[
   {t:"Le potenze di 10", h:`
    <p>10<sup>n</sup> è un 1 seguito da <b>n zeri</b>: 10<sup>3</sup> = 1000, 10<sup>6</sup> = 1 000 000.</p>
    <p>Con l’esponente negativo è un numero piccolo: 10<sup>−1</sup> = 0,1; 10<sup>−3</sup> = 0,001.</p>
    <div class="ex"><b>Regola:</b> 10<sup>−n</sup> ha la cifra 1 all’<b>n-esimo</b> posto dopo la virgola.</div>
    <p>E 10<sup>0</sup> = 1.</p>`},
   {t:"Notazione scientifica", h:`
    <p>Un numero è in <span class="hl">notazione scientifica</span> quando è scritto così:</p>
    <p style="text-align:center;font-size:1.3em"><b>a · 10<sup>n</sup></b></p>
    <p>dove <b>a</b> è compreso tra 1 e 10 (1 incluso, 10 escluso) e <b>n</b> è un intero.</p>
    <div class="ex"><b>Giusto:</b> 3,5 · 10<sup>4</sup><br><b>Sbagliato:</b> 35 · 10<sup>3</sup> (35 è più grande di 10) e 0,35 · 10<sup>5</sup> (0,35 è più piccolo di 1).</div>`},
   {t:"Come si trasforma un numero", h:`
    <p>Sposta la virgola finché davanti resta <b>una sola cifra diversa da zero</b>, e conta i salti.</p>
    <div class="ex"><b>Numero grande:</b> 45 000 → 4,5 → la virgola salta 4 posti a sinistra → <b>4,5 · 10<sup>4</sup></b></div>
    <div class="ex"><b>Numero piccolo:</b> 0,0032 → 3,2 → la virgola salta 3 posti a destra → <b>3,2 · 10<sup>−3</sup></b></div>`},
   {t:"Calcolare con le potenze", h:`
    <ul><li><b>Moltiplicazione:</b> moltiplichi i numeri e <b>sommi</b> gli esponenti.<br>(2 · 10<sup>3</sup>) · (4 · 10<sup>5</sup>) = 8 · 10<sup>8</sup></li>
    <li><b>Divisione:</b> dividi i numeri e <b>sottrai</b> gli esponenti.<br>(9 · 10<sup>7</sup>) : (3 · 10<sup>2</sup>) = 3 · 10<sup>5</sup></li></ul>
    <p class="small muted">Se il risultato ha il numero davanti ≥ 10, sistemalo: 12 · 10<sup>4</sup> = 1,2 · 10<sup>5</sup>.</p>`},
   {t:"L’ordine di grandezza", h:`
    <p>L’<span class="hl">ordine di grandezza</span> è la potenza di 10 più vicina al numero. Serve per fare stime veloci.</p>
    <p>Scrivi il numero in notazione scientifica <b>a · 10<sup>n</sup></b>:</p>
    <ul><li>se <b>a &lt; 5</b> → l’ordine è <b>10<sup>n</sup></b></li><li>se <b>a ≥ 5</b> → l’ordine è <b>10<sup>n+1</sup></b></li></ul>
    <div class="ex"><b>Esempio:</b> 3,2 · 10<sup>4</sup> → 10<sup>4</sup>; 7,1 · 10<sup>4</sup> → 10<sup>5</sup>.</div>
    <p class="small muted">Alcuni libri usano 3,16 invece di 5: controlla quale regola usa il tuo professore.</p>`}
  ],
  tricks:[
   {t:"Il segno dell’esponente", hand:"Numero grande → esponente positivo. Numero piccolo (sotto 1) → esponente negativo", h:`<p>Prima di contare i salti, decidi il segno guardando il numero: 0,0007 è piccolo, quindi l’esponente sarà negativo.</p>`},
   {t:"Contare i salti", hand:"Ogni salto della virgola = 1 nell’esponente", h:`<p>Metti il dito sulla virgola e saltella fino a dopo la prima cifra diversa da zero. Quanti salti? Quello è l’esponente.</p>`},
   {t:"Prodotto e divisione", hand:"Per (×) le potenze si sommano, per (÷) si sottraggono", h:`<p>10<sup>3</sup> × 10<sup>2</sup> = 10<sup>5</sup> perché 1000 × 100 = 100 000: hai messo insieme gli zeri.</p>`},
   {t:"Ordine di grandezza", hand:"Da 5 in su si arrotonda in su", h:`<p>Come con i voti: 6,5 diventa 7. Così 6 · 10<sup>3</sup> ha ordine 10<sup>4</sup>.</p>`}
  ],
  formulas:[["Notazione scientifica","a · 10ⁿ con 1 ≤ a < 10"],["Prodotto","10ᵃ · 10ᵇ = 10ᵃ⁺ᵇ"],["Divisione","10ᵃ : 10ᵇ = 10ᵃ⁻ᵇ"],["10⁰","= 1"],["Ordine di grandezza","a < 5 → 10ⁿ; a ≥ 5 → 10ⁿ⁺¹"]]
},
{ id:4, color:"#D46A00", title:"Strumenti di misura: portata e sensibilità", short:"Strumenti di misura",
  sub:"Fin dove misura uno strumento e quanto è preciso",
  lessons:[
   {t:"Gli strumenti di misura", h:`
    <p>Ogni grandezza ha i suoi strumenti:</p>
    <ul><li><b>lunghezza:</b> righello, metro a nastro, calibro</li><li><b>massa:</b> bilancia</li><li><b>tempo:</b> cronometro</li><li><b>temperatura:</b> termometro</li></ul>
    <p>Per scegliere lo strumento giusto guardiamo due caratteristiche: la <b>portata</b> e la <b>sensibilità</b>.</p>`},
   {t:"La portata", h:`
    <p>La <span class="hl">portata</span> è il <b>valore più grande</b> che lo strumento può misurare.</p>
    <div class="ex"><b>Esempi:</b> un righello da 30 cm ha portata 30 cm; una bilancia da cucina che arriva a 5 kg ha portata 5 kg.</div>
    <p>Se l’oggetto supera la portata, lo strumento non va bene (o devi fare più misure, sommando gli errori).</p>`},
   {t:"La sensibilità", h:`
    <p>La <span class="hl">sensibilità</span> è la <b>più piccola variazione</b> che lo strumento riesce a misurare: in pratica, il valore di <b>una tacca</b>.</p>
    <div class="ex"><b>Esempio:</b> un righello con le tacche dei millimetri ha sensibilità 1 mm = 0,1 cm.</div>
    <p>Come si calcola: <b>sensibilità = intervallo della scala ÷ numero di tacche (intervalli)</b>.</p>
    <div class="ex"><b>Esempio:</b> scala da 0 a 50 cm con 500 intervalli → 50 ÷ 500 = <b>0,1 cm</b>.</div>`},
   {t:"Più sensibile = tacca più piccola", h:`
    <p>Uno strumento è <b>più sensibile</b> quando la sua sensibilità è un numero <b>più piccolo</b>: nota differenze minori.</p>
    <div class="ex"><b>Esempio:</b> un calibro da 0,05 mm è più sensibile di un righello da 1 mm.</div>
    <p>La misura si scrive con le cifre che lo strumento permette di leggere: con un righello da 1 mm scrivi <b>12,3 cm</b>, non 12,35 cm.</p>`},
   {t:"Altre caratteristiche", h:`
    <ul><li><b>Prontezza:</b> quanto velocemente lo strumento dà la misura (un termometro digitale è più pronto di quello a mercurio).</li>
    <li><b>Strumenti analogici:</b> hanno una scala con le tacche e un indice.</li>
    <li><b>Strumenti digitali:</b> mostrano direttamente le cifre; la sensibilità è l’ultima cifra che cambia.</li></ul>`}
  ],
  tricks:[
   {t:"Portata", hand:"Portata = fin dove PORTA lo strumento", h:`<p>È il massimo, il fondo scala. Come la portata di un camion: oltre non ci sta.</p>`},
   {t:"Sensibilità", hand:"Una persona sensibile nota anche le piccole cose", h:`<p>Uno strumento sensibile nota piccole differenze. Più la tacca è piccola, più è sensibile.</p>`},
   {t:"Calcolo della sensibilità", hand:"Quanto è lunga la scala ÷ quante tacche", h:`<p>È come dividere una pizza: 50 cm divisi in 500 fette = ogni fetta 0,1 cm.</p>`},

{ id:5, color:"#D63B3B", title:"Errori di misura", short:"Errori di misura",

  lessons:[
   {t:"Ogni misura ha un errore", h:`
    <p>Nessuna misura è perfetta: c’è sempre un’<span class="hl">incertezza</span>.</p>

   {t:"Una sola misura", h:`
    <p>Se misuri una volta sola, l’errore è la <b>sensibilità dello strumento</b>.</p>
    <div class="ex"><b>Esempio:</b> righello con sensibilità 0,1 cm, leggi 23,4 cm → <b>(23,4 ± 0,1) cm</b>.</div>`},
   {t:"Tante misure: il valore medio", h:`

   {t:"Errore assoluto", h:`

   {t:"Come in ragioneria", hand:"L’errore percentuale è uno sconto al contrario", h:`<p>Er × 100 = percentuale, esattamente come calcoli il 3% di sconto su un prezzo.</p>`}

{ id:6, color:"#0E8F9B", title:"Cifre significative e arrotondamenti", short:"Cifre significative",

  tricks:[

{ id:7, color:"#B4530A", title:"Densità e altre grandezze derivate", short:"Densità",
  sub:"d = m / V, velocità, area e volume",
  lessons:[
   {t:"Che cos’è la densità", h:`
    <p>La <span class="hl">densità</span> dice quanta <b>massa</b> c’è in un certo <b>volume</b>. Più materia “stretta” in poco spazio = più densità.</p>
    <p style="text-align:center;font-size:1.35em"><b>d = m ÷ V</b></p>
    <div class="ex"><b>Esempio:</b> un kg di piume e un kg di ferro hanno la stessa massa, ma le piume occupano molto più spazio: hanno densità minore.</div>`},
   {t:"Le unità della densità", h:`
    <p>Nel SI: <b>kg/m³</b>. Molto usato anche <b>g/cm³</b>.</p>
    <div class="ex"><b>Regola:</b> 1 g/cm³ = 1000 kg/m³. Da g/cm³ a kg/m³ <b>moltiplichi per 1000</b>.</div>
    <p>Utile anche: 1 g/cm³ = 1 kg/dm³ = 1 kg/L.</p>
    <div class="tbl"><table><tr><th>Materiale</th><th>g/cm³</th><th>kg/m³</th></tr>
    <tr><td>sughero</td><td>0,24</td><td>240</td></tr><tr><td>legno (abete)</td><td>0,45</td><td>450</td></tr>
    <tr><td>olio d’oliva</td><td>0,92</td><td>920</td></tr><tr><td>acqua</td><td>1</td><td>1000</td></tr>
    <tr><td>alluminio</td><td>2,7</td><td>2700</td></tr><tr><td>ferro</td><td>7,9</td><td>7900</td></tr>
    <tr><td>rame</td><td>8,9</td><td>8900</td></tr><tr><td>piombo</td><td>11,3</td><td>11 300</td></tr>
    <tr><td>oro</td><td>19,3</td><td>19 300</td></tr></table></div>`},
   {t:"Trovare massa e volume", h:`
    <p>Dalla formula d = m ÷ V ricavi le altre due:</p>
    <ul><li><b>m = d × V</b></li><li><b>V = m ÷ d</b></li></ul>
    <div class="ex"><b>Esempio:</b> 2 L di olio (d = 0,92 kg/L) → m = 0,92 × 2 = <b>1,84 kg</b>.</div>
    <p>Prima di calcolare, controlla che le unità “vadano d’accordo” (g con cm³, kg con dm³ o m³).</p>`},
   {t:"Galleggia o affonda?", h:`

   {t:"Altre grandezze derivate", h:`

{ id:8, color:"#C42A73", title:"Proporzionalità diretta e inversa", short:"Proporzionalità",
  sub:"Tabelle, grafici e problemi",
  lessons:[
   {t:"Proporzionalità diretta", h:`
    <p>Due grandezze sono <span class="hl">direttamente proporzionali</span> se quando una raddoppia anche l’altra raddoppia. Il loro <b>rapporto</b> è costante:</p>
    <p style="text-align:center;font-size:1.25em"><b>y ÷ x = k</b> &nbsp;→&nbsp; <b>y = k · x</b></p>
    <div class="ex"><b>Esempio:</b> il prezzo delle mele: 1 kg = 1,50 €, 2 kg = 3 €, 3 kg = 4,50 €. k = 1,50 €/kg.</div>`},
   {t:"Il grafico della diretta", h:`
    <p>Il grafico è una <b>retta che passa per l’origine</b> (il punto 0,0).</p>
    <p>Più k è grande, più la retta è ripida.</p>
    <div class="ex"><b>In fisica:</b> la massa di un materiale è direttamente proporzionale al suo volume (k è la densità).</div>`},
   {t:"Proporzionalità inversa", h:`
    <p>Due grandezze sono <span class="hl">inversamente proporzionali</span> se quando una raddoppia l’altra si dimezza. Il loro <b>prodotto</b> è costante:</p>
    <p style="text-align:center;font-size:1.25em"><b>x · y = k</b> &nbsp;→&nbsp; <b>y = k ÷ x</b></p>
    <div class="ex"><b>Esempio:</b> 2 operai fanno un lavoro in 6 giorni, 4 operai in 3 giorni, 6 operai in 2 giorni. k = 12.</div>

   {t:"Come riconoscerle", h:`

    <li>Se nessuno dei due è costante, non c’è proporzionalità.</li></ul>`}
  ],
  tricks:[

  ],
  formulas:[["Diretta","y ÷ x = k → y = k · x (retta per l’origine)"],["Inversa","x · y = k → y = k ÷ x (iperbole)"]]

const rnd=Math.random;
const rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clean=n=>Number(Number(n).toPrecision(12));
const NF=new Intl.NumberFormat("it-IT",{maximumFractionDigits:10});
const fmt=n=>{n=clean(n);return NF.format(n).replace(/-/g,"−")};
const pw=e=>`10<sup>${e<0?"−"+(-e):e}</sup>`;
const sci=(m,e)=>`${fmt(m)} · ${pw(e)}`;
const pickN=(a,n)=>shuffle(a).slice(0,n);

function mc(q,correct,distr,explain){
  const opts=[correct];for(const d of distr){if(!opts.includes(d))opts.push(d);if(opts.length>=4)break}
  const s=shuffle(opts);return{type:"mc",q,options:s,answer:s.indexOf(correct),explain};
}
function num(q,ans,explain,o={}){return{type:"num",q,answer:clean(ans),explain,unit:o.unit||"",tol:o.tol??1e-6,neg:!!o.neg}}

const GEN={1:G1,2:G2,3:G3,4:G4,5:G5,6:G6,7:G7,8:G8,9:G9};
function makeQuestion(topicId,level){return pick(GEN[topicId][level])()}
function makeSet(topicIds,levels,n){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard<400){guard++;const t=pick(topicIds),l=Array.isArray(levels)?levels[out.length%levels.length]:levels;
    const q=makeQuestion(t,l);if(seen.has(q.q))continue;seen.add(q.q);q.topic=t;q.level=l;out.push(q)}
  return out;
}

// fusione tra dispositivi
function mergeList(a,b,del){const m=new Map();for(const x of a||[])m.set(x.id,x);for(const y of b||[]){const x=m.get(y.id);if(!x||(y.mod||0)>(x.mod||0))m.set(y.id,y)}return [...m.values()].filter(x=>!del[x.id])}
function merge(a,b){
  if(!b||b.v!==2)return a;
  const r=JSON.parse(JSON.stringify(a));
  r.del=Object.assign({},b.del||{},a.del||{});
  for(const k of ["compiti","voti","glossario","schede","mappe"])r[k]=mergeList(a[k],b[k],r.del);
  if((b.prefMod||0)>(a.prefMod||0)){for(const k of ["nome","tutorNome","tutorSimbolo","obiettiviVoto","colore","coloriMaterie","avatar","avatarTipo","avatarSimbolo","oraSera","seraOn"])if(b[k]!==undefined)r[k]=b[k];r.fis.selected=b.fis.selected;r.prefMod=b.prefMod}
  if((b.orario&&b.orario.mod||0)>(a.orario.mod||0))r.orario=b.orario;
  for(const id in (b.fis&&b.fis.topics)||{}){const x=r.fis.topics[id]||{read:[],best:{1:0,2:0,3:0},done:false,bestTest:0},y=b.fis.topics[id];
    x.read=[...new Set([...(x.read||[]),...(y.read||[])])];x.best=x.best||{};for(const l of [1,2,3])x.best[l]=Math.max(x.best[l]||0,(y.best||{})[l]||0);
    x.done=!!(x.done||y.done);x.bestTest=Math.max(x.bestTest||0,y.bestTest||0);r.fis.topics[id]=x}
  for(const k in b.tempo||{})r.tempo[k]=Math.max(r.tempo[k]||0,b.tempo[k]);
  for(const k in b.errori||{}){const x=r.errori[k],y=b.errori[k];if(!x||(y.n||0)>(x.n||0))r.errori[k]=y}
  for(const k in b.piani||{}){const x=r.piani[k],y=b.piani[k];if(!x||(y.mod||0)>(x.mod||0))r.piani[k]=y}
  for(const k in r.piani)if(r.del[k])delete r.piani[k];
  r.assegnatiFatti=[...new Set([...(a.assegnatiFatti||[]),...(b.assegnatiFatti||[])])];
  for(const k of ["condivisiVisti","noteViste"])r[k]=[...new Set([...(a[k]||[]),...(b[k]||[])])].slice(-300);
  r.stat={tutor:Math.max(a.stat.tutor||0,(b.stat||{}).tutor||0),corretti:Math.max(a.stat.corretti||0,(b.stat||{}).corretti||0)};
  r.fis.stats={done:Math.max(a.fis.stats.done||0,(b.fis.stats||{}).done||0),ok:Math.max(a.fis.stats.ok||0,(b.fis.stats||{}).ok||0)};
  const RA=a.resets||{},RB=b.resets||{},sel=r.fis.selected;r.resets={};
  for(const k of RESETTABILI){const x=RA[k]||0,y=RB[k]||0;r.resets[k]=Math.max(x,y);if(x===y)continue;
    const [nuovo,vecchio,t]=y>x?[b,a,y]:[a,b,x];
    if(["compiti","voti","glossario","schede","mappe"].includes(k))r[k]=mergeList(nuovo[k]||[],(vecchio[k]||[]).filter(i=>(i.mod||0)>t),r.del);
    else r[k]=JSON.parse(JSON.stringify(nuovo[k]!==undefined?nuovo[k]:blank()[k]));
    if(k==="fis")r.fis.selected=sel}
  r.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return r}

function promemoriaList(st){st=st||S;const out=[];

  for(const k in st.piani){const p=st.piani[k];const c=st.compiti.find(x=>x.id===k);if(!c||c.fatto)continue;
    for(const g of p.giorni||[]){if(g.fatto)continue;const at=parseD(g.data);at.setHours(16,30,0,0);out.push({id:k+"@piano@"+g.data,url:"#piano/"+k,at:at.toISOString(),titolo:`Piano per la verifica di ${c.materia}`,testo:g.attivita.slice(0,140)})}}

async function ponte(path,body){
  if(!CFG.ponteUrl)throw new Error("Il tutor non è ancora collegato: manca l’indirizzo del ponte nel file config.js.");
  if(!user)throw new Error("Per usare il tutor accedi con Google dal Profilo.");
  if(!navigator.onLine)throw new Error("Sei offline: il tutor ha bisogno di internet.");
  const tok=await user.getIdToken();
  const r=await fetch(CFG.ponteUrl.replace(/\/$/,"")+path,{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.errore||"Il tutor non risponde, riprova tra poco.");
  return d}

// ---------- immagini ----------
function comprimi(file,max=1568,q=.82){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);
  ok(c.toDataURL("image/jpeg",q).split(",")[1])};im.onerror=ko;im.src=fr.result};fr.onerror=ko;fr.readAsDataURL(file)})}
function scegliFoto(cb,multi){const i=document.createElement("input");i.type="file";i.accept="image/*";if(multi)i.multiple=true;
  i.onchange=async()=>{for(const f of [...i.files].slice(0,2)){try{cb(await comprimi(f))}catch(e){toast("Foto non leggibile")}}};i.click()}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function detta(lang,onText,onEnd){
  if(!SR){toast("La dettatura funziona con Chrome");return null}
  if(rec){rec.stop();return null}
  rec=new SR();rec.lang=lang||"it-IT";rec.interimResults=true;rec.continuous=false;let fin="";
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;fin=t;onText(t,false)};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("Consenti l’uso del microfono per dettare")};
  rec.onend=()=>{rec=null;onEnd&&onEnd(fin)};rec.start();return rec}
function leggi(testo,lang){if(!window.speechSynthesis){toast("Lettura non disponibile");return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(testo.replace(/\*\*/g,""));u.lang=lang||"it-IT";u.rate=lang&&lang!=="it-IT"?.9:1;
  const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").startsWith(u.lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}

  if(fb&&firebase.messaging&&CFG.vapidKey&&"serviceWorker" in navigator){

      const token=await m.getToken({vapidKey:CFG.vapidKey,serviceWorkerRegistration:reg});
      m.onMessage(pl=>{const n=pl.notification||{};toast((n.title?n.title+": ":"")+(n.body||""),6000)});
      if(ruolo==="studente"&&user){await myDoc().set({pushToken:token},{merge:true})}
      if(ruolo==="genitore"&&user){await fb.db.collection("genitori").doc(user.uid).set({tokens:firebase.firestore.FieldValue.arrayUnion(token)},{merge:true})}
      localStorage.setItem("ss-push","1");toast("Notifiche attive");return true}
    catch(e){toast("Notifiche attive solo con l’app aperta")}}
  localStorage.setItem("ss-push","local");return true}

// ---------- utilità didattiche ----------
const media=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function medieMaterie(){const m={};for(const v of VV())(m[v.materia]=m[v.materia]||[]).push(+v.voto);const out={};for(const k in m)out[k]=media(m[k]);return out}
function mediaGenerale(){const mm=Object.values(medieMaterie());return mm.length?media(mm):null}
function votoNecessario(materia){const vs=VV().filter(v=>v.materia===materia).map(v=>+v.voto),ob=+S.obiettiviVoto[materia];if(!ob||!vs.length)return null;
  const m=media(vs);if(m>=ob)return{ok:true,m,ob};const x=ob*(vs.length+1)-vs.reduce((a,b)=>a+b,0);return{ok:false,m,ob,x:Math.ceil(x*4)/4}}
function lezioniDel(dateStr){const wd=parseD(dateStr).getDay();return wd===0?[]:(S.orario.giorni[wd]||[])}
function prossimaLezione(materia,da){for(let i=1;i<=14;i++){const d=addDays(da||today(),i);if(lezioniDel(d).includes(materia))return d}
  let d=addDays(da||today(),1);if(parseD(d).getDay()===0)d=addDays(d,1);return d}

const starsOf=b=>b>=10?3:b>=8?2:b>=6?1:0;
function fT(id){if(!S.fis.topics[id])S.fis.topics[id]={read:[],best:{1:0,2:0,3:0},done:false,bestTest:0};return S.fis.topics[id]}
const topicById=id=>TOPICS.find(t=>t.id===+id);
function topicPct(id){const t=fT(id),tp=topicById(id);const r=Math.min(t.read.length,tp.lessons.length)/tp.lessons.length;const st=[1,2,3].reduce((a,l)=>a+starsOf(t.best[l]||0),0)/9;return Math.round(r*30+st*50+(t.done?20:0))}
function padronanza(id){const t=fT(id);if(t.done)return["Completato","ok"];const p=topicPct(id);return p===0?["Da iniziare",""]:p<40?["In corso","pri"]:p<75?["Buono","pri"]:["Ottimo","ok"]}
const livNome=b=>b>=10?"Ottimo":b>=8?"Buono":b>=6?"Sufficiente":b?"Da rifare":"Non fatto";

    <button class="btn soft wide" data-act="fask:${id}:${i}">Non ho capito: chiedi al tutor</button>`}
  return `<button class="back" data-go="fisica">${ic("back",18)} Fisica</button><div class="row"><span class="icon-btn" style="background:${tp.color};color:#fff;font-weight:800">${tp.id}</span><h1 style="font-size:1.3em">${tp.title}</h1></div>

function triHtml(tid,i,tri){const k=tid+"-"+i,c=triState[k];const [a,b,d,na,nb,nd]=tri;
  const res=c===a?`${a} = ${b} × ${d}`:c===b?`${b} = ${a} ÷ ${d}`:c===d?`${d} = ${a} ÷ ${b}`:"Tocca la lettera da trovare";
  return `<div class="tri"><div class="shape"></div><div class="bar1"></div><div class="mid"></div><button class="t ${c===a?"cov":""}" data-act="tri:${k}:${a}" aria-label="${na}">${a}</button><button class="l ${c===b?"cov":""}" data-act="tri:${k}:${b}" aria-label="${nb}">${b}</button><button class="r ${c===d?"cov":""}" data-act="tri:${k}:${d}" aria-label="${nd}">${d}</button></div><p class="b" style="text-align:center;font-size:1.15em">${res}</p>`}

function vQuiz(){if(!quiz)return vFisica();const q=quiz.qs[quiz.i],n=quiz.qs.length,tp=topicById(q.topic);let ans="";

  else ans=`<div class="row"><input id="ans" class="field grow" inputmode="decimal" autocomplete="off" placeholder="Scrivi il numero" value="${quiz.answered?esc(quiz.typed||""):""}" ${quiz.answered?"disabled":""} aria-label="Risposta" style="font-size:1.15em">${q.unit?`<span class="b muted">${q.unit}</span>`:""}</div>

function parseUser(str){let s=String(str).trim().replace(/\s+/g,"").replace(/[−–]/g,"-");s=s.replace(/[x×*·]10\^?\(?(-?\d+)\)?/i,"e$1").replace(/[a-zA-Z°%€²³\/µ]+$/,"");const c=[];
  if(s.includes(","))c.push(s.replace(/\./g,"").replace(",","."));else if((s.match(/\./g)||[]).length>1)c.push(s.replace(/\./g,""));else if(/^-?\d{1,3}\.\d{3}$/.test(s)){c.push(s);c.push(s.replace(".",""))}else c.push(s);
  return c.map(Number).filter(x=>s!==""&&isFinite(x))}
function quizAnswer(ok){quiz.answered=true;quiz.lastOk=ok;S.fis.stats.done++;if(ok){quiz.score++;S.fis.stats.ok++}else{const q=quiz.qs[quiz.i];quiz.wrong.push(q);addErrore("Fisica",topicById(q.topic).short,`esercizi di livello ${q.level} sbagliati`)}persist();render()}

const MODO_INTRO={
 compiti:"Scrivimi una domanda o un esercizio, oppure fotografalo. Ti guido passo passo: il ragionamento lo fai tu.",
 lezione:"Dimmi quale argomento non ti è chiaro, oppure fotografa la pagina del libro o gli appunti.",
 interrogazione:"Dimmi materia e argomento: ti faccio 5 domande come un professore e alla fine ti dico come è andata.",
 spiegalo:"Scegli un argomento e spiegamelo come se lo insegnassi a un compagno. Ti dirò se è chiaro e cosa manca.",

let T={sess:null,sending:false,foto:[],draft:"",materia:"",rimasti:null};
function nuovaSess(modo,materia){T.sess={id:uid8(),t:now(),modo:modo||"compiti",materia:materia!==undefined?materia:T.materia,msgs:[],titolo:""};T.foto=[];T.draft=""}
function salvaLocale(){try{const all=JSON.parse(localStorage.getItem(CHK())||"[]").filter(x=>x.id!==T.sess.id);all.unshift(T.sess);localStorage.setItem(CHK(),JSON.stringify(all.slice(0,15).map(s=>Object.assign({},s,{msgs:s.msgs.map(m=>({r:m.r,t:m.t,f:m.f&&m.f.length?["x"]:null}))}))))}catch(e){}}
const linguaDi=()=>T.sess&&T.sess.modo==="ascolto"?(T.sess.materia==="Tedesco"?"de-DE":T.sess.materia==="Inglese"?"en-GB":"it-IT"):"it-IT";

function vTutor(){
  if(pendingAsk){const p=pendingAsk;pendingAsk=null;if(p.nuova||!T.sess||T.sess.msgs.length)nuovaSess(p.modo||"compiti",p.materia||T.materia);else if(p.materia)T.sess.materia=p.materia;
    T.foto=p.foto||[];T.draft=p.testo||"";if(p.invia!==false&&(p.testo||T.foto.length))setTimeout(invia,50)}
  if(!T.sess)nuovaSess("compiti");
  const s=T.sess,last=s.msgs[s.msgs.length-1];
  const msgs=s.msgs.map((m,i)=>bolla(m,i)).join("");
  const quick=last&&last.r==="a"&&!T.sending?`<div class="quick">${[["indizio","Dammi un indizio"],["capito","Non ho capito"],["simile","Esempio simile"],["giusto","È giusto?"]].filter(q=>s.modo==="compiti"||q[0]==="capito").map(q=>`<button class="chip" data-act="tq:${q[0]}">${q[1]}</button>`).join("")}<button class="chip" data-act="tnew">Nuova domanda</button></div>`:"";
  const vuoto=!s.msgs.length?`<div class="msg a fade">${esc(MODO_INTRO[s.modo])}</div>${s.modo==="ascolto"?`<div class="row"><button class="btn soft grow" data-act="tlang:Inglese">Inglese</button><button class="btn soft grow" data-act="tlang:Tedesco">Tedesco</button></div>`:""}`:"";
  return `<div class="chatwrap">
   <div class="chathead">
    <div class="row"><button class="icon-btn" style="background:none" data-go="home" aria-label="Indietro">${ic("back")}</button>
     <div class="tutor-av">${simbolo(S.tutorSimbolo)}</div>
     <div class="grow"><p class="xb">${esc(S.tutorNome||"Orione")}</p><p class="xs muted">Tutor · IA</p></div>
     ${s.msgs.length>1?`<button class="icon-btn" style="width:38px;height:38px" data-act="tesp" aria-label="${prova?"Esporta o condividi":"Esporta"}">${ic("share",18)}</button>`:""}<button class="chip" style="border:1px solid var(--line);background:var(--card);color:var(--pri-ink);min-height:34px" data-act="tmat">${esc(s.materia||"Tutte le materie")}</button></div>
    <div class="quick">${MODI.map(m=>`<button class="chip ${s.modo===m[0]?"on":""}" data-act="tmodo:${m[0]}">${m[1]}</button>`).join("")}</div>
    ${prova?`<span class="chip warm" style="align-self:flex-start">Prova: questa conversazione non finisce nel registro di Davide</span>`:""}<p class="ai-note">Stai parlando con un’intelligenza artificiale: può sbagliare, nel dubbio controlla sul libro.${T.rimasti!=null&&T.rimasti<=10?` Messaggi rimasti oggi: ${T.rimasti}.`:""}</p>
   </div>
   <div class="msgs" id="msgs">${vuoto}${msgs}${T.sending?`<div class="typing"><i></i><i></i><i></i></div>`:""}</div>
   <div class="chatbar">${quick}
    ${T.foto.length?`<div class="thumbs">${T.foto.map((f,i)=>`<div><img src="data:image/jpeg;base64,${f}" alt="Foto da inviare"><button data-act="tunfoto:${i}" aria-label="Togli foto">×</button></div>`).join("")}</div>`:""}
    <div class="row"><button class="icon-btn" data-act="tfoto" aria-label="Fotografa">${ic("cam")}</button>
     <label class="grow" style="display:flex"><span class="sr">Messaggio</span><textarea class="chatin" id="tin" rows="1" placeholder="Scrivi qui…">${esc(T.draft)}</textarea></label>
     <button class="icon-btn" id="tmic" data-act="tmic" aria-label="Parla">${ic("mic")}</button>
     <button class="icon-btn pri" data-act="tsend" aria-label="Invia" ${T.sending?"disabled":""}>${ic("send")}</button></div>
   </div></div>`}
function bolla(m,i){
  if(m.r==="u")return `<div class="msg u">${(m.f||[]).filter(f=>f&&f!=="x").map(f=>`<img src="data:image/jpeg;base64,${f}" alt="Foto inviata">`).join("")}${m.f&&m.f.includes("x")?`<span class="xs">[foto]</span><br>`:""}${esc(m.t)}</div>`;
  let t=m.t,listen="";
  const a=t.match(/<ascolto(?:\s+lingua="(\w+)")?>([\s\S]*?)<\/ascolto>/);
  if(a){const lang=a[1]==="de"?"de-DE":"en-GB";t=t.replace(a[0],"").trim();const shown=m.mostra;
    listen=`<div class="listen"><span class="xs b">Testo da ascoltare (${a[1]==="de"?"tedesco":"inglese"})</span><div class="row wrap"><button class="btn sm" data-act="tsay:${i}:${lang}">${ic("spk",16)} Ascolta</button><button class="btn ghost sm" data-act="tshow:${i}">${shown?"Nascondi":"Mostra"} il testo</button></div>${shown?`<p>${esc(a[2])}</p>`:""}</div>`}
  const mapBtn=m.mappaId&&S.mappe.some(x=>x.id===m.mappaId)?`<div class="listen"><span class="xs b">Mappa salvata tra le tue mappe</span><button class="btn sm" data-go="mappa/${m.mappaId}">Apri la mappa</button></div>`:"";
  return `<div class="msg a">${listen}${mapBtn}${md(t)}${t?`<br><button class="tts" data-act="tread:${i}">${ic("spk",14)} Ascolta</button>`:""}</div>`}
function scrollChat(){const m=$("#msgs");if(m)requestAnimationFrame(()=>{const last=m.lastElementChild;if(last)last.scrollIntoView({block:"end"})})}
function renderTutor(){if(route().name==="tutor"){render();scrollChat()}}

async function invia(testoForzato){
  if(T.sending)return;const inp=$("#tin");let testo=(testoForzato??(inp?inp.value:T.draft)).trim();
  if(!testo&&!T.foto.length)return;
  if(!testo)testo=T.sess.modo==="verifica"?"Ecco la mia verifica corretta.":T.sess.modo==="lezione"?"Mi spieghi questa pagina?":"Mi aiuti con questo?";
  const s=T.sess;s.msgs.push({r:"u",t:testo,f:T.foto.slice()});if(!s.titolo)s.titolo=testo.slice(0,60);
  const foto=T.foto.map(b=>({tipo:"image/jpeg",base64:b}));T.foto=[];T.draft="";T.sending=true;renderTutor();
  try{
    const messaggi=s.msgs.filter(m=>m.r==="u"||m.r==="a").map((m,i,arr)=>({ruolo:m.r==="u"?"user":"assistant",testo:m.t+(m.r==="u"&&m.f&&m.f.length&&i<arr.length-1?" [foto inviata prima]":""),...(i===arr.length-1&&foto.length?{foto}:{})}));
    const r=await ponte("/chat",{messaggi,materia:s.materia||"",modo:s.modo,nomeTutor:S.tutorNome,nome:S.nome,sessione:s.id});
    let risp=r.risposta||"…",mapId=null;const mt=r.meta||{};const mat=MATERIE.includes(mt.materia)?mt.materia:(s.materia||"Altro");
    const mm=risp.match(/<mappa>([\s\S]*?)<\/mappa>/);if(mm){risp=risp.replace(mm[0],"").trim();try{const mp=salvaMappaDaTutor(r.mappa||JSON.parse(mm[1]),mat);if(mp)mapId=mp.id}catch(e){}}
    else if(r.mappa){const mp=salvaMappaDaTutor(r.mappa,mat);if(mp)mapId=mp.id}
    s.msgs.push(Object.assign({r:"a",t:risp||"Ecco la mappa."},mapId?{mappaId:mapId}:{}));T.rimasti=r.rimasti;
    if(mt.errore)addErrore(mat,mt.argomento||"",mt.errore);
    for(const g of mt.glossario||[])addGlossario(mat,g);
    S.stat.tutor++;if(mt.esito==="corretto")S.stat.corretti++;save();
  }catch(e){s.msgs.pop();T.draft=testo;T.foto=foto.map(f=>f.base64);toast(e.message,5000)}
  T.sending=false;for(const m of s.msgs)if(m.f)m.f=m.f.map(f=>f&&f.length>200000?"x":f);
  salvaLocale();salvaChat(T.sess);renderTutor()}
function esportaChat(){const s=T.sess;if(!s)return;const msgs=s.msgs.map(m=>({r:m.r,t:m.t}));esportaSheet({titolo:(s.titolo||"Conversazione con il tutor"),testo:testoMsgs(msgs),html:htmlMsgs(msgs),
  condividi:prova?{tipo:"chat",titolo:s.titolo||"Una spiegazione per te",materia:s.materia||"",dati:{msgs,modo:s.modo}}:null})}

function sceltaMateria(){sheet(`<h2>Su cosa vuoi lavorare?</h2><div class="stack"><button class="btn ${!T.sess.materia?"":"ghost"} wide" data-s="">Tutte le materie (mescola)</button>
  <div class="grid2">${MATERIE.map(m=>`<button class="btn ${T.sess.materia===m?"":"ghost"}" data-s="${m}" style="min-height:52px;font-size:.84em">${m}</button>`).join("")}</div></div>`,(k,bg)=>{T.materia=k;T.sess.materia=k;bg.remove();renderTutor()})}
async function vStorico(){const remoti=await elencoChat();let locali=[];try{locali=JSON.parse(localStorage.getItem(CHK())||"[]")}catch(e){}
  const mappa=new Map();for(const c of locali)mappa.set(c.id,{id:c.id,t:c.t,modo:c.modo,materia:c.materia,titolo:c.titolo,msgs:c.msgs});
  for(const c of remoti)if(!mappa.has(c.id)){let msgs=[];try{msgs=JSON.parse(c.msgs).map(m=>({r:m.r,t:m.t,f:m.f?["x"]:null}))}catch(e){}mappa.set(c.id,{id:c.id,t:c.t,modo:c.modo,materia:c.materia,titolo:c.titolo,msgs})}
  const list=[...mappa.values()].sort((a,b)=>b.t-a.t);window._storico=list;
  $("#main").innerHTML=`<button class="back" data-go="profilo">${ic("back",18)} Profilo</button><h1>Conversazioni precedenti</h1>
   ${list.length?`<div class="card flush list">${list.map((c,i)=>`<button class="row" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line2);text-align:left" data-act="topen:${i}"><span class="grow"><span class="xs b muted" style="display:block">${new Date(c.t).toLocaleDateString("it-IT",{day:"numeric",month:"short"})} · ${esc((MODI.find(m=>m[0]===c.modo)||["","Tutor"])[1])}${c.materia?" · "+esc(c.materia):""}</span><span class="small b">${esc(c.titolo||"Conversazione")}</span></span></button>`).join("")}</div>`:`<div class="card empty">Nessuna conversazione ancora.</div>`}`}

document.addEventListener("input",e=>{if(e.target.id==="tin"){T.draft=e.target.value;e.target.style.height="auto";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"}});
document.addEventListener("keydown",e=>{if(e.target.id==="tin"&&e.key==="Enter"&&!e.shiftKey&&matchMedia("(min-width:700px)").matches){e.preventDefault();invia()}});
function tutorAct(cmd,x,y){const s=T.sess;
  switch(cmd){
   case "tsend":invia();return true;
   case "tesp":esportaChat();return true;
   case "tfoto":scegliFoto(b=>{T.foto=T.foto.concat(b).slice(0,2);T.draft=($("#tin")||{}).value||T.draft;renderTutor()},true);return true;
   case "tunfoto":T.foto.splice(+x,1);renderTutor();return true;
   case "tmic":{const inp=$("#tin"),btn=$("#tmic");const base=inp.value?inp.value+" ":"";const r=detta(linguaDi(),t=>{inp.value=base+t;T.draft=inp.value},()=>{btn&&btn.classList.remove("rec")});if(r&&btn)btn.classList.add("rec");return true}
   case "tq":invia({indizio:"Mi dai un indizio?",capito:"Non ho capito, me lo spieghi in un altro modo?",simile:"Mi fai vedere un esempio simile?",giusto:"Ho finito: è giusto?"}[x]);return true;
   case "tnew":nuovaSess(s.modo);renderTutor();return true;
   case "tmodo":if(s.msgs.length)nuovaSess(x);else s.modo=x;if(x==="ascolto"&&!["Inglese","Tedesco"].includes(s.materia))s.materia="";renderTutor();return true;
   case "tlang":s.materia=x;invia(`Fammi un esercizio di ascolto in ${x.toLowerCase()}.`);return true;
   case "tmat":sceltaMateria();return true;
   case "tread":leggi(s.msgs[+x].t.replace(/<ascolto[\s\S]*?<\/ascolto>/,""),"it-IT");return true;
   case "tsay":{const m=s.msgs[+x].t.match(/<ascolto(?:\s+lingua="\w+")?>([\s\S]*?)<\/ascolto>/);if(m)leggi(m[1],y);return true}
   case "tshow":s.msgs[+x].mostra=!s.msgs[+x].mostra;renderTutor();return true;
   case "topen":{const c=window._storico[+x];if(c){T.sess=JSON.parse(JSON.stringify(c));go("tutor")}return true}
  }return false}

const G={stud:[],cur:null,dati:null,imp:{},log:[],stato:{},caricato:false,
 async init(){try{const q=await fb.db.collection("studenti").get();
   const gh=genitoriCfg();const L=[];
   for(const d of q.docs){const o=d.data();if(!o.json)continue;const eh=o.email?await sha256(String(o.email).toLowerCase()):"";const gp=gh.find(g=>g.hash===eh);
     const pr=d.id===user.uid||!!o.prova||!!gp;const di=d.id===user.uid?GEN_NOME:(o.provaDi||(gp&&gp.nome)||"");
     L.push({uid:d.id,email:o.email||"",prova:pr,mia:d.id===user.uid,provaDi:di,nome:pr?`Simulazione ${di||"genitore"}`:(o.nome||"Studente"),agg:o.aggiornato})}
   this.stud=L;
   this.stud.sort((a,b)=>a.prova-b.prova||b.mia-a.mia);
   const scelto=localStorage.getItem("ss-g-stud");this.cur=(this.stud.find(s=>s.uid===scelto)||this.stud.find(s=>!s.prova)||this.stud[0]||null);
   await gStatoCarica();await gpCarica();if(this.cur)await this.carica();await this.caricaCondivisi()}catch(e){toast("Non riesco a leggere i dati: controlla le regole di Firebase",5000)}this.caricato=true},
 ref(){return fb.db.collection("studenti").doc(this.cur.uid)},
 async carica(){const ref=this.ref();
   const [d,imp,st,lg]=await Promise.all([ref.get(),ref.collection("genitore").doc("impostazioni").get(),ref.collection("sistema").doc("stato").get().catch(()=>null),ref.collection("log").orderBy("t","desc").limit(300).get().catch(()=>({docs:[]}))]);
   try{this.dati=Object.assign(blank(),JSON.parse(d.data().json))}catch(e){this.dati=blank()}
   this.dati.del=this.dati.del||{};this.dati.resets=this.dati.resets||{};
   this.imp=Object.assign({tetto:60,obiettivoMin:20,premio:"",premioSessioni:5,assegnati:[],oraFine:"",oraInizio:""},imp.exists?imp.data():{});
   this.stato=st&&st.exists?st.data():{};
   this.log=lg.docs.map(x=>{const o=x.data();o.id=x.id;o.ms=o.t&&o.t.toDate?o.t.toDate().getTime():Date.parse(o.t)||0;return o});famAscolta()},
 async salvaImp(){this.imp.modDa=GEN_NOME;this.imp.modT=now();await this.ref().collection("genitore").doc("impostazioni").set(this.imp,{merge:true})},
 condivisi:null,
 async caricaCondivisi(){this.condivisi=[];const d=this.stud.find(s=>!s.prova);if(!d)return;
   try{const q=await fb.db.collection("studenti").doc(d.uid).collection("condivisi").orderBy("t","desc").limit(100).get();this.condivisi=q.docs.map(x=>Object.assign({id:x.id},x.data()))}catch(e){}},
 async salvaDati(){const D=this.dati;D.updatedAt=now();await this.ref().set({json:JSON.stringify(D),promemoria:JSON.stringify(promemoriaList(D))},{merge:true})},
 async svuota(coll){const ref=this.ref().collection(coll);for(let i=0;i<20;i++){const q=await ref.limit(300).get();if(q.empty)break;const b=fb.db.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit()}}
};

const LOCK0="ss-lock";
const LOCKK=()=>"ss-lock"+(user?"-"+user.uid.slice(0,10):"");
function lockCfg(){try{let v=localStorage.getItem(LOCKK());if(v===null&&localStorage.getItem(LOCK0)!==null){v=localStorage.getItem(LOCK0);localStorage.setItem(LOCKK(),v);localStorage.removeItem(LOCK0)}return JSON.parse(v||"null")}catch(e){return null}}
function sbloccato(){const t=+sessionStorage.getItem("ss-unl")||0;return now()-t<10*60e3}
setInterval(()=>{if(ruolo==="genitore"&&sbloccato()&&document.visibilityState==="visible")sessionStorage.setItem("ss-unl",now())},60e3);
const rndB=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function creaImpronta(){try{const c=await navigator.credentials.create({publicKey:{challenge:rndB(32),rp:{name:"Studio Smart"},user:{id:rndB(16),name:(user&&user.email)||"genitore",displayName:"Genitore"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
  const cfg=lockCfg()||{};cfg.cred=b64(c.rawId);localStorage.setItem(LOCKK(),JSON.stringify(cfg));toast("Impronta attivata");return true}catch(e){toast("Impronta non disponibile su questo dispositivo");return false}}
async function usaImpronta(){const cfg=lockCfg();if(!cfg||!cfg.cred)return false;
  try{await navigator.credentials.get({publicKey:{challenge:rndB(32),allowCredentials:[{type:"public-key",id:unb64(cfg.cred)}],userVerification:"required",timeout:60000}});return true}catch(e){return false}}
function vLock(){const cfg=lockCfg();return `<div class="lock"><div class="logo" style="width:56px;height:56px;border-radius:16px">${LOGO}</div><h1>Area genitore</h1><p class="muted">Sblocca per continuare</p>
  ${cfg.cred?`<button class="btn" data-act="gimpronta">${ic("shield",18)} Usa l’impronta</button>`:""}
  ${cfg.pin?`<form data-form="pin" style="display:flex;flex-direction:column;align-items:center;gap:10px"><label class="flabel" for="pinin">PIN</label><input id="pinin" class="field" type="password" inputmode="numeric" maxlength="8" style="width:180px;text-align:center;font-size:1.4em;letter-spacing:.3em" autocomplete="off"><button class="btn ghost" type="submit">Sblocca con PIN</button></form>`:""}
  <button class="link" data-act="logout">Esci dall’account</button></div>`}

// eliminazione con Annulla: la cancellazione vera parte dopo 10 secondi
function gDelLog(ids,msg){const ref=G.ref(),uid=G.cur.uid,items=G.log.filter(l=>ids.includes(l.id));if(!items.length)return;
  const t=setTimeout(async()=>{try{const b=fb.db.batch();for(const l of items)b.delete(ref.collection("log").doc(l.id));await b.commit();
      G.log=G.log.filter(l=>!ids.includes(l.id));
      const sess=[...new Set(items.map(l=>l.sessione).filter(Boolean))].filter(s=>!G.log.some(l=>l.sessione===s));
      for(const s of sess)await ref.collection("chat").doc(s).delete().catch(()=>{});
      for(const l of items){GS.arch.delete(uid+"/"+l.id);GS.lette.delete(uid+"/"+l.id)}await gStatoSalva()}catch(e){toast("Non cancellato: aggiorna le regole di Firebase",5000)}
    for(const id of ids)GS.pend.delete(id);render()},10000);
  for(const id of ids)GS.pend.set(id,t);render();
  toastUndo(msg||"Eliminata.",()=>{clearTimeout(t);for(const id of ids)GS.pend.delete(id);render();toast("Ripristinata")})}
async function gProvaOggi(){if(!G.cur||!G.cur.prova)return;if(!confirm("Cancellare tutto quello che è stato fatto oggi in questa simulazione (conversazioni, mappe, compiti, voti, errori, schede, tempo di studio)?"))return;
  const D=G.dati,t=now(),inizio=parseD(today()).getTime(),creato=id=>{const ms=parseInt(String(id).replace(/^s/,"").slice(0,8),36);return ms>=inizio&&ms<=t+6e4};
  for(const k of ["compiti","voti","glossario","schede","mappe"]){for(const x of D[k]||[])if(creato(x.id)){D.del[x.id]=t;if(k==="compiti")delete D.piani[x.id]}D[k]=D[k].filter(x=>!creato(x.id))}
  for(const k in D.errori)if((D.errori[k].ultimo||0)>=inizio){D.errori[k].n=0;D.errori[k].ultimo=t}
  delete D.tempo[today()];D.resets.tempo=t;
  try{await G.salvaDati()}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000);return}
  const ids=G.log.filter(l=>l.ms>=inizio).map(l=>l.id);if(ids.length)gDelLog(ids,"Prove di oggi cancellate.");else{toast("Prove di oggi cancellate");render()}}

const NOMI_RES={mappe:"tutte le mappe",compiti:"tutti i compiti",voti:"tutti i voti",errori:"il quaderno degli errori",orario:"l’orario",glossario:"glossario e schede",tempo:"il tempo di studio",fis:"i progressi di fisica",piani:"i piani di studio",log:"tutte le conversazioni",contatori:"il conteggio dei messaggi di oggi",tutto:"TUTTI i dati"};
async function gReset(k){const chi=G.cur.prova?"della simulazione":"di "+G.cur.nome;
  if(!confirm(`Cancellare ${NOMI_RES[k]} ${chi}? Non si può annullare.`))return;
  if(k==="tutto"){if(!confirm("Sei proprio sicuro? Verranno cancellati tutti i dati."))return;if(confirm("Vuoi prima scaricare una copia di sicurezza? (consigliato)"))scaricaCopia()}
  toast("Cancello…",8000);const D=G.dati,t=now(),B=blank();
  const doKey=key=>{if(["compiti","voti","glossario","schede","mappe"].includes(key))for(const x of D[key])D.del[x.id]=t;
    if(key==="fis")D.fis=Object.assign(JSON.parse(JSON.stringify(B.fis)),{selected:D.fis.selected});else D[key]=JSON.parse(JSON.stringify(B[key]));
    if(key==="orario"){D.orario.mod=t;D.orario.ore=G.dati.orario.ore||B.orario.ore}D.resets[key]=t};
  try{
    if(k==="log"){await G.svuota("log");await G.svuota("chat")}
    else if(k==="contatori")await G.ref().collection("sistema").doc("stato").set({giorno:"",n:0},{merge:true});
    else if(k==="tutto"){for(const key of RESETTABILI)doKey(key);await G.salvaDati();await G.svuota("log");await G.svuota("chat");await G.svuota("foto");await G.ref().collection("sistema").doc("stato").set({giorno:"",n:0},{merge:true})}
    else{doKey(k);if(k==="glossario")doKey("schede");await G.salvaDati()}
    await G.carica();toast("Fatto")}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000)}
  render()}
async function gDelItem(lista,id){const D=G.dati;const it=D[lista].find(x=>x.id===id),pian=D.piani[id];if(!it)return;D[lista]=D[lista].filter(x=>x.id!==id);D.del[id]=now();if(lista==="compiti")delete D.piani[id];
  try{await G.salvaDati();render();toastUndo("Eliminato.",async()=>{delete D.del[id];it.mod=now();D[lista].push(it);if(pian)D.piani[id]=pian;await G.salvaDati();render();toast("Ripristinato")})}catch(e){toast("Non riuscito: aggiorna le regole di Firebase",5000);render()}}
async function gDelErr(i){const k=window._gerr[i];if(!k)return;const e=G.dati.errori[k],n=e.n;e.n=0;e.ultimo=now();
  try{await G.salvaDati();render();toastUndo("Eliminato.",async()=>{e.n=n;e.ultimo=now();await G.salvaDati();render();toast("Ripristinato")})}catch(er){toast("Non riuscito",4000);render()}}

function renderGenitore(){const r=route();
  if(!G.caricato){$("#app").innerHTML=`<div class="lock"><p class="muted">Carico i dati…</p></div>`;return}
  const cfg=lockCfg();if(cfg&&(cfg.cred||cfg.pin)&&!sbloccato()){$("#app").innerHTML=vLock();if(cfg.cred&&!window._autoFp){window._autoFp=1;setTimeout(()=>gAct("gimpronta"),300)}return}
  if(!location.hash.startsWith("#g")){location.hash="g";return}
  const name=r.a?"g/"+r.a:"g";
  const html=name==="g/chat"?gChat(false):name==="g/segn"?gChat(true):name==="g/dati"?gDati():name==="g/imp"?gImp():name==="g/agenda"?gAgenda(r.b):gPanoramica();
  $("#app").innerHTML=`${barraGenitore()}<div class="app gmode">${gnav(name)}<main id="main" class="fade">${html}</main></div>`;if(!GP.guida&&GP.caric&&!window._guida){window._guida=1;setTimeout(benvenuto,400)}}
async function gAct(cmd,x){if(ruolo!=="genitore")return false;if(bloccoLettura(cmd))return true;switch(cmd){
  case "gimpronta":if(await usaImpronta()){sessionStorage.setItem("ss-unl",now());render()}else toast("Impronta non riconosciuta");return true;
  case "gback":if(history.length>1&&location.hash!=="#g")history.back();else go("g");return true;
  case "greload":toast("Aggiorno…");await G.init();render();return true;
  case "gprova":confermaProva();return true;
  case "gstud":{const sim=r=>G.stud.find(s=>s.prova&&s.provaDi===r);const opz=(s,t,d,icn)=>`<button class="opzg ${s&&s.uid===G.cur.uid?"on":""} ${s&&s.prova?"sim":""}" ${s?`data-s="${s.uid}"`:"disabled"}>${ic(icn,20)}<span class="grow"><b>${t}</b><span>${d}</span></span></button>`;
   sheet(`<h2>Di chi vuoi vedere i dati?</h2><p class="small muted">Resti nell’area genitore, come amministratore.</p>
    ${opz(G.stud.find(s=>!s.prova),"Dati di Davide","Quello che fa Davide nella sua app: i dati veri.","user")}
    ${["papà","mamma"].map(r=>{const s=sim(r);return opz(s,"Simulazione "+r,s?(r===GEN_NOME?"Quello che hai fatto tu":"Quello che ha fatto "+(r==="mamma"?"mamma":"papà"))+" usando l’app come Davide.":(r===GEN_NOME?"Non hai ancora usato l’app come Davide.":(r==="mamma"?"Mamma":"Papà")+" non ha ancora usato l’app come Davide."),"edit")}).join("")}
    <button class="btn wide" data-s="usa" style="background:var(--warm);margin-top:4px">${ic("user",18)} Usa l’app come Davide</button>
    <p class="xs muted" style="text-align:center">Lo schermo diventa arancione: quello che fai finisce nella tua simulazione, non nei dati di Davide.</p>`,async(k,bg)=>{if(k==="usa"){bg.remove();confermaProva();return}GS.filtro="";G.cur=G.stud.find(s=>s.uid===k);localStorage.setItem("ss-g-stud",k);bg.remove();await G.carica();render()});return true}
  case "gdelnota":G.imp.note=(G.imp.note||[]).filter(n=>n.id!==x);await G.salvaImp();render();return true;
  case "gesp":{const l=G.log.find(z=>z.id===x);if(!l)return true;const msgs=[{r:"u",t:l.domanda||""},{r:"a",t:String(l.risposta||"").replace(/<ascolto[^>]*>[\s\S]*?<\/ascolto>/g,"").replace(/<mappa>[\s\S]*?<\/mappa>/g,"")}];
    esportaSheet({titolo:(l.materia?l.materia+": ":"")+String(l.domanda||"Domanda").slice(0,60),testo:testoMsgs(msgs),html:htmlMsgs(msgs),condividi:{tipo:"chat",titolo:String(l.domanda||"Una spiegazione per te").slice(0,80),materia:l.materia||"",dati:{msgs,modo:l.modo}}});return true}
  case "gritira":if(!confirm("Ritirare questo elemento? Davide non lo vedrà più."))return true;{const d=G.stud.find(s=>!s.prova);try{await fb.db.collection("studenti").doc(d.uid).collection("condivisi").doc(x).delete();G.condivisi=G.condivisi.filter(c=>c.id!==x);toast("Ritirato");render()}catch(e){toast("Non ritirato: aggiorna le regole di Firebase",5000)}}return true;
  case "gdel":G.imp.assegnati=(G.imp.assegnati||[]).filter(a=>a.id!==x);await G.salvaImp();render();return true;
  case "gres":gReset(x);return true;
  case "gvista":GS.vista=x;render();return true;
  case "garch":GS.arch.add(G.cur.uid+"/"+x);GS.lette.add(G.cur.uid+"/"+x);await gStatoSalva();render();toastUndo("Archiviata.",async()=>{GS.arch.delete(G.cur.uid+"/"+x);await gStatoSalva();render()});return true;
  case "gdisarch":GS.arch.delete(G.cur.uid+"/"+x);await gStatoSalva();render();toast("Riportata tra le attive");return true;
  case "glett":GS.lette.add(G.cur.uid+"/"+x);await gStatoSalva();render();return true;
  case "glettetutte":for(const l of logVisibili())if(l.segnalazione)GS.lette.add(lk(l));await gStatoSalva();render();return true;
  case "gdellog":gDelLog([x]);return true;
  case "gprovaoggi":gProvaOggi();return true;
  case "gverifica":gVerifica();return true;
  case "gbackup":scaricaCopia();return true;
  case "grestore":ripristinaCopia();return true;
  case "greport":resocontoMese();return true;
  case "gcol":localStorage.setItem("ss-gcolore",x);await gpSalva({colore:x});applyAccent();render();return true;
  case "gdelc":gDelItem("compiti",x);return true;
  case "gdelm":gDelItem("mappe",x);return true;
  case "gespm":{const m=(G.dati.mappe||[]).find(z=>z.id===x);if(m)esportaSheet({titolo:"Mappa: "+m.titolo,testo:mappaTesto(m),html:mappaHtmlStampa(m),condividi:G.cur.prova?{tipo:"mappa",titolo:m.titolo,materia:m.materia,dati:{titolo:m.titolo,centro:m.centro,rami:m.rami,materia:m.materia}}:null});return true}
  case "gdelv":gDelItem("voti",x);return true;
  case "gdele":gDelErr(+x);return true;
  case "gcomp":gEditCompito(x);return true;
  case "gvoto":gEditVoto(x);return true;
  case "gsetimpronta":await creaImpronta();sessionStorage.setItem("ss-unl",now());render();return true;
  case "gsetpin":{const p=prompt("Scegli un PIN di 4-8 cifre");if(!p)return true;if(!/^\d{4,8}$/.test(p)){toast("Il PIN deve avere da 4 a 8 cifre");return true}
    const cfg=lockCfg()||{};cfg.pin=await sha256("ss:"+p);localStorage.setItem(LOCKK(),JSON.stringify(cfg));sessionStorage.setItem("ss-unl",now());toast("PIN impostato");render();return true}
  case "gnolock":if(confirm("Togliere il blocco dell’area genitore su questo telefono?")){localStorage.removeItem(LOCKK());render()}return true;
 }return false}

  if(f==="gimp"){const I=G.imp;I.tetto=Math.max(5,+$("#gt").value||60);I.oraInizio=$("#gi").value;I.oraFine=$("#gf").value;I.obiettivoMin=Math.max(5,+$("#go").value||20);I.premio=$("#gp").value.trim();I.premioSessioni=Math.min(7,Math.max(1,+$("#gps").value||5));
    try{await G.salvaImp();toast("Impostazioni salvate")}catch(e){toast("Non salvato: controlla le regole di Firebase")}return true}
